add(1,'Модель фон Неймана и CPU','Программа и данные находятся в адресуемой памяти; процессор выполняет инструкции.',
`<p><b>Архитектура фон Неймана</b> — модель, в которой программа хранится в памяти как последовательность инструкций, а память содержит и команды, и данные.</p><p><b>CPU</b> выбирает инструкции и исполняет их. <b>CU</b> (устройство управления) организует выполнение, <b>ALU</b> выполняет арифметические и логические операции, <b>RAM</b> хранит команды и данные. <b>Instruction Pointer</b> (на x86-64 — RIP) указывает на адрес следующей исполняемой инструкции.</p><p>В классической модели команды рассматриваются последовательно; современные процессоры могут одновременно обрабатывать разные стадии нескольких инструкций.</p>`,
{title:'Код и машина',body:'<code>int c = a + b;</code> → компилятор создаёт машинные команды; CPU загружает их и получает данные, ALU вычисляет сумму. Указатель инструкций позволяет продолжить исполнение.'},'neumann',[
Q('Что является общей особенностью инструкций и данных в модели фон Неймана?',['Хранятся в общей адресуемой памяти','Хранятся только в регистрах','Инструкции всегда лежат на диске'],0,'И инструкции, и данные представлены в памяти, к которой обращается CPU.'),
Q('Что делает ALU?',['Планирует процессы ОС','Исполняет арифметические и логические операции','Переводит виртуальные адреса'],1,'ALU — арифметико-логическое устройство.')],{source:'Лекция 1 · «Машина фон Неймана»; Таненбаум §1.3'});
add(1,'ISA, ассемблер и микроархитектура','ISA описывает доступные инструкции; микроархитектура — как они реализованы.',
`<p><b>ISA</b> (Instruction Set Architecture) задаёт команды процессора, регистры и правила поведения этих команд. Примеры: x86-64, ARM, MIPS, RISC-V.</p><p><b>Машинный код</b> — байты инструкций, которые понимает процессор. <b>Ассемблер</b> — человекочитаемые мнемоники команд (<code>mov</code>, <code>add</code>, <code>ret</code>) и программа их перевода в машинный код.</p><p><b>Микроархитектура</b> — внутренняя реализация ISA: кэши, конвейеры, исполнительные блоки. Разные CPU могут иметь одну ISA и различаться скоростью.</p>`,
{title:'Одинаковая программа — разные CPU',body:'Два процессора Intel и AMD могут исполнять один x86-64 бинарный файл, хотя внутреннее исполнение инструкций у них устроено по-разному.'},'isa',[
Q('Что именно определяет ISA?',['Скорость вентилятора','Набор команд и их поведение','Размер конкретного кэша L3'],1,'ISA описывает архитектурный интерфейс программ к процессору.'),
Q('У двух CPU одинаковая ISA. Обязательно ли у них равная скорость?',['Да','Нет, микроархитектура может отличаться','Только при одинаковом объёме RAM'],1,'ISA описывает совместимость команд, а не производительность.')],{source:'Лекция 1 · «ISA»; Таненбаум §1.3'});
add(1,'Регистры и указатель инструкций','Регистры — крошечная сверхбыстрая память непосредственно в CPU.',
`<p><b>Регистр</b> хранит значение, с которым CPU может работать непосредственно. В x86-64 <code>RIP</code> — указатель инструкций, <code>RSP</code> — указатель вершины стека, <code>RBP</code> часто служит базовым указателем кадра стека.</p><p><b>Регистры общего назначения</b> используются для значений, адресов и промежуточных результатов. <b>FLAGS/RFLAGS</b> содержит биты состояния, например ZF (результат равен нулю) и CF (перенос).</p><p>Сохранение регистров — важная часть <b>контекста исполнения</b>, который ОС сохраняет при переключении между задачами.</p>`,
{title:'Почему надо сохранять регистры?',body:'Поток А вычислял сумму и был вытеснен. Когда CPU вернётся к А, ОС должна восстановить значения регистров, включая адрес продолжения выполнения.'},'registers',[
Q('Какой регистр x86-64 указывает на исполняемую инструкцию?',['RSP','RIP','RFLAGS'],1,'RIP — instruction pointer.'),
Q('Для чего служит регистр флагов?',['Содержит признаки результата операций','Хранит весь код программы','Всегда равен PID'],0,'Флаги помогают выполнять проверки и условные переходы.')],{source:'Лекция 1 · «Регистры»; Таненбаум §1.3'});
add(1,'Конвейер исполнения (pipeline)','CPU может выполнять разные стадии нескольких инструкций одновременно.',
`<p>Упрощённый конвейер из презентации: <b>IF</b> (fetch: взять команду), <b>ID</b> (decode: распознать), <b>EX</b> (execute: выполнить), <b>MEM</b> (обращение к памяти), <b>WB</b> (запись результата).</p><p>Пока команда №1 выполняется, команда №2 может декодироваться, а команда №3 — загружаться. Это повышает <b>пропускную способность</b>, но не обязательно уменьшает задержку отдельной инструкции.</p><p>Зависимости данных и условные переходы могут вызывать простои конвейера. В лекции №4 вернёмся к микрооперациям и предсказанию ветвлений.</p>`,
{title:'Конвейер на заводе',body:'Одна деталь красится, другая сушится, третья упаковывается. На всех этапах работа идёт одновременно; аналогично разные инструкции занимают разные стадии конвейера.'},'pipeline',[
Q('Что позволяет конвейер?',['Исполнять разные стадии нескольких инструкций одновременно','Превратить RAM в SSD','Избавиться от всех зависимостей'],0,'Несколько инструкций находятся на разных стадиях в один момент времени.'),
Q('Что означает стадия WB?',['Запись результата','Ожидание ОС','Выбор процесса'],0,'Write-back — сохранение результата, обычно в регистр.')],{source:'Лекция 1 · «Конвейер»; Таненбаум §1.3'});
add(1,'Зачем нужна ОС и ядро','ОС даёт приложениям удобные абстракции и распределяет ресурсы.',
`<p><b>Операционная система</b> — программный комплекс, управляющий аппаратными ресурсами и предоставляющий интерфейсы программам и пользователям. <b>Ядро</b> — центральная часть ОС, которая обеспечивает управление процессами, памятью, устройствами и механизмами защиты.</p><p>По Таненбауму у ОС две основные роли: <b>расширенная машина</b> (скрывает сложность железа за файлами, процессами и вызовами) и <b>менеджер ресурсов</b> (распределяет CPU, память и устройства).</p><p><b>Мультиплексирование во времени</b> — поочерёдное выделение CPU задачам; <b>в пространстве</b> — разделение памяти/хранилища на участки.</p>`,
{title:'Запись в файл',body:'Программа вызывает <code>write(fd, buf, n)</code>. Она не управляет головкой диска напрямую — ядро и драйверы организуют запись.'},'os',[
Q('Какую роль Таненбаум приписывает ОС?',['Только браузер','Расширенная машина и менеджер ресурсов','Только компилятор'],1,'ОС одновременно абстрагирует железо и управляет ресурсами.'),
Q('Поочерёдное выделение CPU разным задачам — это…',['Разделение во времени','Разделение памяти на страницы','Файловый маппинг'],0,'Процессы получают интервалы процессорного времени.')],{source:'Лекция 1 · «Зачем ОС?», «Что делает ядро?»; Таненбаум §1.1'});
add(1,'Взаимодействие с устройствами: MMIO и порты','Железо может предоставлять регистры через адреса памяти или порты.',
`<p><b>Memory-mapped I/O (MMIO)</b>: регистры устройства отображаются в адресное пространство; чтение/запись по специальным адресам взаимодействует с устройством.</p><p><b>Port-mapped I/O</b> в x86 использует отдельное пространство портов и специальные инструкции <code>in</code>/<code>out</code>. Для прикладных программ прямой доступ обычно запрещён и контролируется ядром.</p><p>Эти способы не равны «чтению файла»: это аппаратные механизмы обращения к устройствам.</p>`,
{title:'Пример из слайдов',body:'Для клавиатуры x86 исторически используется порт <code>0x60</code>; для вывода текста в VGA можно было писать в видеопамять по адресу <code>0xB8000</code> в соответствующем режиме.'},'io',[
Q('Что верно про MMIO?',['Устройство доступно через специально назначенные адреса памяти','Только через поток stdin','Только через интернет'],0,'При MMIO регистры устройства видны как адресуемые области.'),
Q('Какие инструкции x86 используют для port-mapped I/O?',['in / out','fork / exec','lock / unlock'],0,'in и out работают с отдельным пространством портов ввода-вывода.')],{source:'Лекция 1 · «Memory-mapped I/O», «Port-mapped I/O»'});
add(1,'Прерывания: как ядро узнаёт о событиях','Устройство или процессор сообщает о событии, чтобы запустить обработчик.',
`<p><b>Прерывание</b> — механизм передачи управления обработчику события. На лекции выделены аппаратные прерывания, исключения CPU (например, деление на ноль) и программно инициируемые прерывания.</p><p>При прерывании процессор сохраняет необходимые данные для возврата и переходит к <b>обработчику</b>. На x86 обработчики выбираются по <b>IDT</b> — таблице дескрипторов прерываний. Регистром IDTR задаётся её положение. После обработки выполнение может продолжиться; переключение процесса не является обязательным.</p><p>Контроллер прерываний помогает доставлять аппаратные события. Системные вызовы используют отдельный механизм перехода в ядро (например, <code>syscall</code>) и не являются обычными внешними аппаратными прерываниями.</p>`,
{title:'Нажали кнопку',body:'Клавиатура сообщает событие → CPU переходит к обработчику ОС → ядро считывает информацию → приложение позже получает её через системный интерфейс.'},'interrupt',[
Q('Что такое IDT в x86?',['Таблица, определяющая обработчики прерываний и исключений','Таблица файлов FAT','Память видеокарты'],0,'IDT — Interrupt Descriptor Table.'),
Q('Обязателен ли переход на другой процесс при каждом прерывании?',['Да','Нет','Только при нажатии клавиши'],1,'После обработки текущая программа может продолжиться; планировщик не обязан менять процесс.')],{source:'Лекция 1 · «Прерывания», «Как их обрабатывать?»',resources:['interrupt-video']});
add(1,'Режимы CPU и системные вызовы','Пользовательский код получает услуги ядра через syscall.',
`<p>В системах x86 обычно используются два основных уровня привилегий: <b>ring 3</b> (пользовательский режим) и <b>ring 0</b> (режим ядра). Приложения не могут произвольно выполнять привилегированные команды и обращаться ко всей аппаратуре.</p><p><b>Системный вызов</b> — контролируемый переход из пользовательского кода в ядро для выполнения операции, требующей полномочий ОС: <code>read</code>, <code>write</code>, <code>fork</code>, <code>mmap</code> и т. д.</p><p>Схема: приложение передаёт аргументы → выполняется механизм syscall → ядро проверяет параметры, исполняет действие → возвращает результат приложению.</p>`,
{title:'Пример из лабораторной №1',body:'Вызов <code>pipe(fd)</code> просит ядро создать буфер канала и дескрипторы; <code>read</code> и <code>write</code> передают данные через ядро.'},'syscall',[
Q('Где обычно выполняется обычное приложение на x86?',['Ring 0','Ring 3','Только в BIOS'],1,'Ring 3 — пользовательский уровень; ядро работает с привилегиями ring 0.'),
Q('Что делает системный вызов?',['Просит ядро выполнить защищённую операцию','Сразу выключает компьютер','Создаёт новую ISA'],0,'Это безопасный интерфейс к ресурсам ОС.')],{source:'Лекция 1 · «Системные вызовы»; Лекция 4 · «Кольца защиты»'});
add(1,'Типы ядер и общая архитектура ОС','Как распределить функции между ядром и пользовательскими службами?',
`<p><b>Монолитное ядро</b> выполняет многие службы (планирование, драйверы, файловые системы) в режиме ядра. Это может быть эффективно, но ошибки привилегированного кода опасны для всей системы.</p><p><b>Микроядро</b> оставляет в привилегированной части минимальный набор механизмов (например, IPC и базовое управление памятью/планированием), вынося многие сервисы в пользовательские процессы.</p><p><b>Гибридные подходы</b> совмещают элементы разных архитектур. Реальные ОС сложнее простой классификации.</p>`,
{title:'Почему есть компромисс?',body:'Если драйвер находится внутри ядра, вызовы могут быть дешевле, но ошибка драйвера способна привести к краху всей ОС. Если драйвер изолирован в процессе, изоляция выше, зато появляется коммуникация между процессами.'},'kernel',[
Q('Для чего характерно монолитное ядро?',['Многие системные службы выполняются в режиме ядра','Отсутствие планировщика','Только одно приложение'],0,'В монолитной модели функциональность преимущественно внутри ядра.'),
Q('Какова идея микроядра?',['Сосредоточить все программы в ядре','Сделать привилегированную часть минимальной','Отменить системные вызовы'],1,'Микроядро выносит часть сервисов в изолированные пользовательские процессы.')],{source:'Лекция 1 · «Типы ядер»; Таненбаум §1.7',advanced:true});
// ==================== ЛЕКЦИЯ 2 ====================
add(2,'Программа, процесс и PCB','Программа — код на диске; процесс — выполняющийся экземпляр.',
`<p><b>Программа</b> — набор инструкций, который можно запустить. <b>Процесс</b> — экземпляр её выполнения с ресурсами и состоянием. Запуск одной программы дважды обычно создаёт два процесса.</p><p>Процессу соответствуют <b>PID</b>, собственное виртуальное адресное пространство, таблица файловых дескрипторов и сведения для планирования. Ядро хранит управляющие данные в <b>PCB</b> (Process Control Block): регистры/контекст, состояние, идентификаторы, ресурсы и другую служебную информацию.</p><p>Процесс — не просто файл и не только PID. Это совокупность состояния исполнения и выделенных ресурсов.</p>`,
{title:'Две копии одной программы',body:'Два запуска <code>./parent</code> — два процесса с различными PID и независимыми адресными пространствами.'},'process',[
Q('Что отличает процесс от программы?',['Процесс — выполняющийся экземпляр со своим состоянием','Процесс — текст на диске','Это точные синонимы'],0,'Программа — пассивный код; процесс — его исполнение.'),
Q('Что такое PCB?',['Блок управления процессом в ОС','Программа компилятора','Кэш процессора'],0,'PCB содержит данные, по которым ОС управляет процессом.')],{source:'Лекция 2 · «Понятие процесса», «Контекст процесса»; Таненбаум §2.1'});
add(2,'Адресное пространство процесса','Виртуальные адреса и ресурсы обычно изолированы между процессами.',
`<p>В типичном адресном пространстве процесса различают <b>код (text)</b>, <b>данные</b>, <b>кучу (heap)</b> и <b>стек (stack)</b>. Куча используется для динамических выделений памяти, стек — в том числе для кадров вызова функций и локальных данных.</p><p>Процессы обычно изолированы: один процесс не может произвольно прочитать память другого. Однако ОС позволяет организовать разделяемую память явным образом.</p><p><b>Важно:</b> виртуальный адрес не равен непосредственно физическому адресу в RAM; трансляцию изучим в лекции №4.</p>`,
{title:'Где лежат переменные?',body:'Локальная <code>int x</code> часто живёт в стеке (или регистре); <code>new int</code> выделяет динамическую память в куче. Это упрощённая модель: оптимизатор может менять размещение.'},'address',[
Q('Где обычно находятся данные динамического выделения памяти?',['В куче','В IDT','В PID'],0,'Heap служит для динамических выделений памяти.'),
Q('Может ли один обычный процесс читать любую память другого?',['Да, всегда','Нет, память изолирована механизмами ОС/CPU','Только с помощью printf'],1,'Изоляция адресных пространств — базовая защита.')],{source:'Лекция 2 · «Память процесса»; Таненбаум §2.1'});
add(2,'Состояния процесса','Планировщик переводит задачи между готовностью, исполнением и ожиданием.',
`<p>Базовые состояния: <b>New</b> (создаётся), <b>Ready</b> (готов исполняться, ждёт CPU), <b>Running</b> (исполняется), <b>Waiting/Blocked</b> (ждёт события, например ввода-вывода), <b>Terminated</b> (завершён).</p><p>Переход <b>Ready → Running</b> происходит при выборе планировщиком. <b>Running → Ready</b> — при вытеснении; <b>Running → Waiting</b> — при блокирующей операции; <b>Waiting → Ready</b> — когда событие произошло.</p><p>Готовый процесс <b>не обязательно</b> исполняется прямо сейчас. Блокированный — не может продолжить, пока не произойдёт нужное событие.</p>`,
{title:'Читаем из пустого pipe',body:'Родитель вызывает блокирующий <code>read</code>, данных нет → поток переходит в ожидание; ребёнок пишет байты → родитель становится готовым к выполнению.'},'states',[
Q('Процесс готов к работе, но CPU занят. Его состояние?',['Ready','Blocked','Terminated'],0,'Ready означает готовность и ожидание процессорного времени.'),
Q('Блокирующий read ждёт данные. Что происходит?',['Переход в ожидание','Обязательное завершение процесса','Ускорение CPU'],0,'Поток блокируется до появления данных, EOF или ошибки.')],{source:'Лекция 2 · «Состояния процесса», «Блокирование»'});
add(2,'Переключение контекста','Чтобы задачи делили CPU, ОС сохраняет и восстанавливает состояние выполнения.',
`<p><b>Контекст</b> включает значения регистров, указатель инструкций, сведения для планирования и другую информацию. <b>Переключение контекста</b> — сохранение состояния текущей задачи и восстановление состояния другой.</p><p>Причины: истёк квант времени, задача заблокировалась, проснулась более приоритетная задача и др. Управляющий переход в ядро может происходить через прерывание или системный вызов.</p><p>Переключение стоит времени: нужно выполнить код ядра и иногда теряется полезное содержимое кэшей/TLB. Не каждое прерывание приводит к смене задачи.</p>`,
{title:'Два редактора',body:'У браузера и IDE по одному ядру на двоих: OS быстро переключает задачи, сохраняя точку продолжения каждой. Пользователь видит одновременную работу.'},'switch',[
Q('Что ОС сохраняет при смене исполняемой задачи?',['Её контекст, включая регистры','Только файл программы','Лишь температуру CPU'],0,'Без сохранения регистров нельзя корректно продолжить прерванный код.'),
Q('Возможен ли переход в ядро без смены процесса?',['Да','Нет','Только при fork'],0,'Обработчик может вернуть управление тому же исполняемому потоку.')],{source:'Лекция 2 · «Контекст процесса», «Прерывание процесса»'});
add(2,'Создание и завершение: fork, exec, wait','Unix часто создаёт процесс копированием родителя, затем запускает другую программу.',
`<p><code>fork()</code> создаёт дочерний процесс. В обоих продолжается выполнение после <code>fork</code>: у родителя возвращается PID ребёнка, у ребёнка — 0, при ошибке у родителя — −1.</p><p><code>exec*</code> заменяет образ выполняемой программы в текущем процессе, не создавая новый процесс. <code>wait/waitpid</code> позволяет родителю дождаться завершения и получить статус.</p><p>После <code>fork</code> память логически раздельна (эффективно реализуется Copy-on-Write). Открытые файловые дескрипторы наследуются, если специально не настроено иначе.</p>`,
{title:'Схема из лабораторной №1',body:'<code>pipe(p); pid=fork();</code> → ребёнок настраивает дескрипторы и запускает <code>exec</code>; родитель обменивается байтами через pipe и вызывает <code>waitpid</code>.'},'fork',[
Q('Что возвращает fork() в дочернем процессе?',['PID родителя','0','Всегда −1'],1,'Ноль позволяет ветке ребёнка отличить себя от родителя.'),
Q('Что делает exec()?',['Создаёт второй процесс','Заменяет исполняемую программу текущего процесса','Закрывает все файлы всей системы'],1,'exec не создаёт процесс — он загружает другую программу в уже существующий.')],{source:'Лекция 2 · «Создание процесса»; Таненбаум §2.1; практика лабораторной'});
add(2,'Файловые дескрипторы','FD — небольшой номер, по которому процесс обращается к открытому объекту ядра.',
`<p><b>Файловый дескриптор</b> — не адрес в памяти и не имя файла, а целочисленный индекс в таблице дескрипторов процесса. Чаще всего <code>0 = stdin</code>, <code>1 = stdout</code>, <code>2 = stderr</code>.</p><p>Системные вызовы <code>read(fd,...)</code> и <code>write(fd,...)</code> работают не только с обычными файлами, но и с каналами, сокетами и другими объектами. <code>close(fd)</code> закрывает дескриптор в данном процессе.</p><p>После <code>fork</code> два процесса могут иметь дескрипторы, ссылающиеся на один и тот же открытый объект ядра.</p>`,
{title:'Один API для разных ресурсов',body:'<code>write(1, "hi\n", 3)</code> пишет в stdout. Если оболочка перенаправила stdout в pipe, вызов остаётся тем же.'},'fds',[
Q('Что значит файловый дескриптор 1 в обычной Unix-программе?',['stdin','stdout','stderr'],1,'1 обычно соответствует стандартному выводу.'),
Q('Можно ли использовать write для pipe?',['Да','Нет, только для файлов','Только через printf'],0,'Pipe представлен дескрипторами и поддерживает read/write.')],{source:'Лекция 2 · «Файловый дескриптор», «Как работает pipe»'});
add(2,'IPC: обмен между процессами','Изолированным процессам нужны явные каналы коммуникации.',
`<p><b>IPC</b> (Inter-Process Communication) — обмен данными и согласование работы процессов. Способы: <b>pipe/FIFO</b>, сокеты, очереди сообщений, общая память, сигналы.</p><p>Каналы бывают <b>simplex</b> (одно направление), <b>half-duplex</b> (оба направления по очереди), <b>full-duplex</b> (оба направления одновременно). По представлению данных различают <b>поток байтов</b> и <b>сообщения с границами</b>.</p><p>В обычном Unix <code>pipe</code> передаёт байты в одном направлении и не хранит границы вызовов <code>write</code>. Для двустороннего обмена обычно нужны два pipe.</p>`,
{title:'Поток байтов ≠ сообщения',body:'Если отправить <code>"12"</code> и затем <code>"34"</code>, чтение может вернуть <code>"1234"</code> или части. Границы строк нужно определять самому (например, через <code>\n</code>).'},'ipc',[
Q('Какой тип передачи у обычного Unix pipe?',['Поток байтов без границ сообщений','Готовые JSON-сообщения','Только целые числа'],0,'Pipe — байтовый поток; границы write не сохраняются как сообщения.'),
Q('Сколько обычных однонаправленных pipe удобно использовать для связи туда-обратно?',['Один обязательно','Два','Ноль'],1,'По одному pipe на каждое направление.')],{source:'Лекция 2 · «Кооперация процессов», «Аспекты организации передачи данных»'});
add(2,'Pipe и FIFO: схема работы','Ядро хранит буфер между концом записи и концом чтения.',
`<p><code>pipe(fd)</code> возвращает пару: <code>fd[0]</code> для чтения и <code>fd[1]</code> для записи. <code>write</code> кладёт байты в буфер ядра, <code>read</code> забирает их. Канал имеет конечную ёмкость.</p><p><b>Неименованный pipe</b> обычно создаётся до <code>fork</code> и наследуется. <b>FIFO</b> — именованный канал в файловой системе: процессы могут открыть его по пути, даже если не имеют общего родителя.</p><p>Pipe на Unix не обязан соединять строго два процесса: дескрипторы могут наследоваться/дублироваться несколькими процессами. Но типичный простой пример — один читатель и один писатель.</p>`,
{title:'Два конца канала',body:'Родитель пишет <code>"8 4\n"</code> в <code>fd[1]</code> → ребёнок читает байты из <code>fd[0]</code> и вычисляет сумму. Канал сам не «понимает» числа.'},'pipe',[
Q('Какой конец pipe обычно используют для чтения?',['fd[0]','fd[1]','Оба одновременно'],0,'fd[0] — читающий конец, fd[1] — пишущий.'),
Q('Чем FIFO отличается от неименованного pipe?',['Имеет имя/путь в ФС','Содержит только числа','Не требует ядра'],0,'Именованный FIFO доступен по пути файловой системы.')],{source:'Лекция 2 · «Как работает pipe»; лабораторная №1'});
add(2,'Блокировка, EOF, O_NONBLOCK и poll','Нет данных — не всегда ошибка, а завершение записи — отдельное событие.',
`<p>Если читающая сторона вызвала блокирующий <code>read</code> при пустом pipe, но писатели ещё существуют, она ждёт. Если <b>все</b> пишущие концы закрыты и буфер пуст, <code>read</code> вернёт <code>0</code> — <b>EOF</b>.</p><p>В режиме <code>O_NONBLOCK</code> операция не ждёт: при невозможности немедленно прочитать/записать данные обычно возвращает ошибку <code>EAGAIN/EWOULDBLOCK</code>. <code>poll</code> позволяет ожидать готовности дескрипторов без самостоятельного цикла активного опроса.</p><p>Обязательно закрывать ненужные концы pipe после <code>fork</code>: оставленный писательский дескриптор может помешать получению EOF.</p>`,
{title:'Почему read «висит»?',body:'Ребёнок прочитал всё, но родитель оставил открытой копию дескриптора записи. Для ядра ещё существует писатель → EOF не наступает, пока последний пишущий дескриптор не закрыт.'},'pipe',[
Q('Что означает read() == 0 для пустого pipe?',['EOF: пишущих концов больше нет','Данных пока нет, но писатели есть','Успешная запись'],0,'Ноль означает конец потока, когда буфер опустел и все пишущие концы закрыты.'),
Q('Зачем poll()?',['Ждать готовности дескрипторов к операциям','Создавать поток','Компилировать программу'],0,'poll сообщает, когда можно работать с выбранными дескрипторами.')],{source:'Лекция 2 · «Как работает pipe»; лабораторная №1',advanced:true});
// ==================== ЛЕКЦИЯ 3 ====================
add(3,'Классификация Флинна: SISD, SIMD, MISD, MIMD','Классификация способов исполнения команд и обработки данных.',
`<p><b>SISD</b> — один поток команд, один поток данных (классический последовательный CPU). <b>SIMD</b> — одна команда обрабатывает несколько элементов данных (векторизация, SSE/AVX/NEON).</p><p><b>MISD</b> — несколько потоков команд над одним потоком данных, редко встречающаяся модель. <b>MIMD</b> — разные потоки команд обрабатывают разные данные, как на многоядерных CPU.</p><p>SIMD и многопоточность — разные уровни параллелизма: SIMD работает на уровне одной машинной инструкции, а потоки — на уровне независимых путей исполнения.</p>`,
{title:'Обработка изображения',body:'SIMD-инструкция может сложить сразу несколько пар пикселей. MIMD — разные ядра обрабатывают разные фрагменты изображения.'},'flynn',[
Q('Что соответствует векторной инструкции над массивом элементов?',['SISD','SIMD','MISD'],1,'SIMD = Single Instruction, Multiple Data.'),
Q('Какой класс характерен для независимых программ на нескольких ядрах?',['MIMD','SISD','MISD'],0,'MIMD = Multiple Instruction, Multiple Data.')],{source:'Лекция 3 · слайды 4–6'});
add(3,'Параллелизм и псевдопараллелизм','Несколько задач могут чередоваться даже на одном ядре.',
`<p><b>Конкурентность (concurrency)</b> означает, что задачи продвигаются в перекрывающиеся интервалы времени, иногда чередуясь. <b>Параллельность (parallelism)</b> — одновременное выполнение на разных ядрах/вычислителях.</p><p>Если активных потоков больше, чем доступных логических CPU, ОС планирует их по очереди. <b>Overhead</b> — накладные расходы на планирование, создание и синхронизацию.</p><p>Добавление потоков не гарантирует ускорения: для маленькой задачи накладные расходы могут оказаться больше выигрыша.</p>`,
{title:'6 потоков на 2 ядрах',body:'В один момент одновременно выполняются не более двух программных потоков (если по одному на логический CPU); остальные ждут своей очереди. Это не означает, что программа обязательно быстрее последовательной.'},'cores',[
Q('Может ли одно ядро обслуживать несколько потоков с переключением?',['Да','Нет','Только на ARM'],0,'ОС распределяет процессорное время между потоками.'),
Q('Что может произойти при создании тысячи потоков ради очень маленькой работы?',['Ускорение обязательно ×1000','Замедление из-за накладных расходов','Исчезновение синхронизации'],1,'Создание и переключение потоков требуют времени.')],{source:'Лекция 3 · слайды 6, 15–16'});
add(3,'Ускорение и закон Амдала','Последовательная часть программы ограничивает масштабирование.',
`<p><b>Ускорение</b>: <code>S = Tₛ / Tₚ</code>, где Tₛ — время последовательного запуска, Tₚ — параллельного. <b>Эффективность</b>: <code>E = S / p</code>, p — число вычислителей.</p><p><b>Закон Амдала</b>: <code>S(p) = 1 / (a + (1−a)/p)</code>, где a — последовательная доля программы. При бесконечном числе ядер верхний предел равен <code>1/a</code> (если a &gt; 0).</p><p>Реальное ускорение может быть ниже из-за синхронизации и накладных расходов, иногда даже <b>меньше единицы</b>.</p>`,
{title:'Если 20% программы последовательны',body:'При 4 ядрах: <code>S = 1 / (0.2 + 0.8/4) = 2.5</code>, а не 4. Сдвигай ползунки на схеме и проверь.'},'amdahl',[
Q('Почему 16 ядер не гарантируют ускорение в 16 раз?',['Из-за последовательных частей и накладных расходов','RAM всегда ровно 16 ГБ','Компилятор запрещает'],0,'Последовательная часть не ускоряется при добавлении процессоров.'),
Q('Если a = 0.25, какое предельное ускорение по Амдалу при p → ∞?',['4','16','Бесконечность'],0,'Smax = 1/a = 4.')],{source:'Лекция 3 · слайды 7–8',resources:['ostep']});
add(3,'Что такое поток? Чем отличается от процесса?','Потоки в одном процессе разделяют память, но имеют разные стеки и регистры.',
`<p><b>Поток исполнения (thread)</b> — независимая последовательность исполнения команд внутри процесса. <b>У каждого потока</b> есть свой программный счётчик, набор регистров и стек.</p><p><b>Общие для потоков процесса</b>: код, куча, глобальные данные, адресное пространство и обычно файловые дескрипторы. Разные процессы по умолчанию имеют независимые адресные пространства.</p><p>Потоки удобнее для общего доступа к данным, но легче породить гонку. Создание/переключение потоков часто дешевле, однако точная стоимость зависит от ОС и реализации.</p>`,
{title:'Два потока одной программы',body:'Поток А пишет в общий массив, поток Б его читает. Они видят один массив, но локальные переменные на их отдельных стеках могут различаться.'},'threads',[
Q('Что обычно разделяют два потока одного процесса?',['Стек','Кучу и глобальные данные','Регистры RIP'],1,'Общее адресное пространство включает кучу, код и глобальные данные.'),
Q('Что обычно индивидуально для каждого потока?',['Стек и регистровый контекст','PID всего процесса','Все глобальные переменные'],0,'Каждый поток имеет свою точку выполнения и стек.')],{source:'Лекция 3 · слайды 9–11; Таненбаум §2.2',resources:['ostep']});
add(3,'KLT, ULT и гибридная модель','Потоками может управлять ядро или библиотека пользователя.',
`<p><b>Kernel-Level Threads (KLT)</b> известны ядру: ОС планирует каждый такой поток. Плюс — независимое планирование на ядрах; минус — участие ядра может удорожать операции.</p><p><b>User-Level Threads (ULT)</b> управляются runtime/библиотекой; смена ULT может обходиться без обращения в ядро. Если все ULT опираются на один блокирующий поток ядра, блокировка может остановить всю группу.</p><p><b>Гибридная M:N-модель</b> сопоставляет множество пользовательских потоков с несколькими потоками ядра: баланс гибкости и параллелизма, но более сложный runtime.</p>`,
{title:'Модели отображения',body:'Схема «100 ULT → 4 KLT»: библиотека распределяет пользовательские задачи по четырём потокам, которые ОС может исполнять на ядрах.'},'threadtypes',[
Q('Кто планирует KLT?',['Ядро ОС','Только JavaScript в браузере','Контроллер диска'],0,'KLT — потоки, которыми управляет ядро.'),
Q('Что означает гибридная M:N-модель?',['M пользовательских потоков на N ядерных','M файлов на N дисков','M приложений без памяти'],0,'Runtime отображает множество пользовательских потоков на несколько ядерных.')],{source:'Лекция 3 · слайды 12–13',advanced:true});
add(3,'Fork–Join и пул потоков','Параллельную работу нужно не только запустить, но и завершить/собрать.',
`<p><b>Fork–Join</b> для потоков — создать несколько ветвей работы (<i>fork</i>), затем дождаться всех результатов (<i>join</i>). Это проще для понимания, но частое создание потоков имеет цену.</p><p><b>Thread pool</b> создаёт фиксированный набор рабочих потоков и выдаёт им задания повторно. Так уменьшаются расходы на непрерывное создание и удаление.</p><p>Выбирать количество потоков нужно с учётом нагрузки: CPU-bound и I/O-bound задачи имеют разные требования.</p>`,
{title:'Подсчёт суммы массива',body:'Разделили массив на 4 части → 4 потока считают частичные суммы → join → главный поток складывает четыре результата.'},'forkjoin',[
Q('Что означает join в Fork–Join?',['Ожидание завершения ветвей','Создание таблицы страниц','Запись в порт'],0,'Join синхронизирует завершение параллельных работ.'),
Q('Зачем нужен пул потоков?',['Повторно использовать потоки для заданий','Хранить файлы на SSD','Исключить все гонки автоматически'],0,'Пул снижает расходы на многократное создание потоков.')],{source:'Лекция 3 · слайды 14–16'});
add(3,'Гонка данных (data race)','Чтение и запись общих данных без синхронизации могут дать неопределённый результат.',
`<p><b>Data race</b> возникает, когда два потока обращаются к одной области памяти, хотя бы один пишет, и нет необходимой синхронизации. Результат зависит от порядка исполнения; в C++ такая гонка приводит к <b>неопределённому поведению</b>.</p><p>Операция <code>x++</code> обычно состоит из чтения, вычисления и записи. Два потока могут оба прочесть старое <code>x=0</code>, вычислить <code>1</code> и оба записать <code>1</code> вместо ожидаемых <code>2</code>.</p><p><code>volatile</code> не заменяет мьютекс или атомарные операции и не делает инкремент потокобезопасным.</p>`,
{title:'Потерянное обновление',body:'Поток А: read 0 → +1; поток Б: read 0 → +1; А: write 1; Б: write 1. Итог <code>1</code> вместо <code>2</code>. Проиграй схему.'},'race',[
Q('Почему два раза x++ иногда дают 1 вместо 2?',['Чтение и запись переплелись без синхронизации','Потому что int не хранит 2','Из-за PID'],0,'Оба потока могли прочитать одно исходное значение.'),
Q('Решает ли volatile int проблему гонки данных в C++?',['Да','Нет','Только на Linux'],1,'volatile не обеспечивает необходимую синхронизацию или атомарность.')],{source:'Лекция 3 · слайды 17–19'});
add(3,'Критическая секция и mutex','Мьютекс защищает общие данные: одновременно входит только один поток.',
`<p><b>Критическая секция</b> — участок кода, требующий взаимного исключения при доступе к общему ресурсу. <b>Mutex</b> имеет операции <code>lock()</code> / <code>unlock()</code>; только владелец блокировки должен освобождать её.</p><p>При занятом mutex другой поток ждёт (реализация может кратковременно крутиться и/или переходить в сон). Чем дольше критическая секция, тем больше потенциальное ограничение параллелизма.</p><p>Предпочитай безопасную организацию данных: разделение работы между независимыми участками памяти уменьшает необходимость в блокировках.</p>`,
{title:'Защищённый инкремент',body:'<code>lock(m); x++; unlock(m);</code> — оба потока увеличат x по очереди. В C++ обычно лучше RAII (<code>std::lock_guard</code>), чтобы не забыть unlock.'},'mutex',[
Q('Для чего используется mutex?',['Для взаимного исключения при доступе к ресурсу','Для ускорения RAM вдвое','Для компиляции SIMD'],0,'Только один поток в момент времени владеет блокировкой.'),
Q('Что может произойти при чрезмерно больших критических секциях?',['Снизится параллелизм','Исчезнет код программы','Увеличится число ядер'],0,'Последовательные участки ограничивают ускорение по Амдалу.')],{source:'Лекция 3 · слайды 20–23; Таненбаум §2.3'});
add(3,'Взаимоблокировка: deadlock','Потоки ждут ресурсы друг у друга, и никто не может продолжить.',
`<p><b>Deadlock</b> — ситуация взаимного ожидания: участники удерживают ресурсы и ждут освобождения других ресурсов, образуя цикл.</p><p>Классические необходимые условия Коффмана: <b>взаимное исключение</b>, <b>удержание с ожиданием</b>, <b>отсутствие принудительного отнятия</b>, <b>циклическое ожидание</b>. Устранение хотя бы одного исключает классический ресурсный deadlock.</p><p>Простая профилактика: все потоки захватывают несколько mutex в <b>одинаковом порядке</b>. Можно применять таймауты или специальные алгоритмы, но они не всегда нужны.</p>`,
{title:'Два ресурса',body:'А захватил mutex X и ждёт Y. Б захватил Y и ждёт X. Оба не могут выполнить unlock, пока не продолжат — взаимоблокировка.'},'deadlock',[
Q('Как выглядит типичный deadlock?',['А ждёт Б, Б ждёт А','Два потока независимо считают','Процесс быстро завершился'],0,'Ключевой признак — невозможность прогресса из-за цикла ожидания.'),
Q('Что помогает избежать deadlock при двух mutex?',['Всегда захватывать их в едином порядке','Использовать больше printf','Поставить sleep(1) перед каждым lock'],0,'Одинаковый глобальный порядок захвата разрывает циклическое ожидание.')],{source:'Лекция 3 · слайды 24–26; Таненбаум глава 6',resources:['mutex-video']});
add(3,'Алгоритм Петерсона','Классический программный алгоритм взаимного исключения для двух потоков.',
`<p>Алгоритм Петерсона использует <b>два флага намерения</b> (<code>flag[0]</code>, <code>flag[1]</code>) и переменную <b>turn/victim</b>, чтобы один из двух потоков мог войти в критическую секцию, а другой подождал.</p><p>Вход потока i: объявить намерение, уступить приоритет другому, ждать, пока другой хочет войти и его очередь. Выход: сбросить свой флаг.</p><p><b>Теоретический алгоритм:</b> корректность предполагает нужный порядок видимости операций памяти. На современных CPU/в C++ простой код с обычными <code>bool</code> и <code>int</code> не является автоматически потокобезопасной реализацией — нужны атомарность и правильный порядок памяти.</p>`,
{title:'Почему два флага недостаточны?',body:'Если оба выставили <code>flag[i]=true</code> и ждут, пока флаг соседа исчезнет, оба зависнут. Переменная очереди позволяет разрешить конфликт.'},'peterson',[
Q('Сколько потоков обслуживает классический алгоритм Петерсона?',['Два','Сотню без изменений','Только один'],0,'Базовый алгоритм Петерсона предназначен для двух участников.'),
Q('Зачем нужен victim/turn в алгоритме?',['Разрешать одновременное желание войти','Хранить PID','Выделять RAM'],0,'Переменная очереди позволяет одному потоку уступить и исключить взаимное ожидание.')],{source:'Лекция 3 · слайды 24, 27–28',resources:['peterson-video'],advanced:true});
add(3,'Семафор и счётчик ресурсов','Семафор ограничивает число участников или передаёт сигнал между потоками.',
`<p><b>Semaphore</b> содержит счётчик доступных разрешений. Операция <code>wait</code> (P/down) ждёт доступности разрешения и уменьшает счётчик; <code>post</code> (V/up) увеличивает доступные разрешения/будит ожидающего.</p><p><b>Счётный семафор</b> допускает несколько одновременно работающих участников, например три подключения к ресурсу. <b>Двоичный семафор</b> имеет значения 0/1, но не тождествен mutex: у mutex обычно есть понятие владельца.</p><p>Мьютекс — «один владелец в критической секции», семафор — «N разрешений» или передача сигнала.</p>`,
{title:'Три принтера',body:'Семафор со значением 3 пропускает максимум три потока одновременно. Четвёртый ждёт, пока кто-то не вызовет post.'},'semaphore',[
Q('Как изменяется счётчик при успешном wait()?',['Уменьшается','Увеличивается','Всегда становится 0'],0,'wait потребляет одно разрешение.'),
Q('Как ограничить число одновременных клиентов до трёх?',['Семафор, начальное значение 3','Мьютекс с PID 3','Три переменные int'],0,'Счётный семафор хранит число доступных слотов.')],{source:'Лекция 3 · слайд 29',resources:['mutex-video']});
add(3,'Spinlock и атомарные операции','Ожидание может быть активным; безопасный захват требует атомарности.',
`<p><b>Spinlock</b> не усыпляет ожидающий поток: тот циклически пытается захватить блокировку. Это может быть разумно лишь для <b>очень коротких</b> критических секций, когда сон и пробуждение дороже ожидания.</p><p><b>Атомарная операция</b> неделима с точки зрения конкурирующих потоков; примеры — атомарная загрузка, обмен, <b>compare-and-swap (CAS)</b>. Она не обязана выполняться за один такт и не обязательно останавливает все ядра.</p><p>Простой <code>volatile bool</code> не делает корректный spinlock на C++. Нужны специальные атомарные механизмы и гарантии модели памяти.</p>`,
{title:'Два способа ждать',body:'Mutex может блокировать поток, отдавая CPU другим. Spinlock постоянно проверяет флаг, занимая время CPU; эффективен лишь при очень кратком ожидании.'},'spin',[
Q('Чем spinlock отличается по ожиданию?',['Активно крутится и расходует CPU','Всегда записывает на диск','Никогда не использует атомарность'],0,'Spin ожидание — цикл попыток, а не обязательный сон.'),
Q('Что делает CAS?',['Атомарно сравнивает значение и условно заменяет его','Компилирует процесс','Загружает все страницы'],0,'Compare-and-swap — базовая атомарная операция.')],{source:'Лекция 3 · слайды 30–32',advanced:true});
add(3,'Условные переменные и барьеры','Condition variable позволяет спать до изменения условия.',
`<p><b>Condition variable</b> служит для ожидания условия, защищённого мьютексом. Поток захватывает mutex, проверяет условие и вызывает <code>wait</code>; операция <b>атомарно освобождает mutex и переходит в ожидание</b>, а при пробуждении снова захватывает mutex.</p><p>Проверять условие следует в <b>цикле while</b>, потому что возможны ложные пробуждения и изменение состояния до повторного захвата. <code>signal/notify_one</code> будит одного, <code>broadcast/notify_all</code> — всех.</p><p><b>Барьер</b> останавливает участников до тех пор, пока все не достигнут контрольной точки. Его можно реализовать через mutex, условную переменную и счётчик; для повторного использования важно учитывать поколения барьера.</p>`,
{title:'Ждём окончания загрузки',body:'Рабочий поток: <code>while (!ready) cond.wait(mutex)</code>. Другой поток делает <code>ready=true</code> под mutex и вызывает <code>notify</code>. Для барьера — ждём, пока не придут все N потоков.'},'condition',[
Q('Почему условие для condition variable проверяют в цикле?',['Возможны ложные пробуждения и повторное изменение условия','Потому что mutex не нужен','Чтобы поток занимал CPU всегда'],0,'После wait нужно заново проверять предикат под блокировкой.'),
Q('Что делает барьер потоков?',['Не пропускает участников дальше, пока не соберутся все','Шифрует память','Создаёт сетевой порт'],0,'Барьер синхронизирует достижение общей точки.')],{source:'Лекция 3 · слайды 33–37; Таненбаум §2.3'});
// ==================== ЛЕКЦИЯ 4 ====================
add(4,'Компиляция и микрооперации','Машинная инструкция может декодироваться во внутренние микрооперации.',
`<p>Компилятор превращает исходный код в исполняемый машинный код целевой ISA. Во время выполнения CPU получает и декодирует инструкции.</p><p>Во многих современных процессорах, особенно сложных x86, инструкции могут раскладываться во внутренние <b>μops (микрооперации)</b>. Они направляются к исполнительным блокам и позволяют организовать параллельное исполнение.</p><p>Это характеристика микроархитектуры: неверно утверждать, что <i>каждая инструкция любого CPU</i> всегда делится на несколько μops.</p>`,
{title:'Одна команда — несколько действий',body:'Сложная x86-инструкция, работающая с памятью и арифметикой, может преобразовываться во внутренние операции загрузки данных и вычисления.'},'isa',[
Q('Что такое μop?',['Внутренняя микрооперация процессора','Новый язык высокого уровня','Файловый дескриптор'],0,'Микрооперация — внутренняя единица исполнения CPU.'),
Q('Гарантированно ли каждая инструкция в любом CPU разбивается на несколько μops?',['Да','Нет','Только при read()'],1,'Это зависит от ISA и микроархитектуры.')],{source:'Лекция 4 · слайды 2–3'});
add(4,'Порты и исполнительные блоки CPU','Микрооперации направляются на подходящие аппаратные устройства.',
`<p><b>ALU</b> выполняет арифметико-логические действия. <b>AGU</b> (Address Generation Unit) вычисляет адреса для операций загрузки/записи. В процессоре могут быть разные вычислительные блоки.</p><p><b>Порты исполнения</b> — часть внутренней инфраструктуры, через которую планировщик микроопераций выдаёт работу исполнительным блокам. Не каждую μop можно выполнить на любом порту.</p><p>Наличие нескольких портов и блоков позволяет выполнять независимые операции одновременно, если нет конфликтов и зависимостей.</p>`,
{title:'Две разные μops',body:'Пока AGU вычисляет адрес <code>a[i]</code>, ALU может складывать уже полученные числа. Загрузка и вычисление могут накладываться по времени.'},'ports',[
Q('Какая задача у AGU?',['Вычислять адреса памяти','Создавать процессы','Сортировать файлы'],0,'AGU = Address Generation Unit.'),
Q('Зачем процессору несколько исполнительных блоков?',['Чтобы исполнять подходящие независимые операции параллельно','Чтобы отменить OS','Чтобы увеличить PID'],0,'Несколько ресурсов исполнения повышают пропускную способность.')],{source:'Лекция 4 · слайды 4–6'});
add(4,'Суперскалярность и Out-of-Order','CPU может запускать независимые инструкции не строго в программном порядке.',
`<p><b>Суперскалярность</b> — способность обрабатывать/выдавать к выполнению несколько инструкций за такт при наличии ресурсов. <b>Out-of-order (OoO)</b> — выполнение готовых независимых операций раньше тех, что ждут данные.</p><p>Внутренний планировщик CPU учитывает зависимости. При этом архитектурно наблюдаемый результат программы должен сохранять корректную семантику ISA.</p><p><b>Пример:</b> первая операция ждёт память, а следующая независимая арифметика уже имеет все операнды — процессор может выполнить её раньше.</p>`,
{title:'Обгон разрешён не всегда',body:'<code>a = load(...); b = 3+4; c = a+1;</code>. Вычисление <code>b</code> может не ждать <code>load</code>; вычисление <code>c</code> зависит от <code>a</code>.'},'ooo',[
Q('Когда OoO может исполнить следующую операцию раньше?',['Если она готова и нет зависимости','Всегда независимо от данных','Только после завершения программы'],0,'Готовые независимые операции могут обгонять ожидающие.'),
Q('Что характеризует суперскалярность?',['Несколько операций/инструкций в обработке за такт','Ровно один регистр','Хранение всех файлов в L1'],0,'Суперскалярные CPU имеют параллельные ресурсы выдачи и исполнения.')],{source:'Лекция 4 · слайды 7'});
add(4,'Переименование регистров и предсказание ветвлений','CPU скрывает ложные зависимости и старается заранее угадать ход программы.',
`<p><b>Register renaming</b> сопоставляет архитектурные регистры с физическими, устраняя ложные зависимости по именам (например, когда независимые инструкции используют одинаковое архитектурное имя регистра).</p><p><b>Branch prediction</b> пытается предсказать исход условного перехода и заранее выполняет инструкции выбранной ветки. При ошибке предсказания спекулятивные результаты отменяются как архитектурно видимые, правильная ветка начинается заново.</p><p>Оба механизма ускоряют процессор, но не изменяют смысл программы. Ошибочное предсказание может заметно снижать производительность.</p>`,
{title:'if/else и прогноз',body:'CPU не знает, будет ли <code>x &gt; 0</code>, но может начать одну ветвь. Если угадал — выиграл время; если нет — выполняет правильную, потеряв часть работы.'},'branch',[
Q('Зачем нужно переименование регистров?',['Снять ложные зависимости по именам','Изменить переменные в C++','Переключить PID'],0,'Разные физические регистры позволяют независимым операциям не конфликтовать.'),
Q('Что происходит при неверном предсказании ветвления?',['Процессор отбрасывает неверную спекулятивную ветвь','ОС обязательно завершается','Инструкции навсегда меняются'],0,'Неверная ветвь отменяется, правильная исполняется заново.')],{source:'Лекция 4 · слайды 8–9'});
add(4,'Линия кэша, hit и miss','Кэш хранит копии небольших блоков данных, чтобы реже обращаться к RAM.',
`<p><b>Кэш процессора</b> — небольшая быстрая память для копий часто используемых данных/инструкций. Данные загружаются <b>линиями кэша (cache lines)</b>, например по 64 байта (размер зависит от CPU).</p><p><b>Cache hit</b> — нужная линия уже есть в кэше; <b>cache miss</b> — её нет, требуется обращение на следующий уровень. <b>Пространственная локальность</b>: рядом расположенные элементы могут использовать одну линию. <b>Временная локальность</b>: к одним данным обращаются многократно.</p><p>Кэш — аппаратная оптимизация. Он не равен виртуальной памяти и не заменяет RAM.</p>`,
{title:'Массив int',body:'При линии 64 байта и <code>int</code> размером 4 байта одна строка может вместить 16 соседних элементов массива. Последовательный проход часто дружелюбен к кэшу.'},'cache',[
Q('Что такое cache miss?',['Нужной линии нет в проверяемом уровне кэша','Процесс завершился','CPU забыл ISA'],0,'При промахе система ищет данные на следующем уровне.'),
Q('Почему последовательный проход массива обычно эффективнее случайного?',['Используется пространственная локальность','Потому что массив становится меньше','Потому что отключается RAM'],0,'Соседние элементы часто находятся в уже загруженной линии.')],{source:'Лекция 4 · слайды 14–19'});
add(4,'L1, L2, L3 и разделение I-cache/D-cache','Быстрые маленькие уровни ближе к CPU, большие медленнее.',
`<p>Типичная иерархия: <b>регистры → L1 → L2 → L3 → RAM → SSD</b> (SSD не является обычным уровнем аппаратного CPU-кэша). L1 обычно очень быстрый и маленький, L2 больше, L3 ещё больше и часто разделяется ядрами.</p><p>Во многих CPU L1 разделён на <b>I-cache</b> (инструкции) и <b>D-cache</b> (данные). Не все процессоры имеют именно три уровня: организация зависит от микроархитектуры.</p><p>Числа из презентации (L1 ≈ 3 цикла, L2 ≈ 10, RAM ≈ 250) — <b>иллюстративные оценки</b>, а не универсальные константы.</p>`,
{title:'Почему несколько уровней?',body:'Сделать весь кэш размером гигабайты и скоростью L1 невозможно при разумной цене и энергопотреблении. Иерархия балансирует объём и задержку.'},'hierarchy',[
Q('Какой кэш обычно самый маленький и быстрый?',['L1','L3','SSD'],0,'L1 находится ближе к исполнительным блокам CPU.'),
Q('Что обычно хранит I-cache?',['Инструкции процессора','Только сетевые пакеты','Только таблицы страниц'],0,'I-cache предназначен для инструкций; D-cache — для данных.')],{source:'Лекция 4 · слайды 20–21'});
add(4,'Размещение в кэше: direct, associative, set-associative','Нужно определить, где может лежать линия памяти.',
`<p><b>Direct-mapped</b>: каждому блоку памяти соответствует строго одна позиция кэша: <code>index = block_number mod line_count</code>. Это просто, но разные блоки могут постоянно вытеснять друг друга.</p><p><b>Fully associative</b>: блок может занять любую строку кэша; поиск сложнее. <b>N-way set associative</b>: блок попадает в определённый набор, но внутри него может занять любую из N «дорог» (ways).</p><p>В современном CPU распространены наборно-ассоциативные схемы как компромисс между сложностью и конфликтными промахами.</p>`,
{title:'Четыре линии и блок №8',body:'В direct-mapped кэше из 4 линий <code>8 mod 4 = 0</code>: блок 8 претендует на линию 0, как и блоки 0, 4, 12.'},'mapping',[
Q('В direct-mapped кэше из 4 строк куда попадёт блок №13?',['Индекс 1','Индекс 3','Индекс 13'],0,'13 mod 4 = 1.'),
Q('В какой схеме блок может размещаться в любой линии?',['Fully associative','Direct-mapped','Только TLB'],0,'Полная ассоциативность допускает любую позицию.')],{source:'Лекция 4 · слайды 22–24'});
add(4,'Tag и valid bit','Индекс говорит, куда смотреть; tag — какой блок там лежит.',
`<p>При прямом отображении множество блоков делят одну позицию. Поэтому у записи кэша есть <b>tag</b> — часть адреса, отличающая блоки с одинаковым индексом.</p><p><b>Valid bit</b> отмечает, содержит ли запись действительные данные. При доступе проверяют индекс, valid и совпадение тега. Если valid = 0 или tag не совпал — промах.</p><p>Кэш может хранить и другую служебную информацию, например признак изменения (dirty), но в презентации упор на tag и valid.</p>`,
{title:'Индекс 1 ≠ попадание',body:'Блок 1 и блок 5 при четырёх линиях имеют индекс 1, но разные теги. Если в строке находится блок 1, запрос блока 5 даст miss.'},'mapping',[
Q('Зачем нужен tag в кэше?',['Отличать блоки, попадающие на один индекс','Определять PID','Хранить имя файла'],0,'Tag содержит различающую часть адреса.'),
Q('Что означает valid = 0?',['Строка не содержит действительного блока','Кэш переполнен','Строка обязательно изменена'],0,'Valid показывает действительность сохранённой линии.')],{source:'Лекция 4 · слайды 25–26'});
add(4,'Виртуальная память и адресное пространство','Программа использует виртуальные адреса, не привязанные напрямую к RAM.',
`<p><b>Виртуальная память</b> создаёт для процессов изолированные адресные пространства и отображает виртуальные адреса на физическую память. Это позволяет защищать процессы, удобно размещать данные и поддерживать отображение файлов.</p><p><b>Страницы (pages)</b> — блоки виртуального пространства; <b>фреймы (frames)</b> — блоки физической памяти соответствующего размера. Часто страница имеет размер 4 КиБ, но существуют и другие размеры.</p><p><b>Swap</b> позволяет хранить часть неактивных данных на диске. <b>Overcommit</b> — политика, при которой ОС может разрешить резервирование больше виртуальной памяти, чем гарантированно доступно физически; это не означает, что всё удастся реально заполнить.</p>`,
{title:'Один и тот же виртуальный адрес',body:'Виртуальный адрес <code>0x1000</code> в двух процессах может соответствовать двум разным физическим фреймам. Именно так сохраняется изоляция.'},'vm',[
Q('Страница относится к…',['Виртуальному адресному пространству','Только видеокарте','Только файлам'],0,'Page — единица отображения виртуального пространства; frame — физическая.'),
Q('Гарантирует ли overcommit наличие RAM для всей обещанной памяти?',['Да','Нет','Только с L3'],1,'Резервирование виртуального пространства не равносильно физическому выделению.')],{source:'Лекция 4 · слайды 27–28; Таненбаум §3.2–3.3',resources:['vm-video']});
add(4,'MMU, TLB и page fault','CPU переводит виртуальный адрес в физический, ускоряя переводы через TLB.',
`<p><b>MMU</b> (Memory Management Unit) — аппаратный механизм трансляции адресов с использованием структур таблиц страниц. <b>TLB</b> — кэш недавних переводов виртуальных страниц в физические фреймы.</p><p>Адрес разбивают на <b>номер виртуальной страницы</b> и <b>смещение внутри неё</b>. По таблице страниц определяют физический фрейм, затем прибавляют прежнее смещение.</p><p><b>Page fault</b> возникает, когда страничное обращение требует обработки ОС: например, отсутствует отображение, нет нужных прав или страница ещё не загружена. Не каждый page fault означает чтение с диска.</p>`,
{title:'Перевод адреса',body:'Страницы по 4096 байт. Виртуальный адрес <code>5000</code> → страница 1 и смещение <code>904</code>. Если она отображена на физический фрейм 7, физический адрес = <code>7·4096+904 = 29576</code>.'},'translation',[
Q('Что хранит TLB?',['Недавние переводы виртуальных страниц в физические','Только обычные файлы','Адрес текущего CPU'],0,'TLB ускоряет трансляцию адресов.'),
Q('Обязательно ли page fault означает чтение с диска?',['Да','Нет','Только на ARM'],1,'Причиной может быть защита, выделение по требованию и другие случаи.')],{source:'Лекция 4 · слайд 29; Таненбаум §3.3',resources:['vm-video']});
add(4,'Таблицы страниц x86: пример 10 / 10 / 12','В классическом 32-битном x86 адрес разбивается на индексы таблиц и смещение.',
`<p>Схема из презентации относится к <b>32-битному x86 без PAE с 4-КиБ страницами</b>. Виртуальный адрес из 32 бит содержит: <b>10 старших бит</b> — индекс Page Directory; <b>10 следующих</b> — индекс Page Table; <b>12 младших</b> — смещение в странице.</p><p><b>CR3</b> указывает на корень используемых таблиц страниц. Процессор по индексу получает адрес таблицы второго уровня, затем номер физического фрейма и добавляет смещение.</p><p>Современная x86-64 использует больше уровней, поэтому схема 10/10/12 — учебный пример, а не универсальный формат всех x86.</p>`,
{title:'Почему 12 бит?',body:'<code>2¹² = 4096</code> байт = 4 КиБ. Если внутри страницы нужно адресовать любой байт, необходимо 12 бит смещения.'},'pagetable',[
Q('Сколько бит смещения при странице 4 КиБ?',['8','10','12'],2,'4 КиБ = 4096 = 2^12 байт.'),
Q('На что указывает CR3 в рассматриваемой схеме?',['Корень таблиц страниц','Текущий syscall','Скорость L1'],0,'CR3 связан с корнем структуры трансляции адресов.')],{source:'Лекция 4 · слайды 31–34; Таненбаум §3.3',advanced:true});
add(4,'mmap: отображение файла в память','К файлу можно обращаться как к области памяти вместо отдельных read/write.',
`<p><b>File mapping</b> — отображение содержимого файла в виртуальное адресное пространство процесса. На Unix это делает <code>mmap(addr, length, prot, flags, fd, offset)</code>. После отображения можно читать/изменять байты по указателю.</p><p>Страницы файла обычно загружаются <b>по требованию</b>, при обращении. <b>MAP_SHARED</b> позволяет совместно видеть изменения и при соответствующих условиях записывать их в файл. <b>MAP_PRIVATE</b> реализует частные изменения через Copy-on-Write, не изменяя исходный файл.</p><p>Для синхронизации изменённых shared-страниц с постоянным хранилищем существуют правила ОС и, например, <code>msync</code>; нельзя считать, что любой store сразу физически записан на диск.</p>`,
{title:'Файл как массив',body:'<code>char *p = mmap(...); char first = p[0];</code> — доступ по указателю вызывает нужное отображение страницы; не требуется явно вызывать <code>read</code> для каждого байта.'},'mmap',[
Q('Что возвращает успешный mmap?',['Адрес отображённой области','PID нового процесса','Размер CPU-кэша'],0,'mmap создаёт отображение и возвращает указатель на него.'),
Q('Что означает MAP_PRIVATE при записи?',['Частное COW-изменение, файл не меняется','Немедленную запись в исходный файл','Полный запрет чтения'],0,'Private mapping делает изменённые страницы частными.')],{source:'Лекция 4 · слайды 35–39'});
add(4,'Copy-on-Write (COW)','Копирование общей страницы откладывается до первой записи.',
`<p><b>Copy-on-Write</b> позволяет нескольким отображениям первоначально ссылаться на одни и те же физические данные. При попытке записи в разделяемую COW-страницу ОС организует её отдельную копию для пишущей стороны.</p><p>Так работает оптимизация памяти после <code>fork()</code>: родитель и ребёнок видят одинаковое начальное содержимое, но запись одним процессом не меняет значения другого. Используется и в <code>MAP_PRIVATE</code>.</p><p>Копирование обычно происходит <b>по страницам</b>, а не обязательно всего адресного пространства. COW сам по себе не гарантирует атомарности любых пользовательских операций.</p>`,
{title:'До и после записи',body:'До: родитель и ребёнок читают одну физическую страницу. Ребёнок пишет <code>x=7</code> → получает свою физическую страницу; родитель по-прежнему видит старое значение.'},'cow',[
Q('Когда COW создаёт частную копию страницы?',['При первой записи, требующей отделения','Сразу при каждом чтении','При каждом вызове printf'],0,'Суть — откладывать копирование до изменения.'),
Q('Меняет ли запись ребёнка после fork обычную память родителя?',['Да, всегда','Нет, логически у процессов независимая память','Только если L1 пуст'],1,'COW сохраняет логическую изоляцию адресных пространств.')],{source:'Лекция 4 · слайды 40–41; Таненбаум §3.3'});

'u1-01': {
 steps:`<h3>Как программа превращается в работу процессора</h3><p>Представь обычную программу <code>int c = a + b;</code>. Её исходный текст сам по себе не понятен процессору. Компилятор переводит его в машинные команды, а ОС организует загрузку исполняемого файла в адресное пространство процесса. После этого процессор получает команды из памяти.</p><ol><li>В памяти находятся <b>команды</b> и <b>данные</b> — это ключевой принцип модели фон Неймана.</li><li>Устройство управления организует получение и выполнение очередной инструкции.</li><li>ALU производит вычисления, например складывает два числа.</li><li>Указатель инструкции позволяет продолжить программу с нужного места.</li></ol><p>При этом CPU, RAM и внешние устройства — не одно и то же. Данные могут временно храниться в регистрах CPU, а значительная часть программы — в RAM. Классическая модель описывает логический порядок выполнения; конвейер современного CPU — оптимизация этого порядка.</p>`,

'u1-02': {
 steps:`<h3>Что именно «понимает» процессор</h3><p>Одна и та же программа на C++ может быть скомпилирована для процессора x86-64 или ARM. Но полученные машинные файлы обычно различаются: архитектуры предоставляют разные инструкции и соглашения. <b>ISA — контракт между программным обеспечением и процессором</b>, а микроархитектура — способ реализовать этот контракт внутри кристалла.</p><ol><li>Разработчик пишет <code>a + b</code> на языке высокого уровня.</li><li>Компилятор выбирает инструкции целевой ISA.</li><li>Ассемблерные мнемоники, такие как <code>add</code> или <code>mov</code>, являются человекочитаемой записью инструкций.</li><li>Процессор исполняет двоичное кодирование этих инструкций.</li></ol><p>Например, два x86-64 процессора умеют выполнять совместимую базовую программу, но один может иметь более широкий конвейер и быстрый кэш. Поэтому одинаковая ISA не означает одинаковую скорость. Набор расширений ISA при этом тоже может различаться: программа, использующая специфическую инструкцию, требует её аппаратной поддержки.</p>`,

'u1-03': {
 steps:`<h3>Для чего процессору несколько типов регистров</h3><p>Если бы процессору приходилось при каждой операции читать RAM, вычисления были бы медленными. Поэтому промежуточные числа и адреса часто находятся в <b>регистрах</b> — очень быстрых ячейках внутри CPU.</p><ol><li><code>RAX</code>, <code>RBX</code> и другие регистры общего назначения хранят числа и адреса.</li><li><code>RIP</code> задаёт точку исполнения. При переходе по условию он направляет выполнение в другую часть программы.</li><li><code>RSP</code> указывает вершину текущего стека, где могут храниться адреса возврата и локальные данные.</li><li><code>RFLAGS</code> содержит флаги состояния, например ZF — признак нулевого результата.</li></ol><p>Допустим, задача складывает числа, затем её прерывают ради другой задачи. Новая задача тоже будет использовать регистры. Если ОС не сохранит старые значения, первая программа после возобновления продолжит с чужими данными. Поэтому <b>сохранение и восстановление регистров</b> необходимо при переключении контекста.</p>`,

'u1-04': {
 steps:`<h3>Почему конвейер повышает скорость</h3><p>Представь изготовление трёх изделий. Если один работник полностью делает изделие от начала до конца, остальные ждут. На конвейере разные работники одновременно выполняют разные этапы. У процессора аналогично: пока одна команда вычисляется, другая декодируется, третья поступает из памяти.</p><ol><li><b>IF / Fetch:</b> получить инструкцию.</li><li><b>ID / Decode:</b> определить, какую операцию она означает.</li><li><b>EX / Execute:</b> выполнить арифметику или другую операцию.</li><li><b>MEM:</b> обратиться к памяти, если это требуется.</li><li><b>WB / Write-back:</b> записать результат.</li></ol><p>В идеальной пятистадийной модели одна инструкция может проходить пять стадий, но после заполнения конвейера каждые такт-два появляется новый результат. Это <b>увеличение пропускной способности</b>, а не обязательно сокращение задержки одной команды. Если следующая операция зависит от предыдущей, ей, возможно, придётся ждать. Условные переходы также могут ломать выбранный заранее поток инструкций.</p>`,

'u1-05': {
 steps:`<h3>Зачем понадобилась операционная система</h3><p>Представь, что браузер, редактор и игра одновременно хотят использовать CPU, память и диск. Без ОС каждой программе пришлось бы самостоятельно договариваться с устройствами и защищать свои данные от остальных. ОС решает эту задачу централизованно.</p><ol><li><b>ОС как расширенная машина:</b> вместо команд контроллеру диска разработчик видит знакомые операции «открыть файл», «прочитать», «записать».</li><li><b>ОС как менеджер ресурсов:</b> распределяет процессорное время, оперативную память, устройства.</li><li><b>ОС как механизм защиты:</b> не позволяет обычной программе произвольно читать чужую память или управлять аппаратурой.</li></ol><p>Пример из первой лабораторной: <code>read(fd, buf, n)</code> читает данные через стандартизированный интерфейс. Программа не должна знать, как устроен контроллер SSD. <b>Мультиплексирование во времени</b> означает, что разные задачи получают CPU по очереди. <b>Мультиплексирование в пространстве</b> означает разделение ресурса, например RAM, на части для разных процессов.</p>`,

'u1-06': {
 steps:`<h3>Как программа взаимодействует с устройством</h3><p>Устройство обычно предоставляет регистры управления: можно записать команду, прочитать статус, передать данные. CPU нужен способ добраться до этих регистров. В первой лекции рассмотрены два аппаратных подхода.</p><ol><li><b>MMIO:</b> регистры устройства располагаются в заданной области физического адресного пространства. Доступ осуществляется инструкциями чтения/записи памяти.</li><li><b>Port-mapped I/O:</b> существует отдельное пространство портов; в x86 применяются специальные инструкции <code>in</code> и <code>out</code>.</li></ol><p>Исторический пример: порт <code>0x60</code> использовался для получения сканкодов клавиатуры на PC. В определённых режимах видеосистема VGA предоставляла отображённую область видеопамяти. В реальной пользовательской программе непосредственный доступ к аппаратным регистрам, как правило, запрещён. Приложение обращается к ОС, а драйвер и ядро выполняют привилегированные операции с устройством.</p>`,
