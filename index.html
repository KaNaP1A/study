/* Дополнительные разборы для всех блоков: конкретный механизм, пример, проверка понимания. */
const EXPANSION = {
'u1-01': `<h3>Что реально происходит с переменной</h3><p>Представим <code>int a = 5, b = 10; int c = a + b;</code>. Исходный текст сам по себе не является инструкцией процессора: компилятор превращает вычисление в команды выбранной ISA. Когда программа запущена, инструкции и нужные данные доступны через адресное пространство процесса. Процессор получает инструкцию, выясняет, какие операнды понадобятся, складывает числа и помещает результат туда, куда предписывает команда.</p><p><b>Чем важна общая память?</b> И инструкции, и данные представлены в адресуемой памяти. Но это не значит, что физически всё идёт по единственной шине или что CPU каждый раз обращается именно в RAM: современные процессоры используют регистры и несколько уровней кэша. Архитектура фон Неймана описывает общую логическую модель, а не все внутренние детали современных чипов.</p>`,
'u1-02': `<h3>Почему одно приложение не всегда запускается на другом CPU</h3><p>Бинарная программа, скомпилированная для x86-64, содержит инструкции и соглашения, рассчитанные на эту архитектуру. Процессор ARM не обязан понимать такие машинные команды, поэтому для него обычно собирают другой исполняемый файл. Даже если программа написана на переносимом C++, переносимость <i>исходного кода</i> ещё не означает совместимость уже собранного файла.</p><p>Внутри одной ISA есть разные модели процессоров и расширения команд. Например, конкретный CPU может поддерживать AVX-512, а другой x86-64 CPU — нет. <b>Ключевой ответ на коллоквиуме:</b> ISA описывает видимое программе поведение машины; микроархитектура — внутренние блоки, конвейеры, кэш и реализацию этого поведения.</p>`,
'u1-03': `<h3>Зачем процессу помнить регистры</h3><p>Представь, что процессор дошёл до середины вычисления: в одном регистре лежит частичная сумма, в другом — адрес массива, а <code>RIP</code> указывает на продолжение. Если ОС решит отдать ядро другому потоку, эти значения нельзя просто потерять. Состояние первого потока сохраняют, а затем восстанавливают. Поэтому два потока могут чередоваться на одном ядре и не путать вычисления.</p><p>Регистр <code>RSP</code> обычно указывает на вершину стека, где хранятся локальные данные и информация о вызовах функций. <code>RFLAGS</code> содержит, например, признак нулевого результата сравнения. Но регистр — не «крошечная оперативная память, в которую можно записать весь код»: регистров немного, они служат главным образом для текущей работы CPU.</p>`,
'u1-04': `<h3>Конвейер: задержка и пропускная способность — разные вещи</h3><p>Без перекрытия пяти стадий три инструкции могли бы условно занять 15 тактов: сначала все пять стадий первой, затем второй и третьей. В идеальном пятиступенчатом конвейере после заполнения может завершаться по одной инструкции за такт, хотя каждой отдельной по-прежнему нужны несколько стадий. Это называют увеличением пропускной способности.</p><p>Почему так не происходит всегда? Инструкция может зависеть от результата предыдущей; чтение памяти может задержаться; условный переход может изменить последовательность команд. Возникают простои и сбросы конвейера. Запомни: <b>конвейерность не означает пять полностью выполненных инструкций одновременно</b>. Он означает, что разные стадии нескольких команд работают параллельно.</p>`,
'u1-05': `<h3>Зачем ОС нужна даже одной программе</h3><p>Допустим, приложение хочет прочитать файл. Ему не требуется знать устройство конкретного SSD, формат команд контроллера и детали обработки ошибок. Оно вызывает стандартную функцию, а ядро и драйверы выполняют низкоуровневую работу. Так ОС выступает <b>«расширенной машиной»</b>: вместо сложного железа программа видит удобные абстракции — файлы, процессы, виртуальную память.</p><p>Другая роль ОС — <b>менеджер ресурсов</b>. Если одновременно запущены браузер, IDE и музыка, ОС распределяет процессорное время, память и доступ к устройствам, а также ограничивает доступ программ друг к другу. Процессам обычно нельзя произвольно изменять память ядра или соседней программы. Эти две роли — абстракция и управление ресурсами — прямо подчёркнуты Таненбаумом.</p>`,
'u1-06': `<h3>Как команда программы превращается в действие устройства</h3><p>У устройства есть регистры управления и состояния. В модели <b>MMIO</b> эти регистры отображаются на специальные адреса; подходящее чтение или запись по такому адресу обращается к устройству, а не к обычной ячейке RAM. В <b>port-mapped I/O</b> на x86 отдельное пространство портов доступно через инструкции <code>in</code> и <code>out</code>.</p><p>Прикладная программа не может без разрешения просто писать в регистры любого устройства: это нарушило бы защиту системы. Обычно она обращается к драйверу через интерфейс ОС. Не путай MMIO с <code>mmap()</code>: первое — способ аппаратной адресации регистров устройств, второе — системный механизм отображения памяти или файлов в адресное пространство процесса.</p>`,
'u1-07': `<h3>Прерывание не равно переключению процесса</h3><p>Клавиатура отправляет событие, CPU приостанавливает обычный поток исполнения, сохраняет необходимое состояние и передаёт управление обработчику. Обработчик быстро фиксирует событие; затем процессор может вернуться к <i>тому же самому</i> коду. Ни создавать новый процесс, ни переключаться на другую программу для этого не обязательно.</p><p>Нужно различать <b>внешнее аппаратное прерывание</b>, <b>исключение</b> процессора (например, из-за некорректного доступа к памяти) и <b>системный вызов</b>, который приложение делает сознательно. В x86 таблица IDT помогает CPU найти нужный обработчик. Вопрос преподавателя «почему нельзя просто постоянно опрашивать клавиатуру?» — потому что непрерывный опрос тратит CPU и сложнее масштабируется на множество устройств.</p>`,
'u1-08': `<h3>Пошагово: что происходит при write()</h3><p>Приложение вызывает <code>write(fd, buffer, count)</code>. Сама библиотечная обёртка подготавливает аргументы и выполняет механизм входа в ядро, обычно специальную инструкцию. CPU проверяемым способом переходит в привилегированный режим; ядро проверяет дескриптор, указатели, права доступа и выполняет операцию. После этого код возвращается в пользовательский режим с результатом или ошибкой.</p><p><b>Зачем нужны режимы?</b> Иначе любая ошибка пользовательской программы могла бы записать данные в память ядра или управлять устройствами напрямую. Системный вызов — разрешённая точка входа к привилегированной функциональности. В твоей лабораторной <code>pipe</code>, <code>fork</code>, <code>read</code>, <code>write</code>, <code>poll</code> связаны именно с услугами ядра.</p>`,
'u1-09': `<h3>Сравнение архитектур на бытовом примере</h3><p>Представим файловую систему. В монолитном ядре её основные компоненты обычно работают в привилегированном адресном пространстве ядра и быстро обмениваются данными с другими подсистемами. В микроядерной архитектуре заметную часть служб можно вынести в отдельные пользовательские процессы: изоляция выше, но для взаимодействия требуется обмен сообщениями и дополнительные переходы.</p><p>При этом «монолитное ядро» не обязательно означает один огромный файл без модулей, а «микроядро» не означает отсутствие ядра. Это варианты размещения системных функций и границ доверия. Для коллоквиума важнее уметь объяснить компромисс: производительность и простота внутренних вызовов против более строгой изоляции служб.</p>`,
'u2-01': `<h3>Почему два запуска одной программы — не один процесс</h3><p>На диске есть единственный исполняемый файл редактора. Ты запускаешь его два раза — ОС создаёт две независимые сущности, каждой присваивает PID, настраивает адресное пространство и ресурсы. Эти процессы могут исполнять одинаковый код, но иметь разные данные, открытые файлы и положение в программе.</p><p>Для отслеживания состояния ядро хранит служебные данные, часто объединяемые понятием <b>PCB (Process Control Block)</b>: идентификаторы, состояние, указатели на ресурсы и контекст выполнения. Конкретная структура зависит от ОС. Важно различать <b>программу</b> (описание команд) и <b>процесс</b> (живой экземпляр выполнения с состоянием). Один процесс также может содержать несколько потоков.</p>`,
'u2-02': `<h3>Почему адрес 0x1000 не означает один и тот же байт у всех</h3><p>Если два процесса обращаются к виртуальному адресу <code>0x1000</code>, ОС совместно с механизмами процессора может отображать эти адреса на совершенно разные физические страницы. Поэтому программа получает ощущение собственной памяти и не может обычным указателем читать переменные другого процесса.</p><p>Внутри адресного пространства обычно есть области машинного кода, глобальных данных, стека, динамической памяти (кучи), отображённых библиотек и файлов. Они не обязательно находятся в одном непрерывном физическом участке RAM. Защита задаётся правами страниц и режимами CPU. Общую память между процессами можно специально организовать, но по умолчанию их пространства изолированы.</p>`,
'u2-03': `<h3>Почему «готов» и «работает» — разные состояния</h3><p>На одном ядре одновременно может исполняться один программный поток в обычной модели исполнения. Если у ОС десяток готовых задач, в состоянии <b>Running</b> находится только выбранная для этого ядра, а остальные пребывают в <b>Ready</b> и ждут процессорного времени. Если выполняющаяся задача вызвала блокирующий <code>read</code> при отсутствии данных, она переходит в <b>Blocked/Waiting</b>: ей нужен не CPU, а событие.</p><p>Когда данные приходят, задача обычно становится <b>Ready</b>, а не сразу <b>Running</b>: планировщик ещё должен выделить ей ядро. Состояния <b>New</b> и <b>Exit</b> описывают создание и завершение. Отдельные ОС используют дополнительные состояния, но базовая схема достаточна для ответа.</p>`,
'u2-04': `<h3>Откуда берутся «одновременные» процессы на одном ядре</h3><p>Пусть браузер выполняется 5 мс, затем система решает дать ядро редактору. CPU не может просто продолжить код редактора, пока не восстановит его регистры и указатель инструкций. Контекст браузера сохраняется; контекст редактора загружается; редактор продолжает с того места, где остановился.</p><p>Это <b>переключение контекста</b>. Оно не является бесплатным: тратится время на работу ядра, а кэши и TLB могут хуже соответствовать новой задаче. Но благодаря переключениям система остаётся отзывчивой. Не путай переход в режим ядра с переключением на другой процесс: системный вызов может обслужить тот же самый поток и вернуть управление ему же.</p>`,
'u2-05': `<h3>Разбираем fork() без магии</h3><p>После <code>pid_t pid = fork();</code> логически появляются два потока управления, продолжающие программу <i>после</i> строки <code>fork</code>. У родителя <code>pid &gt; 0</code> и равен идентификатору ребёнка. У ребёнка <code>pid == 0</code>. При ошибке создание ребёнка не происходит, а родитель получает <code>-1</code>.</p><p>Далее ребёнок часто настраивает дескрипторы и вызывает <code>exec*</code>, чтобы заменить свой код другой программой. Родитель может продолжить работу и позже выполнить <code>waitpid</code>. Благодаря Copy-on-Write система обычно не копирует все физические страницы родителя непосредственно при <code>fork</code>. Обрати внимание: <code>exec</code> не создаёт процесс, а заменяет его исполняемый образ.</p>`,
'u2-06': `<h3>Зачем нужен именно номер, а не имя файла</h3><p>Системные вызовы <code>open</code>, <code>pipe</code> и другие дают процессу числовые дескрипторы, позволяющие обращаться к открытым объектам. Число <code>1</code> обычно означает стандартный вывод, но оболочка может заранее направить его в файл или канал. Тогда <code>write(1, ...)</code> работает с новым назначением без изменения кода приложения.</p><p>После <code>fork</code> ребёнок наследует открытые дескрипторы, поэтому часто нужно закрывать ненужные концы pipe. Дескриптор — не сам файл и не физический адрес: это индекс в таблице процесса, связанный с объектами ядра. Два дескриптора способны ссылаться на одно открытое файловое описание.</p>`,
'u2-07': `<h3>Как заставить изолированные процессы сотрудничать</h3><p>У двух процессов разная виртуальная память. Простая запись <code>global = 10</code> в родителе не обновляет одноимённую глобальную переменную ребёнка после обычного <code>fork</code>. Нужно использовать <b>IPC</b> — механизмы передачи данных или общую память с согласованным доступом.</p><p>Например, pipe — байтовый поток через буфер ядра, FIFO — именованный канал, сокеты позволяют обмениваться данными даже между машинами, общая память эффективна для больших массивов, но требует синхронизации. В потоковой модели границы двух вызовов <code>write</code> не превращаются в два независимых сообщения. Поэтому получатель должен сам выделять строки, заголовки, длины и другие границы своего протокола.</p>`,
'u2-08': `<h3>Почему для лабораторной использовали два pipe</h3><p>В POSIX обычный pipe однонаправленный: в <code>fd[1]</code> пишут, из <code>fd[0]</code> читают. Чтобы родитель отправил строку ребёнку, а ребёнок вернул результат, удобно открыть два канала — один в каждую сторону. Это не «один общий массив»: буферами управляет ядро, и их ёмкость ограничена.</p><p>Если родитель сделает <code>write</code> дважды, ребёнок не обязан получить ровно два чтения: pipe предоставляет поток байтов. Приложение должно само понять, где заканчивается строка, например, по символу перевода строки <code>\n</code>. Для корректной работы также закрывают неиспользуемые концы канала, чтобы не удерживать его открытым без необходимости.</p>`,
'u2-09': `<h3>Три ситуации, которые часто путают</h3><p><b>Ситуация A.</b> Pipe пуст, но существует хотя бы один пишущий конец. Блокирующий <code>read</code> ждёт появления данных; неблокирующий обычно вернёт <code>-1</code> с <code>EAGAIN</code>.</p><p><b>Ситуация B.</b> Pipe пуст и все пишущие концы закрыты. <code>read</code> вернёт <code>0</code>, то есть EOF. Наличие закрытого дескриптора у одного процесса ещё не гарантирует EOF, если другая копия пишущего конца осталась открытой.</p><p><b>Ситуация C.</b> Канал заполнен. Обычная запись может ждать освобождения места, неблокирующая — вернуть <code>EAGAIN</code>. <code>poll()</code> помогает ждать готовности нескольких дескрипторов без постоянного активного опроса в цикле.</p>`,
'u3-01': `<h3>Сравнение SIMD и MIMD на одном массиве</h3><p>Пусть нужно увеличить яркость миллиона пикселей. SIMD позволяет одной машинной инструкцией изменить сразу несколько соседних значений, например восемь элементов за одну векторную операцию. Все элементы обрабатываются одинаковой инструкцией, но значения разные.</p><p>MIMD — другая идея: ядро №1 обрабатывает первую часть изображения, ядро №2 — вторую, причём их потоки команд могут отличаться. Многопоточность и SIMD можно совмещать. Класс SISD — последовательный поток команд и данных, MISD встречается редко и в базовом курсе обычно рассматривается теоретически. Важна не расшифровка аббревиатуры сама по себе, а различие между параллелизмом <i>данных</i> и <i>задач</i>.</p>`,
'u3-02': `<h3>Почему два потока не всегда работают одновременно</h3><p>На одном физическом ядре планировщик может чередовать потоки A и B: чуть поработал A, затем B, затем снова A. Пользователю кажется, что всё происходит одновременно. Это <b>конкурентность</b>, но не обязательная аппаратная параллельность.</p><p>На нескольких доступных логических процессорах потоки действительно могут исполняться в одно время. Но количество потоков и количество ядер — не одно и то же: запуск 100 потоков на четырёх ядрах не создаст 100 вычислителей. Затраты на создание, планирование и синхронизацию могут оказаться больше пользы, особенно если каждый поток делает совсем небольшую работу.</p>`,
'u3-03': `<h3>Посчитаем предельное ускорение</h3><p>Есть программа, в которой 25% времени уходит на последовательные действия, а 75% можно распараллелить. По закону Амдала при четырёх ядрах <code>S = 1 / (0.25 + 0.75/4) ≈ 2.286</code>. При бесконечном количестве ядер теоретический предел — <code>1 / 0.25 = 4</code>, а не бесконечность.</p><p>Эффективность при четырёх ядрах составит <code>E = 2.286/4 ≈ 57%</code>. Это идеализированная оценка: реальные потоки дополнительно тратят время на создание, обмен данными, память и синхронизацию. Почему важно уменьшать критические секции? Потому что они обычно становятся последовательной частью, которую нельзя ускорить простым добавлением ядер.</p>`,
'u3-04': `<h3>Что общее у двух потоков одного процесса</h3><p>Представь браузер: один поток выполняет обработку интерфейса, другой — вычисления. У них общий адресный простор, включая глобальные переменные, кучу, отображения файлов и код программы. Это позволяет передавать данные через общие структуры, но создаёт риск гонок.</p><p>При этом у каждого потока свои регистры CPU, стек вызовов и положение в выполняемой инструкции. Поэтому один поток может находиться внутри функции <code>parse()</code>, а другой — внутри <code>render()</code>. Если отдельный поток заблокировался на I/O, другие потоки процесса могут продолжать работу, если модель реализации и ресурсы это допускают. Разделение памяти — главный плюс и одновременно главная сложность потоков.</p>`,
'u3-05': `<h3>Кому известно о потоке</h3><p>У <b>KLT</b> поток представлен ядру: ОС планирует его как самостоятельную единицу и может выполнять несколько таких потоков на разных ядрах. Переключение часто требует участия ядра, что создаёт расходы.</p><p>У <b>ULT</b> библиотека пользовательского уровня сама переключает лёгкие задачи, иногда не привлекая ядро. Это выгодно для коротких операций, но в модели «много ULT поверх одного KLT» блокирующий системный вызов способен приостановить всех пользовательских участников на этом ядровом потоке. <b>Гибридный подход</b> распределяет множество пользовательских задач по нескольким KLT. Для коллоквиума хватит понимания двух крайностей и их компромиссов.</p>`,
'u3-06': `<h3>Как правильно «собрать» параллельное вычисление</h3><p>Есть миллион чисел, нужно найти сумму. Разделим их на четыре части, запустим четыре рабочих потока (<b>fork</b> в названии модели означает логическое разветвление работы, не вызов <code>fork()</code> Unix) и дадим каждому собственный диапазон. Потом ожидаем окончания всех веток (<b>join</b>) и складываем четыре частичные суммы.</p><p>Если делать такую операцию тысячи раз, постоянное создание и удаление потоков станет дорогим. Пул потоков создаёт работников заранее и многократно выдаёт им задания. Важная мысль: лучше, когда каждый поток записывает свой результат отдельно; это снижает необходимость в блокировках общего счётчика.</p>`,
'u3-07': `<h3>Почему x++ — не один безопасный шаг</h3><p>С точки зрения программы <code>x++</code> выглядит атомарной записью, но типичная реализация включает чтение x, сложение единицы и запись нового значения. Пусть x = 0. Поток A прочитал 0. Поток B тоже прочитал 0. A записал 1. B записал 1. Итог 1, хотя два увеличения должны дать 2.</p><p>Результат зависит от порядка исполнения, а для обычных неатомарных операций в C/C++ при одновременных конфликтующих доступах без синхронизации возникает data race и неопределённое поведение. Ключевой метод решения — защищать критическую секцию мьютексом либо использовать подходящую атомарную операцию. Попробуй вручную пройти эту последовательность на интерактивной схеме.</p>`,
'u3-08': `<h3>Где должен стоять lock()</h3><p>Критическая секция — участок, работающий с общим изменяемым состоянием, который нельзя безопасно выполнять нескольким потокам одновременно. Например, если два потока пишут в общую очередь задач, изменение её указателей и счётчиков нужно согласовать.</p><p><code>lock()</code> перед входом в секцию и <code>unlock()</code> после неё гарантируют, что только один поток в данный момент владеет мьютексом. Второй ждёт освобождения. Однако долгие операции внутри блокировки (диск, сеть, длительные вычисления) увеличивают ожидание других потоков. Поэтому хорошо, когда можно сначала отдельно вычислить результат, а блокировать только короткую запись в общие данные.</p>`,
'u3-09': `<h3>Как возникает тупик из двух блокировок</h3><p>Поток A захватил мьютекс M1, поток B захватил M2. Затем A пытается захватить M2 и останавливается: он у B. Одновременно B пытается захватить M1 и тоже ждёт. Никто не может продвинуться и освободить удерживаемый ресурс. Это <b>deadlock</b>, а не просто медленное выполнение.</p><p>Практическая профилактика — установить единый порядок захвата: все потоки всегда сначала берут M1, потом M2. Если каждому нужен только один ресурс, цикл тоже не возникает. В более общем виде часто упоминают условия Коффмана: взаимное исключение, удержание при ожидании, отсутствие принудительного изъятия и циклическое ожидание.</p>`,
'u3-10': `<h3>Как Петерсон разрешает конфликт двух потоков</h3><p>Каждый поток выставляет свой <code>flag[i] = true</code>, показывая намерение войти. Затем он уступает приоритет другому через общую переменную <code>victim</code> (или <code>turn</code> в другой записи). Если оба хотят войти, условия ожидания устроены так, что один из двух уступит и второй войдёт в критическую секцию.</p><p>Это классическая иллюстрация взаимного исключения для двух участников. <b>Но не копируй учебный псевдокод с обычными bool непосредственно в современный C++ как готовый потокобезопасный mutex</b>: компилятор и CPU могут переупорядочивать обращения, а несинхронизированное чтение/запись вызывает data race. Для практической реализации нужны правильно определённые атомарные операции и порядок памяти.</p>`,
'u3-11': `<h3>Пример: только три соединения к серверу</h3><p>Предположим, сервер разрешает не более трёх одновременных обращений к базе данных. Семафор инициализируют числом 3. Первый поток вызывает <code>wait</code> — остаётся 2 разрешения; второй — 1; третий — 0. Четвёртый вынужден ждать, пока один из работающих не вызовет <code>post</code>.</p><p>Мьютекс обычно защищает доступ строго одного потока, а счётный семафор может разрешать доступ нескольким. Двоичный семафор похож по значению счётчика на мьютекс, но имеет другую семантику владения и сигнализации. Семафор также применяют, чтобы уведомить другой поток о появлении элемента в очереди.</p>`,
'u3-12': `<h3>Почему spinlock может быть быстрее и хуже одновременно</h3><p>При спинлоке поток, не сумевший получить блокировку, повторяет попытку, активно выполняя инструкции. Если защищённый участок чрезвычайно короткий и другой поток скоро освободит блокировку, такая стратегия может избежать затрат на усыпление и пробуждение потока.</p><p>Если же критическая секция длительная или владелец блокировки не запланирован на CPU, активный цикл просто расходует процессорное время. Реальный захват спинлока опирается на атомарную операцию, например compare-and-swap, а не на обычный <code>volatile bool</code>. <b>Атомарность не означает «выполняется за один такт»</b> и не всегда останавливает все ядра: аппаратные гарантии обеспечиваются протоколом согласования памяти.</p>`,
'u3-13': `<h3>Почему ждать условие нужно в цикле</h3><p>Есть общая очередь. Потребитель хочет взять элемент, но очередь пуста. Вместо бесконечной проверки он захватывает мьютекс и вызывает <code>cond.wait</code>: ожидание <b>атомарно освобождает мьютекс и переводит поток в сон</b>. Производитель кладёт элемент, уведомляет потребителя, тот просыпается, снова захватывает мьютекс и проверяет условие.</p><p>Проверка должна находиться в <code>while</code>, а не только в <code>if</code>: возможны ложные пробуждения и ситуации, когда другой поток забрал данные раньше проснувшегося. <b>Барьер</b> — иной сценарий координации: каждый работник ждёт, пока все участники не дойдут до определённой точки вычисления.</p>`,
'u4-01': `<h3>Что CPU выполняет внутри одной инструкции</h3><p>В исходном коде может стоять сложение или обращение к массиву. Компилятор формирует машинные инструкции, которые декодируются процессором. Некоторые современные микроархитектуры разбивают сложные инструкции на более простые внутренние операции — <b>µops</b>. Их планировщик может распределять по подходящим исполнительным блокам.</p><p>Не нужно считать, что <i>каждая</i> инструкция обязательно разбивается на несколько µops: простая инструкция может соответствовать одной внутренней операции; конкретная реализация зависит от процессора. Машинный код — видимый программному обеспечению интерфейс ISA; µops — внутренняя деталь микроархитектуры, которую обычная программа напрямую не задаёт.</p>`,
'u4-02': `<h3>Чем исполнительный блок отличается от порта</h3><p>Микрооперации получают различные аппаратные ресурсы: <b>ALU</b> занимается арифметикой и логикой, <b>AGU</b> — вычислением адресов для операций чтения и записи памяти. В типичных описаниях микроархитектур есть порты выдачи микроопераций к исполнительным блокам. Если несколько готовых операций конкурируют за один порт или блок, часть операций ждёт своей очереди.</p><p>Суперскалярный CPU имеет несколько путей исполнения, чтобы одновременно запускать больше одной подходящей операции. Но конкретное количество портов, их назначение и пропускная способность зависят от модели процессора. Для короткого коллоквиума не нужно заучивать номера портов конкретного Intel: нужно объяснить принцип распределения нагрузки.</p>`,
'u4-03': `<h3>Как CPU выигрывает от выполнения вне порядка</h3><p>Предположим, инструкция №1 загружает данные из памяти, а №2 выполняет независимое сложение <code>3 + 4</code>. Если загрузка №1 задерживается, процессор с выполнением вне порядка может запустить №2 раньше, не простаивая. Инструкция №3, использующая результат загрузки, всё равно должна ждать зависимость.</p><p>При этом процессор обычно старается сделать так, чтобы наблюдаемый архитектурный результат соответствовал правилам ISA, несмотря на внутреннюю перестановку операций. Суперскалярность означает возможность выдавать несколько инструкций/µops за такт, а Out-of-Order — возможность менять <i>внутренний порядок</i> исполнения независимых операций. Это связанные, но разные свойства.</p>`,
'u4-04': `<h3>Две разные оптимизации, которые часто путают</h3><p><b>Register renaming</b> устраняет ложные зависимости по имени регистра. Например, две независимые операции должны записать результат в архитектурный <code>RAX</code>; внутри CPU их значения могут временно храниться в разных физических регистрах. Это даёт более свободное планирование.</p><p><b>Branch prediction</b> решает другую проблему: процессор заранее предполагает исход ветвления <code>if</code> и начинает выполнять выбранный путь. Если прогноз ошибочный, спекулятивные результаты не должны стать видимыми как выполненная неверная ветка, а конвейер теряет время на восстановление. Обе техники повышают производительность, но одна борется с зависимостями, а другая — с неопределённостью управления.</p>`,
'u4-05': `<h3>Почему чтение одного байта приносит целую линию</h3><p>Программа обращается к <code>arr[0]</code>. CPU обычно загружает в кэш целый соседний блок памяти — <b>cache line</b>, часто 64 байта на современных массовых процессорах. Если далее программа прочитает <code>arr[1]</code>, он может уже находиться в той же линии: это пространственная локальность.</p><p><b>Cache hit</b> — нужные данные найдены на рассматриваемом уровне кэша; <b>cache miss</b> — их нужно искать дальше по иерархии. Кэши помогают, когда программа многократно использует те же данные (временная локальность) или соседние адреса (пространственная). Но большие линии тоже не всегда лучше: ограниченный объём кэша начинает хранить меньше независимых блоков.</p>`,
'u4-06': `<h3>Кэш — не просто маленькая копия всей RAM</h3><p><b>L1</b> обычно самый быстрый и небольшой; <b>L2</b> больше и медленнее; <b>L3</b> часто общий для нескольких ядер и ещё больше. Точные задержки, размеры и наличие уровней зависят от процессора, поэтому цифры из слайдов — приблизительные примеры, не универсальная константа.</p><p>Многие процессоры отдельно кэшируют инструкции (<b>I-cache</b>) и данные (<b>D-cache</b>) на первом уровне. Это позволяет одновременно получать команды и работать с данными. Переход с L1 к L2 или RAM при промахе увеличивает задержку, поэтому последовательный обход большого массива обычно эффективнее случайных обращений к множеству разрозненных адресов.</p>`,
'u4-07': `<h3>Куда положить блок, если кэш маленький</h3><p>Возьмём direct-mapped кэш на четыре линии. Блоки памяти 0, 4 и 8 все претендуют на индекс 0, потому что индекс равен <code>номер_блока mod 4</code>. Если программа попеременно обращается к блокам 0 и 4, каждый доступ может вытеснять предыдущий — <b>конфликтные промахи</b>, даже если остальные линии кэша пусты.</p><p>В полностью ассоциативном кэше блок может оказаться в любой линии, но его поиск сложнее. В наборно-ассоциативном кэше блок сначала выбирает набор, а внутри набора доступно несколько путей. Это компромисс между сложностью аппаратуры и количеством конфликтных промахов.</p>`,
'u4-08': `<h3>Зачем нужны tag и valid bit</h3><p>Пусть две разные области памяти по формуле отображаются в одну линию кэша. По одному индексу процессор не поймёт, какой именно блок сейчас хранится. Поэтому в линии сохраняется <b>tag</b> — часть адреса, определяющая принадлежность данных. При обращении сравнивают tag запроса и tag линии.</p><p>При включении питания содержимое линий кэша может быть неопределённым; <b>valid bit</b> показывает, можно ли вообще считать запись действительной. Для попадания нужно, чтобы valid = 1 и tag совпал. Если не совпал, это промах. Отдельные кэши дополнительно используют биты изменения и информацию для политики вытеснения.</p>`,
'u4-09': `<h3>Почему виртуальная память не обязана помещаться в RAM целиком</h3><p>Процесс видит адресное пространство, логически независимое от физического расположения страниц. Часть виртуальных страниц может сейчас находиться в оперативной памяти, часть быть ещё не выделенной, часть — связанной с файлом. ОС и процессор работают вместе, чтобы превратить виртуальные обращения в доступ к физическим страницам.</p><p>Это даёт изоляцию программ, защиту правами чтения/записи/исполнения, ленивую загрузку и гибкое распределение памяти. Но виртуальная память — не просто «RAM + файл подкачки». Подкачка на диск является лишь одним из механизмов; некоторые страницы никогда не окажутся в swap, а нарушения прав доступа могут немедленно завершить программу.</p>`,
'u4-10': `<h3>Разбираем адрес на страницу и смещение</h3><p>Размер страницы — 4096 байт. Для виртуального адреса <code>5000</code> номер страницы равен <code>floor(5000/4096) = 1</code>, смещение равно <code>5000 mod 4096 = 904</code>. MMU находит физический фрейм, которому соответствует виртуальная страница №1. Если это фрейм №7, физический адрес будет <code>7·4096 + 904 = 29576</code>.</p><p>Чтобы не проходить таблицы страниц при каждом обращении, процессор использует <b>TLB</b> — кэш недавних трансляций адресов. <b>Page fault</b> — исключение процессора при проблеме с отображением или разрешениями страницы; иногда ОС загрузит отсутствующую страницу, а иногда обращение признáется ошибочным. Он не означает автоматически «оперативная память закончилась».</p>`,
'u4-11': `<h3>Откуда берутся 10 + 10 + 12 бит</h3><p>В классической 32-битной схеме x86 без PAE виртуальный адрес разбивают на три части: десять старших бит выбирают запись в каталоге страниц, следующие десять — запись в таблице, а младшие двенадцать — смещение внутри страницы размером <code>2^12 = 4096</code> байт. Две десятибитные части дают по 1024 записи каждого уровня.</p><p>Эта схема полезна как учебный пример, но <b>не является общей схемой для всех современных x86-64</b>: там используются многоуровневые таблицы с другой структурой адресов. В конспекте преподавателя расположение младших/старших частей адреса описано неудачно; для коллоквиума лучше явно сказать «старшие 10 + следующие 10 + младшие 12».</p>`,
'u4-12': `<h3>Когда mmap удобнее обычного read</h3><p>Представим большой файл. При чтении через <code>read()</code> программа явно просит ядро перенести данные в свой буфер. При <code>mmap()</code> ОС создаёт отображение: файл становится доступен через область виртуальной памяти, и приложение обращается к байтам обычными указателями. Нужные страницы обычно загружаются по мере обращения.</p><p><code>MAP_SHARED</code> предназначен для общего отображения и распространения изменений на связанные отображения/файл по правилам ОС; <code>MAP_PRIVATE</code> создаёт приватную copy-on-write картину, изменения не записываются в исходный файл. Ошибочно думать, что после mmap не возникает системных операций: page fault, запись грязных страниц и синхронизация происходят под управлением ядра.</p>`,
'u4-13': `<h3>Почему дочерний процесс не меняет переменную родителя</h3><p>Пусть в родителе глобальная переменная равна 10. После <code>fork()</code> ребёнок сначала может использовать ту же физическую страницу, что и родитель. Однако она настроена так, что запись приводит к механизму <b>Copy-on-Write</b>: ядро выделяет отдельную страницу для записывающего процесса и копирует старое содержимое. Ребёнок меняет свою копию на 20, а родитель продолжает видеть 10.</p><p>Это экономит память при создании процессов, особенно если ребёнок вскоре вызовет <code>exec()</code>. Копируется обычно изменяемая <i>страница</i>, а не вся RAM и не один конкретный байт. COW не является синхронизацией и не делает произвольные записи атомарными.</p>`
};

  <script>
'use strict';
const STORAGE_KEY='osy-study-v1';
const TOTAL=L.length;
let progress=loadProgress();
let activeUnit=1;
let quizState={};
const PRACTICE_COUNT=5;
const EXAM_LENGTHS={12:12,25:22,40:32};
let examSize=12;
let exam=null;
let examTimer=null;
let reviewState={deck:[],index:0,revealed:false,all:false};
let vizState={race:0,pipe:'',pipeClosed:false,amdahlA:20,amdahlP:4,cache:[],cacheLast:'',translateAddr:5000};
const $=sel=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const qdate=()=>new Date().toISOString().slice(0,10);
function loadProgress(){try {let x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return {completed:x.completed||{},reviews:x.reviews||{},mistakes:x.mistakes||{},activity:x.activity||{},exams:x.exams||[]};}catch(e){return {completed:{},reviews:{},mistakes:{},activity:{},exams:[]};}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));}catch(e){toast('Браузер не разрешает сохранить прогресс');}syncChrome();}
function doneCount(unit){return L.filter(x=>(!unit||x.unit===unit)&&progress.completed[x.id]).length}
function percent(unit){let n=unit?L.filter(x=>x.unit===unit).length:TOTAL;return Math.round(doneCount(unit)/n*100)}
function dueCards(){return Object.keys(progress.reviews).filter(id=>progress.completed[id]&&progress.reviews[id].due<=Date.now())}
function todayCount(){return progress.activity[qdate()]||0}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('shown');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('shown'),3000)}
function view(hash){location.hash=hash; renderRoute()}
function route(){let h=decodeURIComponent(location.hash.replace(/^#/,'')||'home');let [name,arg]=h.split('/');return {name,arg};}
function unit(id){return UNITS.find(u=>u.id===id)}
function firstIncomplete(unitId){return L.find(x=>(!unitId||x.unit===unitId)&&!progress.completed[x.id])||L.find(x=>!unitId||x.unit===unitId)}
function lessonIndex(id){return L.findIndex(x=>x.id===id)}
function activeLesson(id){return L.find(x=>x.id===id)}
function syncChrome(){const done=doneCount(),due=dueCards().length;$('#footer-progress').textContent=percent()+'%';$('#footer-bar').style.width=percent()+'%';$('#sidebar-count').textContent=done+'/'+TOTAL;$('#due-nav').textContent=due;$('#top-progress').textContent=done+' / '+TOTAL+' блоков';drawSidebar();}
function drawSidebar(){const r=route();$('#course-nav').innerHTML=UNITS.map(u=>{const lessons=L.filter(x=>x.unit===u.id);const opened=activeUnit===u.id;return `<div class="module-nav ${opened?'open':''}" style="--unit-color:${u.color}"><button class="module-toggler" data-unit="${u.id}"><span class="unit-dot"></span><span class="module-label">${esc(u.short)} · ${esc(u.title)}</span><span class="module-perc">${percent(u.id)}%</span><span class="chevron">›</span></button><div class="module-items">${lessons.map((l,i)=>`<button class="lesson-nav ${progress.completed[l.id]?'done':''} ${r.name==='lesson'&&r.arg===l.id?'selected':''}" data-lesson="${l.id}"><span class="lesson-num">${progress.completed[l.id]?'✓':String(i+1).padStart(2,'0')}</span><span>${esc(l.title)}</span></button>`).join('')}</div></div>`}).join('');
  document.querySelectorAll('.nav-main').forEach(b=>b.classList.toggle('active',b.dataset.route===r.name));
}
function renderRoute(){const r=route();if(examTimer && r.name!=='exam'){clearInterval(examTimer); examTimer=null;}
  if(r.name==='lesson'&&activeLesson(r.arg)){activeUnit=activeLesson(r.arg).unit;renderLesson(activeLesson(r.arg))}
  else if(r.name==='module'&&unit(Number(r.arg))){activeUnit=Number(r.arg);renderModule(activeUnit)}
  else if(r.name==='review'){renderReview()}
  else if(r.name==='exam'){renderExam()}
  else if(r.name==='resources'){renderResources()}
  else {renderHome()}
  syncChrome();window.scrollTo({top:0,behavior:'instant'});closeMenu();
}
function crumb(s){$('#breadcrumbs').innerHTML=s}
function heroGraphic(){return `<svg viewBox="0 0 350 250" aria-hidden="true"><defs><linearGradient id="chipGrad" x1="0" x2="1"><stop stop-color="#5654ab"/><stop offset="1" stop-color="#313869"/></linearGradient></defs><g transform="translate(68 22)"><g stroke="#938fe9" stroke-width="2" opacity=".6">${Array.from({length:8},(_,i)=>`<path d="M${i*28-10} 60v-31 M${i*28-10} 171v31 M31 ${i*23+8}h-24 M236 ${i*23+8}h24"/>`).join('')}</g><rect x="29" y="29" width="208" height="148" rx="22" fill="url(#chipGrad)" stroke="#b0a9ff" stroke-width="3"/><rect x="54" y="53" width="158" height="100" rx="15" fill="#23284b" stroke="#7776c6"/><g stroke="#a6a1ff" fill="none"><path d="M66 100h35l19-28 22 61 19-34h40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="199" cy="128" r="5" fill="#76f1d1"/><text x="131" y="173" fill="#e5e2ff" font-size="11" font-family="sans-serif" text-anchor="middle">SYSTEM CORE</text></g></svg>`}

// Независимое перемешивание вопроса и его вариантов. Индексы правильных ответов не фиксированы.
function shuffle(a){let out=a.slice();for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function shuffledQuestion(q){let pairs=shuffle(q.options.map((text,i)=>({text,originalIndex:i})));return {...q,options:pairs.map(x=>x.text),correct:pairs.findIndex(x=>x.originalIndex===q.correct)};}
function getQuizSession(l){if(!quizState[l.id]||!quizState[l.id].items){let items=shuffle(l.qs).map(shuffledQuestion);quizState[l.id]={items,answers:items.map(()=>({choice:null,correct:false,wrongChoices:[]}))};}return quizState[l.id];}
function renderQuestions(l,session){
 const total=session.items.length,correct=session.answers.filter(a=>a.correct).length;
 const cards=session.items.map((q,i)=>{
   const a=session.answers[i],resolved=a.correct;
   return `<div class="quiz-question"><div class="quiz-number">ВОПРОС ${i+1} / ${total} ${q.source==='advanced'?'<span class="question-level">· ПРИМЕНЕНИЕ</span>':''}</div><div class="quiz-title">${esc(q.text)}</div>${q.options.map((o,j)=>`<button class="answer-option ${resolved&&j===q.correct?'correct':''} ${a.wrongChoices.includes(j)?'wrong':''}" data-answer="${l.id}|${i}|${j}" ${resolved||a.wrongChoices.includes(j)?'disabled':''}><span class="letter">${choiceLabel(j)}</span><span>${esc(o)}</span></button>`).join('')}${resolved?`<div class="answer-feedback good">✓ Верно. ${esc(q.why)}</div>`:a.wrongChoices.length?`<div class="answer-feedback bad">Ответ не подходит. Сравни оставшиеся варианты с объяснением механизма выше. Ошибочных попыток: ${a.wrongChoices.length}.</div>`:''}</div>`;
 }).join('');
 return cards+`<div class="quiz-footer"><div class="quiz-counter">Правильных ответов: <strong class="${correct===total?'quiz-done':''}">${correct}/${total}</strong>${progress.mistakes[l.id]?` · ошибок за всё время: ${progress.mistakes[l.id]}`:''}</div>${correct===total?`<div class="quiz-finish"><span class="quiz-done">✓ Блок закреплён</span><button class="btn btn-secondary btn-small" data-retry-lesson="${l.id}">Пройти ещё раз ↻</button></div>`:`<span style="font-size:11px;color:#98a3bf">${progress.completed[l.id]?'Ранее пройден · тренировка':'Правильно ответь на все '+total+' вопросов'}</span>`}</div>`;
}
function answerLesson(id,i,choice){
 const l=activeLesson(id);if(!l)return;
 const session=getQuizSession(l);if(i<0||i>=session.items.length)return;
 const q=session.items[i],a=session.answers[i];if(a.correct||a.wrongChoices.includes(choice))return;
 if(choice!==q.correct){a.wrongChoices.push(choice);progress.mistakes[id]=(progress.mistakes[id]||0)+1;save();}
 else{a.choice=choice;a.correct=true;if(session.answers.every(x=>x.correct)&&!progress.completed[id]){progress.completed[id]=Date.now();progress.activity[qdate()]=(progress.activity[qdate()]||0)+1;progress.reviews[id]={interval:1,due:Date.now()+86400000};toast('Блок пройден. Повторение запланировано на завтра.');}save();}
 $('#quiz-body').innerHTML=renderQuestions(l,session);if(session.answers.every(x=>x.correct))syncChrome();
}
function retryLesson(id){const l=activeLesson(id);if(!l)return;delete quizState[id];const session=getQuizSession(l);$('#quiz-body').innerHTML=renderQuestions(l,session);$('#practice-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});}

function flowSVG(items,opts={}){const W=760,H=168,pad=12,gap=15,n=items.length,w=(W-2*pad-(n-1)*gap)/n;let out=`<svg role="img" aria-label="Схема: ${esc(items.map(x=>x[0]).join(' → '))}" viewBox="0 0 ${W} ${H}">`;for(let i=0;i<n;i++){let x=pad+i*(w+gap),col=items[i][2]||'#262e52';out+=`<rect x="${x}" y="33" width="${w}" height="94" rx="14" fill="${col}" stroke="#626a97" stroke-width="1.5"/><text class="flow-label" x="${x+w/2}" y="72" text-anchor="middle">${esc(items[i][0])}</text><text class="flow-small" x="${x+w/2}" y="96" text-anchor="middle">${esc(items[i][1]||'')}</text>`;if(i<n-1){let mid=x+w+3;out+=`<path d="M${mid} 80h${gap-5} m-7 -5l7 5 -7 5" stroke="#959ad1" stroke-width="1.8" fill="none"/>`;}}return out+'</svg>'}

function exportData(){let data=JSON.stringify({...progress,exportedAt:new Date().toISOString(),format:'osy-study-v1'},null,2);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='osy-progress-'+qdate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Прогресс сохранён в JSON')}
function importData(f){if(!f)return;const reader=new FileReader();reader.onload=()=>{try{let o=JSON.parse(reader.result);if(!o||typeof o!=='object'||!o.completed||typeof o.completed!=='object')throw Error();progress={completed:o.completed||{},reviews:o.reviews||{},mistakes:o.mistakes||{},activity:o.activity||{},exams:o.exams||[]};quizState={};save();renderRoute();toast('Прогресс восстановлен')}catch(e){toast('Не удалось прочитать файл прогресса')}};reader.readAsText(f)}
function updateViz(action){if(action==='race-next')vizState.race=(vizState.race+1)%7;else if(action==='race-reset')vizState.race=0;else if(action==='pipe-write')vizState.pipe+='OS';else if(action==='pipe-read'){if(vizState.pipe)vizState.pipe=vizState.pipe.slice(2);else toast(vizState.pipeClosed?'EOF: read вернул 0':'Нет данных: блокирующий read ждал бы писателя');}else if(action==='pipe-close')vizState.pipeClosed=true;else if(action==='pipe-reset'){vizState.pipe='';vizState.pipeClosed=false;}else if(action.startsWith('cache-')){const s=action.slice(6);if(s==='reset'){vizState.cache=[];vizState.cacheLast='Кэш очищен.';}else{let block=Number(s),lines=[null,null,null,null];for(let b of vizState.cache)lines[b%4]=b;let hit=lines[block%4]===block;vizState.cache.push(block);vizState.cacheLast=`Блок ${block} → индекс ${block%4}, tag ${Math.floor(block/4)}: ${hit?'HIT (уже был в кэше)':'MISS (потребовалась загрузка)'}`;}}
 else if(action==='translate'){let i=$('#virtual-addr');vizState.translateAddr=Math.max(0,Math.floor(Number(i?.value)||0));}
 let l=activeLesson(route().arg);if(l&&$('#visual-inner')){$('#visual-inner').innerHTML=renderVisual(l.visual)} }
function updateAmdahl(field,value){vizState[field]=Number(value);let a=vizState.amdahlA/100,p=vizState.amdahlP,s=1/(a+(1-a)/p);$('#av').textContent=vizState.amdahlA+'%';$('#pv').textContent=p;$('#speedup').textContent=s.toFixed(2)+'×';$('#efficiency').textContent=(100*s/p).toFixed(0)+'%';}
function handleClick(event){let e=event.target.closest('button,[data-go],[data-close-search],[data-search-lesson],[data-scroll]');if(!e)return;
 if(e.dataset.scroll){document.getElementById(e.dataset.scroll)?.scrollIntoView({behavior:"smooth",block:"start"});return;}
 if(e.dataset.closeSearch){hideSearch();return;}
 if(e.dataset.searchLesson){hideSearch();view('lesson/'+e.dataset.searchLesson);return;}
 if(e.dataset.route){view(e.dataset.route);return;}
 if(e.dataset.go){if(e.dataset.allReview){reviewState.all=true;reviewState.deck=[];renderReview(true);return;}view(e.dataset.go);return;}
 if(e.dataset.unit){let id=Number(e.dataset.unit);if(activeUnit===id){activeUnit=0;drawSidebar()}else{activeUnit=id;drawSidebar()}return;}
 if(e.dataset.lesson){view('lesson/'+e.dataset.lesson);return;}
 if(e.dataset.retryLesson){retryLesson(e.dataset.retryLesson);return;}
 if(e.dataset.examSize){examSize=Number(e.dataset.examSize);renderExam();return;}
 if(e.dataset.answer){let [id,i,choice]=e.dataset.answer.split('|');answerLesson(id,Number(i),Number(choice));return;}
 if(e.dataset.viz){updateViz(e.dataset.viz);return;}
 if(e.dataset.review){reviewAction(e.dataset.review);return;}
 if(e.dataset.scope){examScope=Number(e.dataset.scope);renderExam();return;}
 if(e.dataset.startExam){startExam(examScope);return;}
 if(e.dataset.examChoice!==undefined){chooseExam(Number(e.dataset.examChoice));return;}
 if(e.dataset.finishExam){finishExam();return;}
 if(e.dataset.restartExam){exam=null;renderExam();return;}
}
document.addEventListener('click',handleClick);
document.addEventListener('input',e=>{if(e.target.id==='search-input')search(e.target.value);if(e.target.dataset.vizRange)updateAmdahl(e.target.dataset.vizRange,e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='review-all'){reviewState.all=e.target.checked;renderReview(true)}});
document.addEventListener('keydown',e=>{if((e.key==='/'||e.key==='k'&&(e.metaKey||e.ctrlKey))&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();showSearch();}if(e.key==='Escape'){hideSearch();closeMenu();}});
$('#open-search').addEventListener('click',showSearch);
$('#menu-button').addEventListener('click',toggleMenu);
$('#sidebar-close').addEventListener('click',closeMenu);
$('#mobile-overlay').addEventListener('click',closeMenu);
$('#export-btn').addEventListener('click',exportData);
$('#import-btn').addEventListener('click',()=>$('#import-file').click());
$('#import-file').addEventListener('change',e=>{importData(e.target.files?.[0]);e.target.value=''});
window.addEventListener('hashchange',renderRoute);
renderRoute();

// На облачном адресе проверяем обновления без смены URL и без потери прогресса.
const CURRENT_SITE_VERSION='6.0.0';
async function checkSiteVersion(){
 if(!/^https?:$/.test(location.protocol)) return;
 try {
   const response=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
   if(!response.ok) return;
   const data=await response.json();
   if(data.version && data.version!==CURRENT_SITE_VERSION){
      const banner=document.getElementById('site-update-banner');
      banner.hidden=false;
   }
 } catch(e) { /* На локальных запусках и без сети ничего не показываем. */ }
}
document.getElementById('site-update-banner')?.addEventListener('click',()=>location.reload());
setTimeout(checkSiteVersion,4000);
setInterval(checkSiteVersion,180000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkSiteVersion();});

</script>
  <script>
'use strict';
// Mobile navigation and reading progress. No progress data is migrated or reset.
(function(){
 const tabs=document.getElementById('mobile-tabs');
 const menu=document.getElementById('mobile-topics');
 const progressFill=document.getElementById('reading-progress-fill');
 const progressTrack=document.querySelector('.reading-progress');
 function updateMobileTabs(){
   const r=route();
   tabs.querySelectorAll('[data-mobile-route]').forEach(el=>{
     const active=el.dataset.mobileRoute===r.name;
     el.classList.toggle('active',active);
     if(active)el.setAttribute('aria-current','page');
     else el.removeAttribute('aria-current');
   });
   const inLesson=r.name==='lesson'||r.name==='module';
   menu.classList.toggle('active',inLesson);
   if(inLesson)menu.setAttribute('aria-current','page');
   else menu.removeAttribute('aria-current');
   progressTrack.style.display=r.name==='lesson'?'block':'none';
   updateReadingProgress();
 }
 let queued=false;
 function updateReadingProgress(){
   if(route().name!=='lesson'){progressFill.style.width='0%';return;}
   const available=Math.max(1,document.documentElement.scrollHeight-window.innerHeight);
   progressFill.style.width=(Math.max(0,Math.min(100,scrollY/available*100))).toFixed(1)+'%';
 }
 function scheduleProgress(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;updateReadingProgress();});}
 document.addEventListener('click',e=>{
   if(e.target.closest('[data-menu-toggle]'))toggleMenu();
 });
 window.addEventListener('hashchange',updateMobileTabs);
 window.addEventListener('scroll',scheduleProgress,{passive:true});
 window.addEventListener('resize',scheduleProgress,{passive:true});
 const observer=new MutationObserver(scheduleProgress);
 observer.observe(document.getElementById('main-content'),{childList:true,subtree:false});
 updateMobileTabs();
 if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
   window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
 }
})();

</script>
