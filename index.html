'u1-08': {
 steps:`<h3>Переход между пользовательским кодом и ядром</h3><p>Если обычное приложение могло бы свободно изменять таблицы страниц или останавливать прерывания, оно могло бы повредить систему. Поэтому процессор поддерживает уровни привилегий. Для x86-64 важны <b>ring 3</b> (приложения) и <b>ring 0</b> (ядро).</p><ol><li>Приложение готовит аргументы, например файловый дескриптор, буфер и длину.</li><li>Через библиотечную обёртку или напрямую выполняется системный вызов, например <code>read</code>.</li><li>Аппаратный механизм переводит выполнение в привилегированный код ядра; ядро проверяет аргументы и права.</li><li>Ядро выполняет операцию либо ставит поток ждать результата, затем возвращает результат в приложение.</li></ol><p>Таким образом <b>системный вызов — контролируемая точка входа в ядро</b>. Он не равен обычному вызову пользовательской функции: может изменить режим привилегий и привести к ожиданию ввода-вывода. Твои <code>pipe</code>, <code>read</code>, <code>write</code>, <code>poll</code> в первой лабораторной работают именно через интерфейс ОС.</p>`,
 trap:'Не любой вызов функции C является системным вызовом. Например, простая арифметика и многие функции библиотеки работают без перехода в ядро.',
 prompt:'Объясни на примере read(), почему процессу нужен системный вызов и что происходит после обращения к ядру.',
 oral:'Приложение не имеет прямых прав на оборудование и служебные структуры ядра. Поэтому оно вызывает read(), выполнение контролируемо переходит в ядро, которое проверяет дескриптор и права, читает данные и возвращает результат.'},
'u1-09': {
 steps:`<h3>Монолитное ядро и микроядро: где располагаются службы</h3><p>У ОС много обязанностей: работать с устройствами, управлять памятью, процессами и файлами. Возможны разные архитектуры размещения этих функций.</p><ol><li><b>Монолитное ядро:</b> многие службы и драйверы исполняются в адресном пространстве ядра. Это ускоряет взаимодействие между ними, но ошибки привилегированных компонентов могут затрагивать всю систему.</li><li><b>Микроядро:</b> в ядре оставляют минимальный набор механизмов, а часть служб запускают отдельными процессами. Изоляция лучше, но обмен сообщениями между службами добавляет накладные расходы.</li><li><b>Гибридный подход:</b> сочетает свойства нескольких моделей.</li></ol><p>Linux принято относить к монолитным ядрам с поддержкой модулей. На коллоквиуме достаточно понимать идею распределения ответственности: <b>сколько функциональности работает непосредственно в привилегированном ядре</b>.</p>`,
 trap:'«Монолитное» не значит, что весь исходный код находится в одном файле, а «микроядро» не значит, что у ОС почти нет функций: многие функции просто вынесены за пределы ядра.',
 prompt:'Почему микроядра обычно считают более изолированными, но потенциально более дорогими по коммуникации?',
 oral:'Потому что службы могут работать в отдельных процессах, ограничивая последствия сбоев. Обмен между ними требует IPC и дополнительных переходов, что создаёт накладные расходы.'},
'u2-01': {
 steps:`<h3>Почему файл программы не является процессом</h3><p>На диске может лежать один исполняемый файл <code>./child</code>, но его можно запустить несколько раз. Тогда в памяти будут несколько процессов. <b>Программа</b> — код и данные исполняемого файла; <b>процесс</b> — конкретное выполнение с состоянием и ресурсами.</p><ol><li><b>PID</b> — идентификатор процесса.</li><li><b>Адресное пространство</b> — область виртуальных адресов, которые использует процесс.</li><li><b>Таблица файловых дескрипторов</b> — ссылки на открытые файлы, каналы и другие объекты ядра.</li><li><b>PCB (Process Control Block)</b> — запись ядра с информацией о процессе: состояние, учётные данные, управление памятью и др.</li></ol><p>В первой лабораторной есть родительский и дочерний процессы: они выполняют код двух программ, у каждого отдельное состояние и свои дескрипторы, хотя соответствующие концы каналов ссылаются на общие объекты ядра. Формулировка «процесс — программа в работе» полезна, но для точного ответа добавь ресурсы и контекст исполнения.</p>`,
 trap:'Не путай PID с файловым дескриптором: PID идентифицирует процесс, а FD — открытый объект внутри конкретного процесса.',
 prompt:'Один и тот же исполняемый файл запустили дважды. Сколько процессов и что у каждого будет своё?',
 oral:'Два процесса. У каждого есть PID, собственное виртуальное адресное пространство, контекст исполнения, набор ресурсов и учётная запись ядра PCB.'},
'u2-02': {
 steps:`<h3>Какие области памяти использует процесс</h3><p>Процесс работает с виртуальными адресами, а не с физическими ячейками напрямую. В типичном адресном пространстве есть несколько областей, различающихся назначением.</p><ol><li><b>Text/code:</b> машинные инструкции.</li><li><b>Data/BSS:</b> глобальные и статические данные.</li><li><b>Heap (куча):</b> память для динамических выделений, например через <code>new</code> или <code>malloc</code>.</li><li><b>Stack (стек):</b> кадры вызовов функций, часть локальных переменных и адреса возврата.</li></ol><p>Например, в <code>int *a = new int[100]</code> массив выделяется в куче, а локальный указатель <code>a</code> может находиться в стеке или регистре. Процессы могут использовать одинаковые виртуальные адреса, но благодаря отображению страниц они будут ссылаться на разные физические области. Изоляция не абсолютна: ОС умеет создавать участки совместной памяти.</p>`,
 trap:'Не говори, что стек всегда расположен строго «вверху», а куча «внизу» по всем архитектурам. Это распространённая схема, но конкретное расположение зависит от ОС и процесса.',
 prompt:'Чем отличаются стек и куча и почему два процесса могут использовать адрес 0x1000, не мешая друг другу?',
 oral:'Стек обслуживает вызовы функций, куча — динамические выделения. Виртуальные адреса каждого процесса отображаются отдельно, поэтому один и тот же адрес может означать разные физические страницы.'},
'u2-03': {
 steps:`<h3>Как процесс попадает на CPU</h3><p>Процесс может существовать, но сейчас не выполнять инструкции. Различают несколько основных состояний: <b>New</b> — создаётся, <b>Ready</b> — готов и ожидает CPU, <b>Running</b> — исполняется, <b>Blocked/Waiting</b> — ждёт событие, <b>Exit</b> — завершён.</p><ol><li>После создания процесс попадает в очередь готовых.</li><li>Планировщик выбирает готовую задачу → она становится Running.</li><li>Если задаче нужен ввод с клавиатуры, она может заблокироваться → Waiting.</li><li>Когда ввод готов, ожидание заканчивается → Ready, но это ещё не означает немедленного запуска.</li><li>Если истёк квант времени, работающую задачу могут вытеснить обратно в Ready.</li></ol><p>Представь нашу программу: дочерний процесс вызывает блокирующий <code>read</code> из пустого pipe. Он не вычисляет «пустоту» бесконечно, а ждёт новых данных. Когда родитель записывает байты, процесс снова может стать готовым к исполнению.</p>`,
 trap:'Ready и Blocked — разные вещи. Ready ждёт доступного процессора; Blocked ждёт внешнего события или ресурса. Пробуждение переводит обычно в Ready, а не сразу в Running.',
 prompt:'Почему ожидающий ввод процесс не должен постоянно занимать CPU?',
 oral:'Поскольку он не может продолжить вычисления до наступления события, ОС переводит его в ожидание и отдаёт процессор другим готовым задачам.'},
'u2-04': {
 steps:`<h3>Что сохраняется при переключении задачи</h3><p>Процессор выполняет одну или несколько задач, а планировщик периодически меняет исполняемые потоки. Чтобы вернуться к предыдущему вычислению, нужно восстановить именно то состояние, на котором выполнение остановили.</p><ol><li>Происходит событие, например прерывание таймера или блокирующий системный вызов.</li><li>Необходимые регистры, включая адрес продолжения, сохраняются в структурах задачи.</li><li>Планировщик выбирает следующую готовую задачу.</li><li>При необходимости меняется активное адресное пространство.</li><li>Восстанавливаются регистры выбранного потока, и выполнение продолжается.</li></ol><p>У этого действия есть стоимость: CPU тратит время на обслуживание переключения, а кэш/TLB могут содержать данные предыдущей задачи. Поэтому переключаться слишком часто невыгодно. В современной ОС планируется обычно <b>поток</b>, хотя в учебных схемах часто говорят о переключении процессов.</p>`,
 trap:'Системный вызов не обязательно вызывает переключение задач: ядро может выполнить его и вернуть управление тому же потоку.',
 prompt:'Какие два действия позволяют сначала приостановить один процесс, а затем корректно продолжить другой?',
 oral:'ОС сохраняет контекст текущего потока, выбирает следующий, переключает необходимые ресурсы и восстанавливает его сохранённый контекст.'},
'u2-05': {
 steps:`<h3>Родительский и дочерний процессы в Unix</h3><p>В Unix-подобных системах типичный способ создать новую программу — сочетание <code>fork()</code> и <code>exec()</code>. Это две разные операции: первая создаёт процесс, вторая заменяет исполняемую программу в уже существующем процессе.</p><ol><li>Родитель вызывает <code>fork()</code>.</li><li>После успешного вызова возникают два потока управления: в родителе <code>fork()</code> возвращает PID ребёнка, в ребёнке — <code>0</code>.</li><li>Ребёнок при необходимости вызывает <code>exec...</code>, чтобы запустить другой исполняемый файл.</li><li>Родитель может вызвать <code>wait()</code> или <code>waitpid()</code> для ожидания завершения и получения статуса.</li></ol><p>В твоей первой лабораторной родитель организует каналы до <code>fork()</code>, чтобы ребёнок унаследовал нужные дескрипторы. Затем ребёнок работает с ними независимо. Отдельные виртуальные адресные пространства после fork обычно используют оптимизацию Copy-on-Write: физические страницы копируются только при записи.</p>`,
 trap:'fork() не «запускает другой exe» самостоятельно, а exec() не создаёт новый PID. После успешного exec() старый программный образ заменяется.',
 prompt:'Что вернут fork() в родителе и ребёнке и зачем после него обычно вызывают exec()?',
 oral:'fork() создаёт дочерний процесс: в родителе возвращает PID ребёнка, в ребёнке ноль. exec() загружает новый исполняемый файл в текущий процесс, сохраняя его PID.'},
'u2-06': {
 steps:`<h3>Почему файловый дескриптор — это число</h3><p>Для процесса открытый файл или канал выглядит как небольшое целое число — <b>файловый дескриптор (FD)</b>. Это индекс в таблице дескрипторов процесса. Через него ядро находит соответствующий открытый объект.</p><ol><li><code>0</code> — обычно stdin (стандартный ввод).</li><li><code>1</code> — stdout (стандартный вывод).</li><li><code>2</code> — stderr (сообщения об ошибках).</li><li>Новые вызовы <code>open()</code> или <code>pipe()</code> возвращают новые дескрипторы.</li></ol><p><code>pipe(fd)</code> записывает два числа: <code>fd[0]</code> — чтение, <code>fd[1]</code> — запись. У двух процессов могут быть одинаковые <em>числовые</em> FD, но они не обязаны означать один и тот же объект; смысл определяется таблицей каждого процесса. При <code>fork()</code> дескрипторы наследуются и могут ссылаться на одни и те же открытые описания файлов.</p>`,
 trap:'FD — не номер физического файла на диске и не глобальный идентификатор для всей системы. Pipe тоже имеет FD, хотя не является обычным файлом.',
 prompt:'Что означает fd[0] после pipe(fd) и почему fd=3 у двух независимых процессов не обязательно один объект?',
 oral:'fd[0] — читающий конец pipe. Значение FD — локальный индекс таблицы дескрипторов конкретного процесса; одинаковые индексы у разных процессов могут ссылаться на разные объекты.'},
'u2-07': {
 steps:`<h3>Как два изолированных процесса обмениваются информацией</h3><p>У процессов обычно разные адресные пространства. Родитель не может просто взять указатель ребёнка и прочитать по нему память как свою. Для взаимодействия применяются механизмы IPC — <b>Inter-Process Communication</b>.</p><ol><li><b>Pipe/FIFO:</b> поток байтов через буфер ядра.</li><li><b>Очереди сообщений:</b> передача отдельных сообщений.</li><li><b>Разделяемая память:</b> оба процесса отображают общую физическую область; обычно требуется отдельная синхронизация.</li><li><b>Сокеты:</b> взаимодействие между процессами на одной машине или по сети.</li></ol><p>В лекции выделяются свойства канала: <b>simplex</b> — одно направление, <b>half-duplex</b> — оба направления по очереди, <b>full-duplex</b> — одновременно. Также различают потоковую передачу без границ сообщений и обмен отдельными сообщениями. Для твоей первой лабораторной нужны <b>два pipe</b>, поскольку один Unix pipe однонаправленный.</p>`,
 trap:'IPC не гарантирует синхронизацию автоматически: если есть общая память, конкурирующие записи могут дать гонку. Pipe не сохраняет границы вызовов write() как отдельные сообщения.',
 prompt:'Зачем родителю и ребёнку два канала pipe, если требуется обмен в обе стороны?',
 oral:'Один Unix pipe передаёт байты в одном направлении. Поэтому создают первый для parent→child и второй для child→parent.'},
'u2-08': {
 steps:`<h3>Как устроен pipe внутри системы</h3><p><b>Неименованный pipe</b> создаёт ядро и выдаёт процессу два файловых дескриптора. Между ними существует буфер фиксированной конечной ёмкости. С одной стороны отправляют байты, с другой забирают их в том же порядке.</p><ol><li>Родитель вызывает <code>pipe(p)</code>, затем <code>fork()</code>; ребёнок наследует дескрипторы.</li><li>Процессы закрывают ненужные концы: например, ребёнок только читает из <code>p[0]</code>, а родитель пишет в <code>p[1]</code>.</li><li><code>write()</code> записывает некоторое число байт, <code>read()</code> получает доступные байты.</li><li>Когда закрыты <b>все</b> пишущие концы и буфер опустел, <code>read()</code> возвращает <code>0</code> — EOF.</li></ol><p>Если программа отправляет две строки, получатель может увидеть их одним чтением или частями. Поэтому границы логических сообщений приходится устанавливать самому, например разделителями <code>\n</code>. <b>FIFO</b> — именованный канал, который существует как специальный объект файловой системы и может открываться независимыми процессами.</p>`,
 trap:'Закрыть только пишущий FD родителя недостаточно, если копию FD держит ребёнок или другой процесс. Тогда EOF может не наступить.',
 prompt:'Откуда read() узнаёт, что запись в pipe точно закончилась, и почему нельзя считать один read() одной строкой?',
 oral:'EOF наступает после закрытия всех пишущих концов и опустошения буфера. Pipe передаёт непрерывный поток байтов, а не сообщения с границами write().' },
'u2-09': {
 steps:`<h3>Когда read(), write() и poll() ждут</h3><p>Представь, что дочерний процесс хочет прочитать результат, но родитель пока ничего не отправил. <b>Блокирующий read()</b> обычно ждёт появление данных. Если дескриптор переведён в <b>O_NONBLOCK</b>, при отсутствии данных операция может вернуть ошибку <code>EAGAIN</code>/<code>EWOULDBLOCK</code> вместо ожидания.</p><ol><li><code>fcntl(fd, F_SETFL, flags | O_NONBLOCK)</code> включает неблокирующий режим, сохраняя остальные флаги.</li><li><code>poll()</code> помогает ждать событий сразу на нескольких FD: например, готовности stdin и ответа ребёнка.</li><li><code>POLLIN</code> сообщает, что чтение не должно блокироваться из-за отсутствия данных.</li><li><code>POLLHUP</code> означает закрытие противоположной стороны; ещё могут оставаться байты, которые нужно дочитать.</li></ol><p>Есть три принципиально разных ситуации: <b>положительное число байт</b> от read() — получили данные; <b>0</b> — EOF (для pipe при описанных условиях); <b>−1</b> — ошибка, которую уточняют по <code>errno</code>. В первой лабораторной это различие критично.</p>`,
 trap:'EAGAIN — это не EOF. poll() не читает данные самостоятельно: он сообщает о готовности, после чего вызывается read()/write(). Даже write() может записать меньше байт, чем просили.',
 prompt:'Чем отличаются read() = 0 и read() = −1 с errno=EAGAIN?',
 oral:'Ноль означает конец потока при чтении pipe. EAGAIN означает, что сейчас данных нет и неблокирующий вызов не должен ждать; запись может появиться позже.'},
'u3-01': {
 steps:`<h3>Четыре варианта параллельного выполнения</h3><p>Классификация Флинна описывает, сколько потоков <b>инструкций</b> и сколько потоков <b>данных</b> обрабатывается системой. Это способ говорить об архитектуре, а не про конкретный язык программирования.</p><ol><li><b>SISD:</b> один поток инструкций над одним потоком данных — классическая последовательная модель.</li><li><b>SIMD:</b> одна инструкция одновременно применяет одну и ту же операцию к нескольким элементам данных. Пример: сложение векторов через AVX или ARM Neon.</li><li><b>MISD:</b> несколько потоков инструкций работают над одним потоком данных — редкая категория.</li><li><b>MIMD:</b> несколько независимых потоков инструкций над разными данными; это характерно для многоядерных CPU.</li></ol><p>Например, для массива из тысячи чисел <b>SIMD</b> может сложить сразу несколько соседних элементов за одну векторную инструкцию. <b>MIMD</b> позволяет двум ядрам одновременно выполнять разные части программы или даже разные программы.</p>`,
 trap:'SIMD — не то же самое, что многопоточность: SIMD может работать внутри одного потока на одном ядре. MIMD не обязательно означает распределение по разным компьютерам.',
 prompt:'Если процессор одной инструкцией прибавляет 1 сразу к восьми числам, это SIMD или MIMD?',
 oral:'Это SIMD: один поток команд действует над несколькими элементами данных. В MIMD разные ядра могут исполнять независимые потоки команд.'},
'u3-02': {
 steps:`<h3>Одновременность и чередование — разные вещи</h3><p>Пусть есть один CPU и две задачи. Они могут казаться выполняющимися одновременно, если ОС быстро переключает исполнение между ними. Но физически в каждый момент на одном обычном исполнительном ресурсе выполняется лишь соответствующая часть работы.</p><ol><li><b>Конкурентность (concurrency):</b> задачи продвигаются в пересекающиеся периоды времени, возможно за счёт чередования.</li><li><b>Параллельность (parallelism):</b> несколько вычислений действительно выполняются одновременно на разных ресурсах.</li><li><b>Контекстное переключение:</b> сохраняет состояние одной задачи и возобновляет другую.</li></ol><p>Когда потоков больше, чем доступных логических процессоров, планировщику приходится распределять время между ними. Это само по себе не плохо для задач с ожиданием ввода-вывода, но вычислительным потокам может мешать: переключения добавляют накладные расходы. Именно поэтому «создать больше потоков» не равно «обязательно ускорить программу».</p>`,
 trap:'Число потоков, превышающее число ядер, не гарантирует замедление для всех задач: потоки, часто ожидающие I/O, могут эффективно сосуществовать.',
 prompt:'Почему две программы на одном ядре выглядят работающими одновременно, хотя истинного параллелизма между ними может не быть?',
 oral:'Планировщик быстро переключает выполнение. Каждая получает короткие интервалы CPU, поэтому пользователю кажется, что обе работают одновременно.'},
'u3-03': {
 steps:`<h3>Откуда берётся ограничение закона Амдала</h3><p>Не всю работу можно распределить по ядрам. Например, четыре потока вычисляют частичные суммы, но чтение исходных данных и итоговое объединение могут оставаться последовательными. Пусть доля последовательной работы <code>a</code>, а число исполнителей <code>p</code>.</p><p class="formula">S(p) = 1 / (a + (1 − a) / p)</p><ol><li>Последовательная доля занимает <code>a</code> времени относительно исходного исполнения.</li><li>Параллельная доля <code>1 − a</code> в идеале сокращается в <code>p</code> раз.</li><li>Суммарное время в долях исходного: <code>a + (1 − a)/p</code>; ускорение — обратное отношение.</li></ol><p>Если <b>a = 0,2</b> и <b>p = 4</b>, то <code>S = 1/(0,2 + 0,8/4) = 2,5</code>. Даже при бесконечном числе ядер предел будет <code>1/0,2 = 5</code>. На практике синхронизация и переключения могут дать ещё меньший выигрыш.</p>`,
 trap:'Ускорение не обязано быть больше единицы: накладные расходы способны замедлить программу. Граница S≤p относится к идеальной модели без сверхлинейного ускорения от кэша.',
 prompt:'Почему программа с 20% последовательного кода не ускорится в 100 раз даже на тысяче ядер?',
 oral:'Потому что последовательные 20% никуда не исчезают. Максимальное ускорение по Амдалу равно 1/0,2 = 5, даже если параллельную часть выполнять мгновенно.'},
'u3-04': {
 steps:`<h3>Что потоки разделяют, а что нет</h3><p><b>Поток</b> — самостоятельная последовательность исполнения внутри процесса. В одном процессе могут существовать несколько потоков, которые одновременно используют одни и те же данные в куче и глобальные переменные.</p><ol><li><b>Общие для потоков процесса:</b> виртуальное адресное пространство, код, глобальные данные, куча и обычно таблица открытых FD.</li><li><b>Собственные для каждого потока:</b> набор регистров, указатель инструкции и стек, состояние планирования.</li></ol><p>Например, два потока одновременно меняют <code>int counter</code>, созданный в общей памяти. Оба видят одну переменную, но их операции могут конфликтовать. Два <b>процесса</b> по умолчанию изолированы друг от друга и должны использовать IPC для обмена. Потоки дешевле коммуницируют через память, но ошибка одного потока может повредить весь процесс.</p>`,
 trap:'Не говори, что у потоков «полностью общая память»: стеки у них отдельные, хотя один поток технически может обращаться к данным стека другого при наличии адреса и корректных правил жизни объектов.',
 prompt:'Почему потоки быстро обмениваются данными, но требуют особого внимания к гонкам?',
 oral:'Они живут в одном адресном пространстве и читают общие переменные напрямую. При одновременном чтении и записи без синхронизации результаты могут зависеть от порядка выполнения.'},
'u3-05': {
 steps:`<h3>Кто управляет потоками — библиотека или ОС</h3><p>Потоки можно реализовать на разных уровнях. Важная идея: планирование не обязано происходить только внутри ядра.</p><ol><li><b>KLT (Kernel-Level Threads):</b> ядро знает о каждом таком потоке и планирует его на процессоры. Если один блокируется, остальные обычно могут продолжать.</li><li><b>ULT (User-Level Threads):</b> библиотека переключает пользовательские потоки самостоятельно; в чистой модели многие ULT выполняются поверх одного потока ядра.</li><li><b>Гибридная модель:</b> несколько пользовательских потоков распределяются по нескольким ядерным потокам.</li></ol><p>Переключить ULT можно без обращения в ядро, поэтому накладные расходы потенциально меньше. Но если всё приложение исполняется поверх одного потока ядра, его блокирующая операция может остановить остальные ULT. Реальная производительность зависит от того, умеет ли среда исполнения использовать неблокирующий I/O и правильно распределять потоки.</p>`,
 trap:'Не все современные реализации пользовательских потоков блокируют весь процесс на любой операции: планировщики, асинхронный I/O и модели M:N позволяют обходить многие ограничения.',
 prompt:'За счёт чего переключение ULT может быть дешевле, чем KLT, и в чём риск?',
 oral:'ULT переключает библиотека без вмешательства ядра. Это снижает накладные расходы, но при неудачной модели блокирующий системный вызов может остановить исполнение остальных пользовательских потоков.'},
'u3-06': {
 steps:`<h3>Почему не стоит создавать новый поток для каждого элемента массива</h3><p>В модели <b>Fork–Join</b> основная задача создаёт несколько параллельных ветвей, ожидает завершения всех ветвей и объединяет результат. Это удобно и понятно, но имеет стоимость.</p><ol><li><b>Fork:</b> создать несколько рабочих потоков или задач.</li><li><b>Work:</b> выполнить независимые части работы.</li><li><b>Join:</b> дождаться результатов и объединить их.</li></ol><p>Допустим, нужно сложить миллион элементов. Если создать миллион системных потоков, время уйдёт на выделение стеков, планирование и переключения. Разумнее создать фиксированное число рабочих потоков, сопоставимое с числом доступных вычислительных ресурсов, и разделить массив на части. <b>Пул потоков</b> переиспользует уже созданные потоки для новых заданий и уменьшает повторные накладные расходы.</p>`,
 trap:'Fork–Join в презентации означает модель разделения и ожидания потоков, а не системный вызов Unix fork() для создания процессов. Название одинаковое, но механизмы разные.',
 prompt:'Зачем нужен join и чем пул потоков полезнее постоянного создания новых потоков?',
 oral:'Join позволяет дождаться завершения параллельных ветвей и собрать общий результат. Пул переиспользует потоки, уменьшая затраты на их многократное создание и уничтожение.'},
'u3-07': {
 steps:`<h3>Как два инкремента дают результат 1 вместо 2</h3><p>Выражение <code>counter++</code> кажется единым действием, но обычно состоит из нескольких шагов: прочитать значение, прибавить один, записать результат. Эти действия могут перемешиваться с действиями другого потока.</p><ol><li>Поток A читает <code>counter = 0</code>.</li><li>Поток B тоже читает <code>counter = 0</code>.</li><li>Поток A вычисляет 1 и записывает 1.</li><li>Поток B вычисляет 1 и записывает 1.</li></ol><p>Ожидалось <code>2</code>, а получилось <code>1</code> — <b>потерянное обновление</b>. Гонка данных возникает, когда два потока обращаются к одной области памяти без достаточной синхронизации, хотя бы один её изменяет. В C++ формальная data race над обычным объектом ведёт к неопределённому поведению; пример с единицей иллюстрирует лишь один возможный эффект.</p>`,
 trap:'<code>volatile</code> не делает инкремент атомарным и не устраняет data race в C++. Для защиты нужны mutex или соответствующие атомарные операции.',
 prompt:'Почему counter++ нельзя считать одной неделимой операцией и как получить правильное значение?',
 oral:'Потоки могут прочитать одно и то же старое значение до записи. Нужно синхронизировать критическую секцию мьютексом либо использовать атомарный счётчик.'},
'u3-08': {
 steps:`<h3>Что происходит при lock и unlock</h3><p><b>Критическая секция</b> — участок кода, обращающийся к общему ресурсу, где требуется исключить конфликтующие одновременные операции. <b>Mutex</b> обеспечивает монопольное владение: в данный момент блокировку держит не более одного потока.</p><ol><li>Поток A вызывает <code>lock()</code> и успешно захватывает мьютекс.</li><li>Он читает общую переменную, меняет значение и записывает его.</li><li>Поток B пытается войти, но ждёт освобождения блокировки.</li><li>Поток A вызывает <code>unlock()</code>; только затем B может войти в защищённый участок.</li></ol><p>Ключевое правило: <b>одну и ту же общую переменную необходимо последовательно защищать одним согласованным механизмом во всех местах доступа</b>. В C++ обычно лучше использовать RAII-обёртку, например <code>std::lock_guard</code>, чтобы освободить мьютекс даже при исключении. Плата за безопасность — уменьшение параллельной части программы.</p>`,
 trap:'Если A защищает counter мьютексом, а B записывает counter без блокировки, защиты фактически нет. Нельзя забывать unlock: иначе другие потоки могут ждать бесконечно.',
 prompt:'Что делает мьютекс и почему слишком большая критическая секция снижает производительность?',
 oral:'Мьютекс допускает к защищённому ресурсу только один поток. Пока он занят, другие ждут, поэтому длинные критические секции уменьшают возможный параллелизм.'},
'u3-09': {
 steps:`<h3>Взаимная блокировка на двух ресурсах</h3><p>Представь два мьютекса: <code>A</code> защищает файл, <code>B</code> — таблицу. Поток 1 захватывает A, потом хочет B. Поток 2 захватывает B, потом хочет A. Получается цикл ожидания — <b>deadlock</b>.</p><ol><li>Поток 1 владеет A.</li><li>Поток 2 владеет B.</li><li>Поток 1 ждёт B, не освобождая A.</li><li>Поток 2 ждёт A, не освобождая B.</li></ol><p>Ни один поток не может продолжить работу. Классические необходимые условия deadlock: <b>взаимное исключение</b>, <b>удержание и ожидание</b>, <b>отсутствие принудительного изъятия</b>, <b>циклическое ожидание</b>. Чтобы устранить риск, можно во всех потоках захватывать ресурсы в <b>одном глобальном порядке</b>, например сначала A, затем B.</p>`,
 trap:'Deadlock не равен медленной работе: потоки не могут сами разрешить возникший цикл ожидания. Отсутствие прогресса может иметь и другие причины — например, бесконечный цикл.',
 prompt:'Приведи короткий пример deadlock на двух мьютексах и способ избежать его.',
 oral:'Поток 1 держит A и ждёт B, поток 2 держит B и ждёт A. Если всегда захватывать мьютексы в порядке A→B, цикл ожидания не возникает.'},
'u3-10': {
 steps:`<h3>Зачем алгоритму Петерсона и флаги, и turn/victim</h3><p>Алгоритм Петерсона — учебный способ организовать взаимное исключение для <b>двух потоков</b> без готового mutex. Он показывает идею согласования доступа через общие переменные.</p><ol><li>Каждый поток выставляет <code>flag[i] = true</code>: «хочу войти».</li><li>Затем выставляет <code>victim = i</code>: «в конфликте готов уступить».</li><li>Пока второй поток тоже хочет войти и текущий поток назначен уступающим, он ждёт.</li><li>После критической секции сбрасывает свой <code>flag[i]</code>.</li></ol><p>Если один поток хочет войти, а другой нет, он проходит сразу. Если оба хотят одновременно, переменная очередности разрешает конфликт. Важная оговорка: обычные C++ <code>bool</code> без атомарности и гарантий порядка памяти <b>не реализуют этот алгоритм безопасно на современном процессоре</b>. Для реального кода нужны атомарные переменные с подходящим memory ordering или стандартные примитивы синхронизации.</p>`,
 trap:'Один только массив флагов может заблокировать оба потока, а одна только переменная victim недостаточна. Не используй учебный псевдокод с обычным bool как production-мьютекс.',
 prompt:'Почему алгоритму Петерсона нужны и флаги намерения, и переменная очередности?',
 oral:'Флаги показывают, кто хочет войти, а переменная очередности разрешает конфликт, когда оба хотят одновременно. Вместе они дают взаимное исключение для двух участников при корректной модели памяти.'},
'u3-11': {
 steps:`<h3>Мьютекс против семафора</h3><p>Представь лабораторию с тремя одинаковыми компьютерами и десятью желающими работать. Допустить можно не более трёх человек одновременно. Для такой ситуации подходит <b>счётный семафор</b>, начальное значение которого 3.</p><ol><li><code>wait()</code> / <code>sem_wait()</code>: попытаться уменьшить счётчик, получив одно разрешение.</li><li>Если разрешений сейчас нет, поток ожидает.</li><li>После завершения работы <code>post()</code> увеличивает доступное количество разрешений и может разбудить ждущего.</li></ol><p>У мьютекса принцип другой: он обеспечивает <b>одного владельца</b> защищённой секции; у счётного семафора доступных разрешений может быть несколько. Семафор с начальным значением 1 похож на бинарную блокировку по числу разрешений, но семантика владения обычно отличается от мьютекса. Семафоры также полезны для сигнализации: один поток вызывает <code>post()</code>, другой получает событие через <code>wait()</code>.</p>`,
 trap:'Значение семафора — это количество разрешений, а не количество потоков в системе. В некоторых реализациях детали отображения ожидающих в значение счётчика отличаются.',
 prompt:'Как ограничить десять потоков тремя одновременными обращениями к ресурсу?',
 oral:'Создать счётный семафор с начальным значением 3. Каждый поток вызывает wait перед входом и post при выходе; одновременно доступ получат не больше трёх.'},
'u3-12': {
 steps:`<h3>Сон и активное ожидание</h3><p>Когда поток не может захватить обычный mutex, ОС может перевести его в ожидание и перестать давать ему CPU до пробуждения. <b>Spinlock</b> действует иначе: поток много раз проверяет флаг в цикле, пока не сможет захватить блокировку.</p><ol><li>Spinlock выгоден, когда критическая секция <b>очень короткая</b> и ожидается минимальное время ожидания.</li><li>Если ждать долго, активное ожидание бесполезно загружает ядро.</li><li>Для корректного захвата требуется аппаратная <b>атомарная операция</b>, например compare-and-swap (CAS), чтобы два потока не «успели захватить» блокировку одновременно.</li></ol><p>Обычная операция <code>if (!locked) locked = true</code> не атомарна: оба потока могут увидеть <code>false</code>. CAS сравнивает и меняет значение как одну атомарную операцию в смысле видимости другим потокам. <b>Атомарность не означает выполнение ровно за один такт</b>, а взаимодействие с кэш-когерентностью может быть дорогим.</p>`,
 trap:'<code>volatile</code> не заменяет atomics. И атомарная операция не обязана останавливать все ядра физически: её реализация зависит от архитектуры и протоколов когерентности.',
 prompt:'Когда spinlock может быть полезен и почему нельзя сделать его через обычный bool без атомарных инструкций?',
 oral:'Он полезен при очень коротком ожидании, когда сон и пробуждение дороже нескольких проверок. Для захвата нужна атомарная проверка и установка флага, иначе два потока могут войти одновременно.'},
'u3-13': {
 steps:`<h3>Как ждать не время, а выполнение условия</h3><p>Иногда поток не хочет захватить ресурс прямо сейчас — он хочет дождаться <b>изменения состояния</b>. Например, потребитель ждёт, пока производитель положит элемент в очередь. Для этого подходит <b>условная переменная</b>.</p><ol><li>Потребитель захватывает mutex, защищающий очередь.</li><li>Если очередь пуста, вызывает <code>cond.wait(mutex)</code>: ожидание атомарно освобождает mutex и переводит поток в сон.</li><li>Производитель захватывает mutex, кладёт элемент, меняет условие и вызывает <code>notify_one()</code> или <code>notify_all()</code>.</li><li>Потребитель просыпается, повторно захватывает mutex и <b>снова проверяет условие</b>.</li></ol><p>Проверка должна быть в <code>while</code>, а не только в <code>if</code>: возможны ложные пробуждения или другой поток успеет забрать элемент. <b>Барьер</b> решает другую задачу: ни один участник не продолжает после контрольной точки, пока к ней не придут все нужные потоки.</p>`,
 trap:'Condition variable не хранит «накопленные уведомления» как счётный семафор. Если уведомление пришло, пока никто не ждал, будущий wait должен опираться на состояние предиката, а не на факт отправки сигнала.',
 prompt:'Почему при пробуждении от condition variable необходимо снова проверять условие?',
 oral:'Поток мог проснуться ложно, либо условие уже успел изменить другой поток. Поэтому проверка выполняется циклом под мьютексом.'},
'u4-01': {
 steps:`<h3>Что происходит после декодирования машинной команды</h3><p>ISA описывает, что инструкция должна сделать с точки зрения программы. Но сложной машине необязательно исполнять её как один неделимый аппаратный шаг. Например, инструкция может потребовать загрузить значение из памяти и выполнить арифметическую операцию.</p><ol><li>CPU получает байты машинной команды.</li><li>Декодер определяет операцию и её операнды.</li><li>На некоторых микроархитектурах команда превращается в одну или несколько внутренних <b>μops</b>.</li><li>Планировщик выдаёт готовые μops подходящим исполнительным блокам.</li></ol><p>Это позволяет разделять работу и использовать несколько исполнительных устройств параллельно. Однако количество μops и само представление внутренних операций зависят от конкретного CPU. Некоторые инструкции реализуются через микрокод. Для коллоквиума важно различать <b>архитектурную инструкцию</b> и внутреннюю микрооперацию.</p>`,
 trap:'Нельзя утверждать, что любая машинная команда обязательно раскладывается на несколько μops. Иногда одна инструкция соответствует одной внутренней операции.',
 prompt:'Зачем процессору преобразовывать некоторые сложные инструкции во внутренние микрооперации?',
 oral:'Чтобы разбить сложную операцию на более простые действия и эффективно распределять их по исполнительным блокам процессора.'},
'u4-02': {
 steps:`<h3>Зачем процессору разные исполнительные устройства</h3><p>Сложная программа выполняет разные виды операций. Одни складывают числа, другие вычисляют адреса памяти, третьи умножают или работают с векторами. Выгодно иметь специализированные блоки.</p><ol><li><b>ALU</b> выполняет целочисленные арифметические и логические операции.</li><li><b>AGU</b> вычисляет эффективные адреса при обращениях к памяти: например, <code>base + index * scale + offset</code>.</li><li><b>Порты исполнения</b> связывают выдачу микроопераций с аппаратными исполнительными блоками.</li></ol><p>Представь выполнение <code>x = a[i] + b[j]</code>. Нужно вычислить адреса элементов массива, прочитать данные и сложить их. Доступные AGU и ALU могут перекрывать независимые части работы. Но если несколько μops претендуют на один и тот же порт, возникают конкуренция и задержка. Конкретный состав портов — свойство микроархитектуры, а не ISA.</p>`,
 trap:'AGU не является блоком «управления виртуальной памятью» в том же смысле, что MMU: AGU формирует эффективный адрес, а трансляция виртуального адреса — отдельная задача.',
 prompt:'Чем задачи ALU и AGU отличаются друг от друга?',
 oral:'ALU выполняет арифметические и логические действия, AGU вычисляет адреса для чтения и записи памяти. Раздельные блоки помогают CPU делать несколько независимых действий одновременно.'},
'u4-03': {
 steps:`<h3>Чем суперскалярность отличается от OoO</h3><p>Оба механизма повышают использование ресурсов CPU, но решают разные задачи. <b>Суперскалярность</b> позволяет обрабатывать несколько инструкций за такт, а <b>out-of-order</b> разрешает начинать выполнение готовой независимой операции раньше той, что появилась в программе первой, но ждёт данные.</p><ol><li>Команда A запрашивает данные из памяти и пока ждёт.</li><li>Команда B вычисляет <code>5 + 7</code> и не зависит от A.</li><li>Команда C использует результат A и поэтому не может завершиться раньше получения данных.</li><li>OoO-планировщик может выполнить B, пока A ждёт, но должен учитывать зависимости C.</li></ol><p>Это не означает, что программа начинает вести себя произвольно. Процессор сохраняет корректное архитектурно наблюдаемое поведение инструкций. У современных OoO CPU завершение инструкций в архитектурном порядке обычно обеспечивается отдельным механизмом <b>retirement</b>.</p>`,
 trap:'Наличие нескольких ядер не равно суперскалярности: суперскалярный CPU может выдавать несколько операций внутри одного ядра.',
 prompt:'Если первая инструкция ждёт RAM, почему процессор не обязан останавливать вообще все вычисления?',
 oral:'OoO позволяет выполнять следующие готовые независимые операции, пока первая ждёт. Зависимые от неё операции всё равно должны ждать результата.'},
'u4-04': {
 steps:`<h3>Две отдельные оптимизации исполнения</h3><p><b>Переименование регистров</b> нужно, когда разные инструкции используют одинаковое архитектурное имя регистра, хотя логически вычисления независимы. Внутри процессора им могут соответствовать разные физические регистры, что убирает ложные зависимости.</p><p><b>Предсказание ветвлений</b> решает проблему переходов. При коде <code>if (x &gt; 0) A(); else B();</code> процессор иногда ещё не знает исход условия. Чтобы не оставлять конвейер пустым, он предсказывает ветвь и начинает спекулятивное исполнение.</p><ol><li>Предсказали правильно → часть работы уже выполнена, меньше ожидания.</li><li>Предсказали неправильно → ошибочная спекулятивная ветка отменяется, конвейер перенаправляется.</li></ol><p>С точки зрения программы правильный результат должен сохраняться. Эти механизмы особенно важны для современных глубоких конвейеров и OoO-процессоров, но не гарантируют выигрыш на любом коде.</p>`,
 trap:'Register renaming не меняет имена переменных в исходнике. А ошибочная ветка может затронуть микроархитектурное состояние, например кэш, даже если архитектурные результаты отменены.',
 prompt:'Зачем нужна спекуляция после условного перехода и в чём цена ошибки?',
 oral:'Она уменьшает простой конвейера, пока неизвестно условие. При неверном прогнозе выполненную по ошибочной ветви работу нужно отбросить и продолжить с правильной.'},
'u4-05': {
 steps:`<h3>Почему процессор читает не по одному байту</h3><p>Оперативная память сравнительно медленная, поэтому процессор хранит копии недавно использованных данных в кэше. Кэш оперирует обычно не отдельными байтами, а <b>линиями</b> фиксированного размера — например, 64 байта.</p><ol><li>Программа запрашивает <code>a[0]</code>.</li><li>Если нужной линии в L1 нет, возникает <b>miss</b>; CPU ищет её ниже по иерархии.</li><li>В кэш загружается линия, содержащая <code>a[0]</code> и соседние элементы.</li><li>Обращение к <code>a[1]</code> может оказаться <b>hit</b>, потому что данные уже рядом.</li></ol><p>Это называется <b>пространственной локальностью</b>. <b>Временная локальность</b> — вероятность снова использовать недавно востребованные данные. Именно поэтому последовательный проход по массиву обычно лучше использует кэш, чем случайные переходы по большой разрозненной структуре.</p>`,
 trap:'Промах L1 не всегда означает обращение к RAM: данные могут быть в L2 или L3. Размер строки 64 байта распространён, но зависит от CPU.',
 prompt:'Почему чтение одного элемента массива часто ускоряет чтение соседних элементов?',
 oral:'В кэш загружается целая линия, включающая соседние элементы. Следующие обращения попадают в уже загруженную строку и не требуют нового обращения к RAM.'},
'u4-06': {
 steps:`<h3>Почему CPU использует несколько уровней кэша</h3><p>Хотелось бы иметь огромную память со скоростью регистров, но это ограничено площадью кристалла, энергопотреблением и физическими задержками. Поэтому строят иерархию.</p><ol><li><b>L1:</b> обычно маленький и очень быстрый; часто отдельно L1I для инструкций и L1D для данных.</li><li><b>L2:</b> больше L1, обычно медленнее.</li><li><b>L3:</b> часто ещё больше и может разделяться несколькими ядрами.</li><li><b>RAM:</b> существенно больше и медленнее процессорных кэшей.</li></ol><p>Данные ищутся по уровням в соответствии с реализацией CPU. Если строка уже находится в L1, это очень быстро; если нет, запрос может обратиться в нижние уровни. Примерные задержки из лекции — L1 около 3 циклов, L2 около 10, RAM около 250 — подходят как иллюстрация масштабов, но не как универсальные характеристики всех процессоров.</p>`,
 trap:'SSD не является следующим обычным уровнем CPU-кэша после RAM: обращение к диску идёт через ОС и устройство, например при page fault и подкачке.',
 prompt:'Зачем нужны одновременно L1, L2 и L3, если все они кэшируют данные?',
 oral:'Маленький L1 обеспечивает минимальную задержку, а более крупные L2/L3 снижают частоту медленных обращений к RAM. Это компромисс между скоростью, объёмом и стоимостью.'},
'u4-07': {
 steps:`<h3>Куда попадёт блок оперативной памяти</h3><p>В кэше есть ограниченное число строк. Нужно решить, куда можно положить новую линию и как потом быстро её найти.</p><ol><li><b>Direct-mapped:</b> каждому блоку соответствует только одна строка кэша. Для четырёх строк индекс равен <code>block_number mod 4</code>.</li><li><b>Fully associative:</b> блок может расположиться в любой строке; поиск требует более сложного сравнения.</li><li><b>Set-associative:</b> кэш разбит на наборы; блок попадает в один набор, но может занимать несколько путей (ways) внутри него.</li></ol><p>Пример: в direct-mapped кэше из четырёх строк блоки 0 и 4 используют один индекс 0. Если программа попеременно читает эти блоки, они вытесняют друг друга и создают <b>конфликтные промахи</b>. Ассоциативность уменьшает такие конфликты ценой более сложного оборудования.</p>`,
 trap:'Формула mod применяется к номеру блока (линии памяти), а не обязательно к буквальному байтовому адресу. Сначала нужно учесть размер линии.',
 prompt:'Почему последовательность обращений к блокам 0, 4, 0, 4 вызывает много промахов в direct-mapped кэше из четырёх строк?',
 oral:'Оба блока отображаются в одну строку с индексом 0 и постоянно вытесняют друг друга.'},
'u4-08': {
 steps:`<h3>Как кэш отличает два блока с одинаковым индексом</h3><p>Представь direct-mapped кэш из четырёх строк. Блоки 1, 5 и 9 все отображаются в строку 1. Одного индекса недостаточно, чтобы понять, какой из блоков сейчас лежит в этой строке. Нужна служебная информация.</p><ol><li><b>Index:</b> выбирает строку или набор кэша.</li><li><b>Tag:</b> оставшаяся часть адреса, позволяющая отличить блоки с одинаковым индексом.</li><li><b>Valid bit:</b> показывает, заполнена ли строка действительными данными.</li></ol><p>При обращении CPU вычисляет индекс, проверяет valid и сравнивает tag. Если valid=1 и тег совпадает, получаем <b>hit</b>; иначе — <b>miss</b> и нужно загрузить новую линию. Например, блок 5 имеет index=1 и tag=1 при четырёх строках, а блок 1 — index=1 и tag=0.</p>`,
 trap:'Совпадения индекса недостаточно для hit. Должны совпасть tag и valid, а для некоторых видов кэша также учитываются признаки доступности и состояния когерентности.',
 prompt:'Для чего нужны tag и valid, если номер строки кэша уже вычислен?',
 oral:'Tag проверяет, какой именно блок находится в строке, а valid сообщает, можно ли использовать её содержимое. По одному индексу нельзя отличить конфликтующие адреса.'},
'u4-09': {
 steps:`<h3>Почему у процессов виртуальные адреса</h3><p>Если бы программа знала только реальные физические адреса RAM, её было бы сложно безопасно размещать рядом с другими программами. <b>Виртуальная память</b> даёт каждому процессу собственное представление адресного пространства.</p><ol><li>Приложение обращается к виртуальному адресу, например <code>0x1000</code>.</li><li>Аппаратный MMU с помощью таблиц страниц переводит его в физический адрес.</li><li>Для другого процесса тот же виртуальный адрес может соответствовать другой физической странице.</li><li>Права страниц позволяют запретить запись, исполнение или доступ целиком.</li></ol><p>ОС может не держать в RAM все виртуальные страницы сразу: некоторые вообще ещё не выделены физически, другие представлены файлом или могут выгружаться. Именно так появляются изоляция процессов, гибкое размещение памяти и возможность работать с адресным пространством, не совпадающим один к одному с физической RAM.</p>`,
 trap:'Наличие виртуальной памяти не означает, что «каждый процесс всегда получает память размером больше RAM». Виртуальное пространство может быть разреженным и частично не отображённым.',
 prompt:'Почему два процесса могут безопасно обращаться по одинаковому виртуальному адресу?',
 oral:'У каждого свои таблицы отображения адресов: один и тот же виртуальный адрес можно перевести в разные физические страницы. Это позволяет изолировать процессы.'},
'u4-10': {
 steps:`<h3>Путь от виртуального адреса к данным</h3><p><b>MMU (Memory Management Unit)</b> — аппаратный механизм трансляции адресов. Операционная система задаёт таблицы страниц, а процессор использует их при обращении к памяти. Чтобы не ходить в таблицы на каждый доступ, существует быстрый кэш трансляций — <b>TLB</b>.</p><ol><li>CPU формирует виртуальный адрес.</li><li>MMU проверяет, есть ли нужное отображение в TLB.</li><li>При попадании в TLB быстро определяется физический фрейм.</li><li>При промахе в TLB может потребоваться обход таблиц страниц.</li><li>Если страница отсутствует, не отображена или нарушены права, возникает <b>page fault</b>, который обрабатывает ядро.</li></ol><p><b>Page fault — не обязательно ошибка программы.</b> Он может означать, что страница существует в отображении, но ещё не загружена в RAM, и ядро может её подгрузить. А попытка записать в запрещённую область приводит к ошибке доступа, которую ОС может передать программе как сигнал или исключение.</p>`,
 trap:'TLB не является кэшем обычных данных, как L1D. Он хранит трансляции виртуальных страниц. И не каждый TLB miss вызывает page fault.',
 prompt:'Чем TLB miss отличается от page fault?',
 oral:'TLB miss означает, что нет готовой трансляции в TLB и нужно узнать её через таблицы. Page fault возникает при нарушении условий отображения страницы и требует обработки ядром.'},
'u4-11': {
 steps:`<h3>Что означают 10 + 10 + 12 бит</h3><p>В презентации рассмотрена классическая <b>32-битная x86 без PAE</b> с размером страницы 4 КиБ. Виртуальный адрес делится на три части: индекс каталога страниц, индекс таблицы страниц и смещение внутри страницы.</p><ol><li><b>10 старших бит:</b> выбор одной из 1024 записей Page Directory.</li><li><b>Следующие 10 бит:</b> выбор одной из 1024 записей Page Table.</li><li><b>12 младших бит:</b> смещение 0…4095 внутри страницы, потому что 2¹² = 4096 байт.</li></ol><p>Например, виртуальный адрес <code>0x00001234</code> попадает на виртуальную страницу 1 со смещением <code>0x234</code>. Если таблица отображает эту страницу на физический фрейм с началом <code>0x9000</code>, физический адрес будет <code>0x9234</code>. Многоуровневость экономит память, когда значительная часть виртуального пространства не используется. В реальных x86-64 таблицы обычно имеют больше уровней и другое разбиение адреса.</p>`,
 trap:'На слайде есть неточная формулировка порядка битов: младшие 12 бит — это смещение, старшие биты задают индексы. Не применяй схему 10/10/12 напрямую к 64-битному x86-64.',
 prompt:'Почему в 32-битном адресе с 4-КиБ страницами под смещение отводится именно 12 бит?',
 oral:'Размер страницы равен 4096 байт = 2¹², значит для выбора конкретного байта внутри страницы достаточно 12 младших бит адреса.'},
'u4-12': {
 steps:`<h3>Чем mmap отличается от read()/write()</h3><p>Обычный интерфейс файлов использует системные вызовы для чтения и записи буфера. <b>mmap</b> позволяет отобразить содержимое файла в виртуальную память процесса, после чего программа работает с ним через указатель как с массивом.</p><ol><li>Открываем файл, получаем <code>fd</code>.</li><li>Вызываем <code>mmap(addr, length, prot, flags, fd, offset)</code>.</li><li>Ядро создаёт отображение страниц; фактическая загрузка может происходить лениво при обращениях.</li><li>Программа читает и изменяет байты через полученный адрес.</li><li>По окончании обычно вызывают <code>munmap()</code>.</li></ol><p>При <code>MAP_SHARED</code> изменения могут передаваться в общий отображаемый файл; <code>msync()</code> используется, когда нужны особые гарантии синхронизации данных. При <code>MAP_PRIVATE</code> изменяемые страницы становятся частными (Copy-on-Write), и запись через отображение не меняет исходный файл. <b>mmap не гарантирует мгновенную загрузку всего файла в RAM</b>.</p>`,
 trap:'Нельзя считать, что при MAP_SHARED каждый байт сразу физически записан на диск: действуют буферизация и правила синхронизации.',
 prompt:'Почему после mmap можно обращаться к файлу как к массиву и чем отличаются MAP_SHARED и MAP_PRIVATE?',
 oral:'mmap связывает область виртуальных адресов с файлом. MAP_SHARED предполагает общее отображение изменений, MAP_PRIVATE использует частные копии изменённых страниц, не записывая их обратно в файл.'},
'u4-13': {
 steps:`<h3>Почему fork не должен сразу копировать всю RAM</h3><p>Родительский процесс может занимать сотни мегабайт. Если при каждом <code>fork()</code> физически копировать все его данные, создание ребёнка окажется дорогим — особенно если ребёнок тут же вызовет <code>exec()</code>. Для этого существует <b>Copy-on-Write (CoW)</b>.</p><ol><li>После fork родитель и ребёнок могут ссылаться на одни и те же физические страницы.</li><li>Отображения защищаются так, чтобы обычная запись вызвала специальную обработку.</li><li>Когда один процесс пытается изменить общую CoW-страницу, возникает событие защиты страницы.</li><li>ОС создаёт частную физическую копию нужной страницы и разрешает запись в неё.</li><li>Другой процесс продолжает видеть исходные данные.</li></ol><p>Пример: до fork переменная содержит 10. Ребёнок пишет 20, после копирования его страница становится отдельной. Родитель по своему адресу по-прежнему читает 10. Copy-on-Write экономит память и время, когда большая часть страниц остаётся неизменной.</p>`,
 trap:'CoW не делает произвольные записи нескольких процессов атомарными: это механизм экономного копирования страниц, а не примитив синхронизации.',
 prompt:'Что именно копируется при первой записи после fork и почему это выгоднее полного копирования сразу?',
 oral:'В общем случае копируется изменяемая физическая страница, а не всё адресное пространство. Если большинство страниц не меняются, физическое копирование для них вообще не понадобится.'}
};
