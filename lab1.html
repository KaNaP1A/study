 id:'mission',title:'Что делает моя лабораторная',sub:'Смысл задания · 40 секунд объяснения',time:5,
 html:String.raw`<p>В этой лабораторной работают <strong>два отдельных процесса</strong>. Родительский процесс <code>parent</code> принимает с клавиатуры название выходного файла и строки с числами. Дочерний процесс <code>child</code> получает каждую строку, разбирает десятичные числа и вычисляет их сумму. Результат выводится в терминал и записывается в файл, имя которого было введено в начале.</p>
 <h3>Что происходит после запуска</h3><ol><li><code>parent</code> читает имя файла: например, <code>result.txt</code>.</li><li>Создаёт <strong>два неименованных канала</strong> с помощью <code>pipe()</code>.</li><li>Вызывает <code>fork()</code>, чтобы получить дочерний процесс.</li><li>В дочерней ветке меняет стандартные потоки через <code>dup2()</code> и запускает <code>./child</code> через <code>execve()</code>.</li><li>Родитель отправляет строку в первый канал, ребёнок считает сумму и отправляет её обратно по второму.</li><li>Ребёнок также пишет результат в открытый им файл; родитель отображает ответ на экране и затем ждёт завершения ребёнка через <code>waitpid()</code>.</li></ol>
 <div class="diagram"><div class="flow"><div class="box">Клавиатура → <strong>parent</strong><br>собирает строку</div><span class="arrow">→</span><div class="box">pipe1<br>байты строки</div><span class="arrow">→</span><div class="box green"><strong>child</strong><br>сумма чисел</div></div><div class="flow" style="margin-top:10px"><div class="box green">Терминал ← <strong>parent</strong></div><span class="arrow">←</span><div class="box">pipe2<br>строка результата</div><span class="arrow">←</span><div class="box green"><strong>child</strong><br>+ запись в файл</div></div><div class="hint">Прокрути схему вправо на телефоне. Каждый pipe однонаправленный, поэтому их два.</div></div>
 <div class="callout good"><strong>Ответ на защите:</strong> «Я реализовал передачу данных между двумя процессами через пару каналов. Родитель читает строки чисел, дочерний процесс суммирует их, записывает результат в файл и возвращает родителю для вывода».</div>
 <h3>Пример</h3><pre>Название файла: result.txt
Ввод: +2 +3 -1
Результат в терминале: 4.0000
Строка в result.txt: 4.0000</pre><p>Формат вывода содержит ровно четыре цифры после точки. Это свойство реализовано вручную в функции <code>floatToString()</code> дочернего процесса.</p>`,
 qs:[
  ['Как в этой реализации результат появляется одновременно в файле и на экране?', ['Ребёнок пишет в файл и в pipe2; родитель читает pipe2 и пишет в свой stdout','Родитель самостоятельно открывает файл и записывает результат, полученный от ребёнка','Два процесса попеременно записывают результат в один общий файловый дескриптор','Дочерний процесс вызывает печать на экран родителя через общий буфер stdio'],[0],'Файл открывает именно child. Его stdout перенаправлен во второй pipe; родитель читает канал и печатает результат в терминал.'],
  ['Почему в лабораторной используется два pipe?', ['Чтобы передать строку ребёнку и отдельным каналом получить ответ','Чтобы один pipe дублировал другой при ошибке','Чтобы передавать имя файла независимо от числа строк','Чтобы родитель и ребёнок получили две копии одного и того же stdout'],[0],'Обычный pipe POSIX однонаправлен. Первый несёт входные строки, второй — ответы.'],
  ['Какая программа вычисляет сумму чисел?', ['./child, запущенная через execve','parent, до вызова fork','Обе программы независимо с последующим сравнением','Ядро ОС при вызове read'],[0],'Разбор текста и вычисление выполняет processLine() в child.cpp.'],
  ['Как ребёнок узнаёт имя выходного файла?', ['Из argv[1], полученного от execve','Читает его первой строкой из pipe1','Получает путь через переменную окружения, установленную dup2','Считывает постоянный путь из parent.cpp'],[0],'Родитель формирует args: {"./child", fileName.data(), nullptr}; child использует argv[1].']
 ]

 id:'fork',title:'fork(): один процесс становится двумя',sub:'PID, возвращаемые значения, независимое исполнение',time:7,
 html:String.raw`<p><code>fork()</code> — системный вызов Unix, который создаёт новый процесс на основе вызывающего. После успешного вызова <strong>оба процесса продолжают выполнение со следующей инструкции</strong>, но возвращаемое значение <code>fork()</code> у них различается.</p>
 <div class="tablewrap"><table class="fdtable"><tr><th>Где выполняется код</th><th>Возврат <code>fork()</code></th><th>Что делает твой код</th></tr><tr><td>Родитель</td><td><code>pid &gt; 0</code> (PID ребёнка)</td><td>Читает строки, отправляет и принимает ответы</td></tr><tr><td>Ребёнок</td><td><code>pid == 0</code></td><td>Перенастраивает FD и выполняет <code>execve</code></td></tr><tr><td>Ошибка</td><td><code>pid &lt; 0</code></td><td>Закрывает каналы и завершает работу</td></tr></table></div>
 <h3>Фрагмент из parent.cpp</h3><pre>pid_t pid = fork();
if (pid &lt; 0) { /* ошибка */ }
else if (pid == 0) { /* дочерняя ветка */ }
else { /* родительская ветка */ }</pre>
 <p>Сразу после <code>fork()</code> у процессов есть собственные виртуальные адресные пространства. Внутренне система часто использует <strong>Copy-on-Write</strong>: физические страницы памяти временно общие, а при записи создаются отдельные копии. Это <em>не</em> делает переменные родителя и ребёнка общими для записи.</p>
 <p>Дескрипторы открытых файлов после <code>fork()</code> наследуются. Именно поэтому оба процесса изначально получают доступ ко всем четырём концам двух pipe и обязаны закрыть ненужные.</p>
 <div class="callout warn"><strong>Ловушка:</strong> <code>fork()</code> не начинает выполнение <code>main()</code> заново у ребёнка. Новый экземпляр программы продолжает исполнение с места возврата из <code>fork()</code>.</div>`,
 qs:[
  ['Какое значение возвращает успешный fork() в дочернем процессе?', ['PID родителя','0','PID самого ребёнка','Количество открытых файловых дескрипторов'],[1],'У ребёнка fork возвращает 0. У родителя — положительный PID созданного ребёнка.'],
  ['У родителя есть int x=10. После fork() ребёнок меняет x=20. Что видит родитель, если сам x не менял?', ['20, потому что fork разделяет все переменные','Непредсказуемое значение из-за гонки данных','10, потому что адресные пространства логически изолированы','Ошибка сегментации, так как fork запрещает запись'],[2],'Виртуальные адреса могут совпадать, но изменение данных дочерним процессом не меняет родительскую переменную.'],
  ['Что верно о файловых дескрипторах сразу после fork()?', ['Ребёнок получает копию таблицы дескрипторов, ссылающихся на те же открытые описания файлов','Все дескрипторы автоматически закрываются у ребёнка','Таблица дескрипторов является общей изменяемой структурой обоих процессов','Дескрипторы наследуются только если установлен O_NONBLOCK'],[0],'Они наследуются: каждому процессу доступен собственный номер FD, который ссылается на те же открытые файловые описания. Закрытие FD в одном процессе не закрывает его у другого.'],
  ['Почему после fork() идут проверки pid<0, pid==0 и else?', ['Чтобы различить ошибку, дочерний и родительский пути выполнения','Чтобы распределить каждый pipe между тремя отдельными процессами','Чтобы узнать число ядер, выделенных процессу','Чтобы определить, создан ли новый поток ядра или процесса'],[0],'По значению fork различаются три случая: ошибка, ребёнок, родитель.']
 ]
},

 id:'pipes',title:'Два pipe и направление передачи',sub:'pipe1, pipe2, четыре FD и закрытие концов',time:8,
 html:String.raw`<p><code>pipe(fd)</code> создаёт канал передачи <strong>потока байтов</strong> с конечным буфером в ядре. После успешного вызова <code>fd[0]</code> предназначен для чтения, <code>fd[1]</code> — для записи. Это не два разных канала, а два конца одного канала.</p>
 <p>В твоей программе два массива: <code>pipe1[2]</code> и <code>pipe2[2]</code>. <strong>pipe1</strong> предназначен для передачи строк от родителя ребёнку; <strong>pipe2</strong> — для передачи ответов от ребёнка родителю.</p>
 <div class="tablewrap"><table class="fdtable"><tr><th>Конец</th><th>Родитель</th><th>Ребёнок</th><th>Назначение</th></tr><tr><td><code>pipe1[0]</code></td><td>закрывает</td><td>читает → FD 0</td><td>вход ребёнка</td></tr><tr><td><code>pipe1[1]</code></td><td>пишет</td><td>закрывает</td><td>отправка строки</td></tr><tr><td><code>pipe2[0]</code></td><td>читает</td><td>закрывает</td><td>ответ от ребёнка</td></tr><tr><td><code>pipe2[1]</code></td><td>закрывает</td><td>пишет → FD 1</td><td>выход ребёнка</td></tr></table></div>
 <h3>Что произойдёт при отсутствии данных?</h3><p>В блокирующем режиме <code>read</code> из пустого pipe <em>ждёт появления байтов</em>, если хотя бы один пишущий конец открыт. Если <strong>все пишущие концы закрыты</strong> и буфер опустел, <code>read</code> возвращает <code>0</code>: конец потока (EOF). Если писать в pipe, у которого не осталось читателей, возникает <code>SIGPIPE</code> или ошибка <code>EPIPE</code> при игнорировании сигнала.</p>
 <div class="callout"><strong>Запомни пару:</strong> нет данных + писатель жив = ожидание. Нет данных + все писатели закрыты = EOF.</div>
 <p>Поэтому своевременные <code>close()</code> важны не только для экономии ресурсов: незакрытый лишний пишущий конец может не дать другому процессу увидеть EOF.</p>`,

 id:'dup-exec',title:'dup2() и execve(): превращаем pipe в stdin/stdout',sub:'Перенаправление стандартных потоков',time:9,
 html:String.raw`<p><code>dup2(oldfd, newfd)</code> заставляет <code>newfd</code> ссылаться на то же открытое файловое описание, что и <code>oldfd</code>. Если <code>newfd</code> уже занят, он предварительно закрывается. После этого обращения к <code>newfd</code> идут в новый источник или приёмник.</p>
 <div class="callout good"><strong>Ключевая идея:</strong> <code>child.cpp</code> вообще не должен знать, что данные пришли по pipe. Он вызывает обычный <code>read(STDIN_FILENO,...)</code>, а этот <code>stdin</code> уже подключён к первому каналу.</div>
 <h3>Точные строки из родителя</h3><pre>dup2(pipe1[0], STDIN_FILENO);   // pipe1[0] → 0
dup2(pipe2[1], STDOUT_FILENO); // pipe2[1] → 1
close(pipe1[0]);
close(pipe2[1]);
execve("./child", args.data(), environ);</pre>
 <p>Стандартные номера FD: <strong>0</strong> — stdin, <strong>1</strong> — stdout, <strong>2</strong> — stderr. После <code>dup2()</code> исходные номера <code>pipe1[0]</code> и <code>pipe2[1]</code> можно закрыть, потому что новые FD 0 и 1 продолжают указывать на те же открытые объекты.</p>
 <h3>А зачем нужен execve?</h3><p><code>fork()</code> создаёт новый процесс, но он пока выполняет программу <code>parent</code>. <code>execve()</code> заменяет исполняемый образ в этом процессе на <code>./child</code>. PID остаётся тем же; открытые дескрипторы без флага <code>FD_CLOEXEC</code> сохраняются. В данном коде аргументы составлены как <code>{"./child", fileName.data(), nullptr}</code>, а <code>environ</code> передаёт окружение.</p>
 <p><code>execve()</code> возвращает управление <strong>только при ошибке</strong>. Поэтому после него стоит <code>_exit(1)</code>. При успехе исполнение начинается в новом образе программы, в <code>main()</code> дочернего приложения.</p>
 <div class="diagram"><div class="flow"><div class="box">parent<br>fork()</div><span class="arrow">→</span><div class="box">ребёнок<br>dup2()</div><span class="arrow">→</span><div class="box green">тот же PID<br>execve("./child")</div></div><div class="hint">Наследованные стандартные FD уже направлены в pipe, а путь файла передан в аргументах запуска.</div></div>`,

 id:'fd',title:'Файловые дескрипторы и close()',sub:'Что является числом FD и почему не закрываем «всё»',time:7,
 html:String.raw`<p><strong>Файловый дескриптор (FD)</strong> — небольшое целое число, по которому процесс обращается к открытому файлу, каналу или другому объекту ввода-вывода. FD — это не содержимое файла, не адрес байта и не системный путь.</p>
 <h3>Как читать выражения в коде</h3><pre>read(STDIN_FILENO, ...);       // читать из FD 0
write(STDOUT_FILENO, ...);     // писать в FD 1
close(pipe1[0]);              // убрать ссылку на конец pipe
close(pipe2[1]);              // закрыть лишний пишущий конец</pre>
 <p>После <code>fork()</code> два процесса имеют отдельные таблицы FD, но ссылаются на одни и те же открытые системные объекты. Закрытие FD <strong>в родителе</strong> не удаляет автоматически соответствующий FD <strong>в ребёнке</strong>. ОС освобождает сам объект, когда исчезают все необходимые ссылки на него.</p>
 <h3>Почему close необходим</h3><ol><li>Без лишних читающих концов писатель корректно узнаёт, что читателей больше нет.</li><li>Без лишних пишущих концов читатель сможет получить EOF.</li><li>Не расходуются зря записи таблицы FD.</li><li>Уменьшается риск ошибочного использования дескриптора не той стороной.</li></ol>
 <p>В данном коде <code>pipe1[0]</code> после <code>dup2(...,0)</code> закрывается <strong>без потери данных</strong>: оригинальный FD 0 остаётся открытым и ведёт в первый канал.</p>
 <div class="callout warn"><strong>Частый вопрос:</strong> зачем после <code>dup2</code> делать <code>close</code>? Потому что <code>dup2</code> создаёт/заменяет ещё одну ссылку; закрытие исходной ссылки не разрывает связь со стандартным потоком.</div>`,

 html:String.raw`<p><code>read(fd, buffer, count)</code> пытается прочитать до <code>count</code> байтов и возвращает <strong>фактическое количество</strong> прочитанных байтов. Оно может быть меньше запрошенного. <code>write(fd, buffer, count)</code> также может записать меньше байтов, чем попросили, поэтому нельзя считать любой вызов завершённой отправкой.</p>
 <h3>Три результата read</h3><ul><li><code>n &gt; 0</code> — столько байтов успешно получено.</li><li><code>n == 0</code> — EOF (для pipe: больше нет данных и писателей).</li><li><code>n == -1</code> — ошибка, причина записана в <code>errno</code>.</li></ul>
 <h3>Твой протокол</h3><p>Родитель читает ввод кусками по <strong>128 байт</strong> и накапливает их в <code>line</code>. Только когда встретил <code>\n</code>, он отправляет всю строку в <code>pipe1</code>, затем ждёт ответ из <code>pipe2</code>. Ребёнок точно так же читает кусками по 128 байт и восстанавливает целую строку перед вычислением.</p>
 <pre>while (...) {
  line.push_back(buffer[i]);
  if (buffer[i] == '\n') {
    writeAll(pipe1[1], line.data(), line.size());
    readResult(pipe2[0]);
    line.clear();
  }
}</pre>
 <p>Важный вывод: <strong>pipe передаёт байты, а не строки</strong>. Одна строка из 300 символов может прийти несколькими вызовами <code>read</code>, даже если родитель записал её единым вызовом <code>write</code>.</p>
 <div class="callout good"><strong>Почему нельзя считать, что один read = одна строка?</strong> Буфер, расписание процессов и объём переданных данных могут разбить строку в произвольном месте.</div>
 <p>Родитель обрабатывает по <em>одной строке — одному ответу</em>. Такой простой протокол позволяет не перепутать порядок результатов.</p>`,

 id:'writeall',title:'writeAll, EINTR и неполная запись',sub:'Надёжная отправка всех байтов',time:7,
 html:String.raw`<p>Системный вызов <code>write</code> не обязан записать весь переданный буфер за один раз. Если он вернул положительное число <code>n</code>, это значит, что <strong>ровно n байтов были приняты</strong>; оставшиеся необходимо передать самостоятельно.</p>
 <p>И в <code>parent.cpp</code>, и в <code>child.cpp</code> есть функция <code>writeAll</code>, которая хранит счётчик <code>written</code> или <code>writeB</code> и каждый раз отправляет непрочитанный остаток.</p>
 <pre>while (written &lt; size) {
    ssize_t n = write(fd, buffer + written,
                      size - written);
    if (n == -1) {
        if (errno == EINTR) continue;
        return -1;
    }
    if (n == 0) return -1;
    written += n;
}</pre>
 <h3>Что означает EINTR?</h3><p><code>EINTR</code> означает, что операция была прервана сигналом до успешного завершения. Если <code>write()</code> вернул <code>-1</code> с <code>errno == EINTR</code>, функция просто повторяет вызов. Если часть данных уже записана, <code>write</code> обычно возвращает число реально записанных байтов — повторять с начала было бы ошибкой.</p>
 <h3>На числах</h3><p>Нужно передать 10 байтов. Первый <code>write</code> отправил 6, значит следующая попытка должна начаться с <code>buffer + 6</code> и передать оставшиеся 4. Если отправить снова первые 10, получатель увидит дубли.</p>
 <div class="callout warn"><strong>Граница реализации:</strong> на дочерней стороне чтение с <code>EINTR</code> отдельно не повторяется — ошибка немедленно завершает программу. На защите полезно уметь признать это возможным улучшением.</div>`,

 html:String.raw`<h3>Сначала — имя выходного файла</h3><p><code>readFileName()</code> читает из стандартного ввода <strong>по одному символу</strong> до <code>\n</code> или EOF. Нулевой байт <code>\0</code> запрещён. Если имя пустое, функция возвращает ошибку. Затем она добавляет завершающий нулевой байт для передачи имени как C-строки в <code>execve()</code>.</p>
 <pre>fileName.push_back('\0');
// args = {"./child", fileName.data(), nullptr}</pre>
 <h3>Затем начинается цикл обмена</h3><ol><li>Чтение до 128 байтов из клавиатуры.</li><li>Посимвольное накопление в <code>line</code>.</li><li>При <code>\n</code> — отправка строки в <code>pipe1[1]</code> через <code>writeAll</code>.</li><li>Вызов <code>readResult(pipe2[0])</code>: родитель <strong>ждёт ответ</strong> по второму каналу и сразу печатает полученные байты в собственный stdout.</li><li>Очистка <code>line</code>; переход к следующей строке.</li></ol>
 <p>При EOF клавиатуры родитель выходит из цикла. Если в <code>line</code> осталось несколько символов без перевода строки, он сам дописывает <code>\n</code> и отправляет последний запрос.</p>

 html:String.raw`<p>В <code>child.cpp</code> функция <code>processLine(buffer, n, fileFd)</code> последовательно проходит по байтам полученной строки и суммирует все записанные в ней числа.</p>
 <h3>Алгоритм для каждого числа</h3><ol><li>Пропустить пробелы и символы табуляции.</li><li>Если встретили <code>+</code> или <code>-</code>, сохранить знак.</li><li>Считать цифры целой части, обновляя <code>num = num * 10 + digit</code>.</li><li>Если есть точка, пройти по десятичным цифрам с коэффициентами <code>0.1</code>, <code>0.01</code>, <code>0.001</code> и т. д.</li><li>Проверить, что <strong>хотя бы одна цифра была</strong>, иначе ошибка.</li><li>Проверить, что за числом нет неожиданного символа: разрешены пробел, табуляция, новая строка либо конец буфера.</li><li>Добавить число со знаком к <code>sum</code>.</li></ol>

 html:String.raw`<p>Дочерний процесс не использует <code>printf</code>. Вместо этого функция <code>floatToString(float value, char* result)</code> вручную формирует строку с четырьмя знаками после десятичной точки и символом перевода строки.</p>
 <h3>Алгоритм</h3><ol><li>Если число меньше нуля, записать <code>'-'</code> и сменить знак.</li><li>Проверить на <code>NaN</code> и на слишком большое значение для преобразования в <code>long long</code>.</li><li>Взять целую часть: <code>whole = (long long)value</code>.</li><li>Получить дробную часть, умноженную на 10000, с прибавлением 0.5: <code>frac = (int)((value - (float)whole)*10000 + 0.5f)</code>.</li><li>Если <code>frac == 10000</code>, увеличить целую часть и сделать дробную нулём.</li><li>Вывести цифры целой части через остаток от деления, вставить точку и ровно 4 дробные цифры.</li><li>Закончить символом <code>\n</code>.</li></ol>
 <pre>int frac = (int)((value - (float)whole) * 10000 + 0.5f);
if (frac == 10000) { whole++; frac = 0; }
// ... сформировать "3.0050\n" вручную</pre>
 <h3>Пример округления</h3><p>Для идеального математического значения <code>1.99996</code> ожидается <code>2.0000</code>, так как пятая дробная цифра требует округления. Программа пытается добиться этого формулой выше.</p>
 <div class="callout warn"><strong>Ограничение:</strong> тип <code>float</code> хранит десятичные числа приближённо. Поэтому вывод около границ округления может отличаться от идеального десятичного результата. Правильный ответ преподавателю: «Для небольших учебных значений хватает, но для точной десятичной арифметики я бы использовал другое представление». Текущую реализацию не следует называть идеально точной.</div>

 html:String.raw`<p>Выходной файл открывает <strong>дочерний процесс</strong> в своём <code>main()</code>, уже после успешного <code>execve()</code>. Его имя приходит в <code>argv[1]</code>.</p><pre>int fileFd = open(argv[1],

 id:'errors',title:'Ошибки, сигналы, завершение',sub:'SIGPIPE, errno, waitpid, WIFEXITED',time:9,
 html:String.raw`<p>В межпроцессном взаимодействии может завершиться один процесс, пока другой ещё работает. Поэтому родитель должен проверять возвращаемые значения системных вызовов и следить за судьбой дочернего процесса.</p>
 <h3>Почему используется SIGPIPE</h3><p>Если вызвать <code>write()</code> на pipe, у которого нет читающих концов, по умолчанию процесс может получить сигнал <code>SIGPIPE</code> и завершиться. В родителе установлено игнорирование этого сигнала через <code>sigaction(SIGPIPE, ... SIG_IGN ...)</code>. Тогда неудачная запись обычно возвращает <code>-1</code> с <code>errno == EPIPE</code>, и код может обработать ошибку штатно.</p>
 <h3>Зачем waitpid</h3><pre>int status;
waitpid(pid, &status, 0);
if (failed || !WIFEXITED(status) ||
    WEXITSTATUS(status) != 0) return 1;</pre>
 <p><code>waitpid(pid,...,0)</code> ждёт завершения <strong>конкретного ребёнка</strong> и получает статус. <code>WIFEXITED(status)</code> проверяет, завершился ли процесс обычным путём (через return или exit). <code>WEXITSTATUS(status)</code> даёт код завершения, но применять его следует лишь при истинном <code>WIFEXITED</code>.</p>
 <h3>Почему в ветке execve стоит _exit(1)</h3><p>При ошибке <code>execve()</code> ребёнок не может продолжать код родителя. <code>_exit(1)</code> прекращает процесс непосредственно, без обычных обработчиков завершения и сброса буферов <code>stdio</code>.</p>
 <div class="callout warn"><strong>Где реальная слабость:</strong> <code>waitpid</code> в parent.cpp не повторяется при <code>EINTR</code>. Если преподаватель спросит об устойчивости к сигналам, это можно честно назвать местом для улучшения.</div>
 <p>В ребёнке ошибка разбора, записи в файл или вывода приводит к ненулевому завершению. Родитель при ожидании ответа может обнаружить EOF, выставить <code>failed = true</code> и сообщить об ошибке собственным кодом возврата.</p>`,

 id:'blocking',title:'Блокировки, EOF и возможный deadlock',sub:'Почему двухканальный обмен работает последовательно',time:9,
 html:String.raw`<p>Сами по себе два pipe не гарантируют отсутствия взаимоблокировки. Всё зависит от того, <strong>кто в какой момент читает или пишет</strong>. Если оба процесса одновременно блокирующе читают из пустых каналов, каждый может вечно ждать действия другого.</p>
 <h3>Правильный порядок в твоём коде</h3><ol><li>Родитель записывает <em>одну полную строку</em> в первый pipe.</li><li>Ребёнок читает её из своего stdin и вычисляет ответ.</li><li>Ребёнок записывает ответ в файл и во второй pipe.</li><li>Родитель читает из второго pipe, печатает ответ, только затем отправляет следующую строку.</li></ol>
 <p>Такой порядок называется <strong>запрос–ответ</strong>. Он сохраняет соответствие строк и не допускает ситуации, когда родитель безгранично наполняет входной канал, полностью игнорируя выходной.</p>
 <div class="diagram" id="trace-embed"><div class="eyebrow">Интерактивный сценарий одной строки</div><div id="trace-stage" class="chart-step on"></div><div class="checkline"><button class="btn" id="trace-prev">← Назад</button><button class="btn primary" id="trace-next">Следующий шаг →</button><span id="trace-counter" class="progress-text"></span></div></div>
 <h3>EOF: два разных условия</h3><p>Для родителя EOF на <code>STDIN_FILENO</code> означает, что пользователь закончил ввод. Для ребёнка EOF на <code>stdin</code> (после <code>dup2</code>) означает, что закрыты все пишущие концы первого pipe и данные закончились.</p>
 <div class="callout warn"><strong>Оговорка:</strong> при очень большой строке возможна блокировка записи, пока ребёнок читает её; это нормальная работа ограниченного буфера pipe. Однако если бы ребёнок пытался ждать ответа от родителя, не дочитав строку, можно было бы получить deadlock.</div>`,

 id:'processes',title:'Процесс, поток, ядро и системный вызов',sub:'Теория из лекций и учебника для защиты',time:8,
 html:String.raw`<p><strong>Программа</strong> — код на диске; <strong>процесс</strong> — исполняющийся экземпляр программы с собственным адресным пространством и системными ресурсами. Для управления процессом ядро хранит служебную информацию: PID, состояние, регистры, дескрипторы, данные планирования. В учебниках этот набор часто называют <strong>PCB</strong> (Process Control Block).</p>
 <p><strong>Поток (thread)</strong> — единица исполнения внутри процесса. Потоки одного процесса обычно имеют общее адресное пространство, но каждый имеет собственный стек и набор регистров. У тебя в лабораторной <strong>два процесса</strong>, а не два потока: используются <code>fork</code> и <code>execve</code>.</p>
 <h3>Что делает ядро</h3><ul><li>Создаёт и завершает процессы.</li><li>Планирует работу CPU и переключает контекст исполнения.</li><li>Предоставляет механизмы IPC, в том числе pipe.</li><li>Управляет файловыми дескрипторами и правами доступа.</li><li>Изолирует виртуальную память разных процессов.</li></ul>
 <h3>Что такое системный вызов</h3><p>Системный вызов — контролируемый переход от пользовательского кода к услуге ядра. В лабораторной операции <code>fork</code>, <code>pipe</code>, <code>read</code>, <code>write</code>, <code>open</code>, <code>dup2</code>, <code>execve</code> и <code>waitpid</code> через системные интерфейсы ОС получают доступ к ресурсам. Программа пользователя не должна напрямую перенастраивать таблицы процессов или читать произвольные адреса памяти ядра.</p>
 <div class="callout good"><strong>Объяснение для преподавателя:</strong> «Два отдельных процесса не делят обычные переменные, поэтому для передачи строк я применил IPC — неименованные каналы pipe. Ядро хранит буферы каналов и обеспечивает безопасное чтение и запись».</div>
 <p>Переключение контекста означает, что ОС сохраняет состояние одного выполняющегося потока и восстанавливает состояние другого. Сам вызов <code>read</code> не обязательно вызывает переключение: это зависит от того, заблокируется ли вызывающий поток, и от планировщика.</p>`,

 html:String.raw`<h3>Что вводит пользователь</h3><pre>result.txt
5 -5 0
+2 +3 -1</pre>
 <p>Первая строка — имя файла. После создания каналов и запуска дочерней программы родитель отправляет строку <code>5 -5 0\n</code>. <code>child</code> разбирает <code>5</code>, <code>-5</code>, <code>0</code> и получает сумму 0. Он формирует <code>0.0000\n</code>, пишет её в файл и в stdout, который на деле является pipe2. Родитель копирует ответ на терминал.</p>
 <p>Только после этого родитель отправляет вторую строку <code>+2 +3 -1\n</code>. Результат — <code>4.0000\n</code>. В файле теперь две строки: <code>0.0000</code> и <code>4.0000</code>.</p>
 <div class="diagram"><div class="flow"><div class="box">Шаг 1<br><strong>parent</strong><br>"5 -5 0\n"</div><span class="arrow">→</span><div class="box">pipe1</div><span class="arrow">→</span><div class="box green"><strong>child</strong><br>5-5+0=0</div></div><div class="flow" style="margin-top:10px"><div class="box green">Терминал<br><strong>0.0000</strong></div><span class="arrow">←</span><div class="box">pipe2</div><span class="arrow">←</span><div class="box green">Файл: 0.0000<br>child → pipe2</div></div></div>
 <h3>Конец работы</h3><p>Когда пользователь завершает ввод (EOF), родитель закрывает пишущий конец <code>pipe1[1]</code>. Ребёнок видит EOF, завершает цикл, закрывает выходной файл и возвращает 0. Родитель завершает чтение, закрывает каналы, ждёт <code>waitpid</code> и проверяет код завершения.</p>
 <div class="callout warn"><strong>Важное отличие:</strong> <code>result.txt</code> содержит <em>результаты</em>, а не входные строки с числами. При новом запуске тот же файл будет очищен из-за <code>O_TRUNC</code>.</div>`,

 id:'edge',title:'Сложные вопросы и ограничения реализации',sub:'Что говорить, когда преподаватель копает глубже',time:10,
 html:String.raw`<h3>1. Можно ли использовать один pipe для ответа и запроса?</h3><p>Для двух направлений в POSIX обычно используют два разных pipe. Одним обычным pipe безопасно организовать противоположные направления между теми же процессами не получится: это однонаправленный поток от писателей к читателям. Альтернатива — <code>socketpair</code>, но в данной работе выбран простой вариант с двумя pipe.</p>
 <h3>2. Почему у ребёнка нет poll() и O_NONBLOCK?</h3><p>В <strong>актуальном коде из GitHub</strong> не используется <code>poll</code> и не включается <code>O_NONBLOCK</code>. Это блокирующая схема запрос–ответ. Ранние наброски лабораторной могли быть другими, но на защите нужно объяснять именно код, который сдаёшь.</p>
 <h3>3. Может ли float дать неправильное округление?</h3><p>Да. Сумма хранится в <code>float</code>, а многие десятичные дроби в двоичной арифметике представлены неточно. В определённых случаях итоговое округление до четырёх знаков может отличаться от десятичного эталона. Это ограничение реализации, а не IPC.</p>
 <h3>4. Что будет, если ребёнок завершится при неправильном вводе?</h3><p><code>processLine</code> возвращает <code>-1</code>, child завершает программу с ошибкой. При попытке читать ответ родитель заметит EOF во втором канале или ошибку записи в первый канал. Родитель выставит <code>failed</code> и вернёт ненулевой код. Промежуточные результаты могут уже находиться в файле.</p>
 <h3>5. Почему close() до waitpid()?</h3><p>Чтобы ребёнок смог увидеть EOF из pipe1 и корректно завершиться. Если бы родитель держал запись в pipe1 открытой и ждал ребёнка, который ждёт новых байтов, возникло бы взаимное ожидание.</p>
 <div class="callout good"><strong>Как отвечать, если не уверен:</strong> «По моему коду происходит ... . Возможное улучшение — ...». Такой ответ лучше, чем приписать программе отсутствующий вызов или свойство.</div>`,

 html:String.raw`<h3>Что такое пользовательский режим и режим ядра?</h3><p>Пользовательские программы работают с ограниченными привилегиями. Ядро может выполнять привилегированные операции и управлять памятью, устройствами и процессами. Через системный вызов процесс запрашивает действие ядра без выдачи пользовательскому коду прямого доступа ко всем ресурсам.</p>
 <h3>Что такое прерывание?</h3><p>Событие, которое заставляет процессор перейти к обработчику. Например, аппаратное устройство может сигнализировать о готовности ввода-вывода. Исключения возникают из-за исполнения инструкций, а системный вызов инициирует управляемый переход в ядро. Это связанные, но не полностью тождественные механизмы.</p>
 <h3>Что такое IPC?</h3><p><strong>Inter-Process Communication</strong> — способы передачи информации и координации между процессами. Помимо pipe бывают сокеты, FIFO, очереди сообщений, разделяемая память. В лабораторной выбран потоковый IPC через два pipe.</p>
 <h3>Что такое блокирующий ввод-вывод?</h3><p>Это режим, при котором вызов ожидает возможности выполнить требуемую операцию. Например, чтение из пустого pipe с открытым писателем обычно блокирует поток. При неблокирующем режиме вместо ожидания возможен возврат <code>-1</code> с <code>EAGAIN</code>/<code>EWOULDBLOCK</code>.</p>
 <h3>Что делает планировщик?</h3><p>Определяет, какой готовый к выполнению поток получает процессорное время. Когда поток ждёт ввод-вывод, процессор может выполнять другие задачи. Поэтому в программе не требуется вручную «переключать» родителя и ребёнка.</p>
 <div class="callout">Теория этого блока опирается на общие концепции из ваших лекций и Таненбаума. Это не отдельные функции твоих исходников.</div>`,

 id:'defense',title:'Как защищать первую лабораторную',sub:'План устного объяснения + быстрые ответы',time:7,
 html:String.raw`<h3>Короткое выступление на 60–90 секунд</h3><div class="callout good">«Моя программа состоит из двух исполняемых файлов: parent и child. Сначала родитель считывает имя выходного файла, затем создаёт два однонаправленных pipe и вызывает fork. В дочернем процессе через dup2 перенаправляются стандартный ввод на первый канал и стандартный вывод на второй, после чего execve запускает child с именем файла в argv. Родитель читает строки чисел, передаёт их ребёнку по одному запросу и ждёт ответ. Ребёнок разбирает числа, складывает их, формирует строку с четырьмя знаками после точки, записывает в файл и в stdout, который теперь ведёт в pipe2. Родитель читает ответ и печатает его в терминал. В конце закрываются дескрипторы, родитель ждёт ребёнка через waitpid и проверяет код завершения».</div>
 <h3>На что могут указать в коде</h3><ol><li><strong><code>fork()</code></strong> — что вернёт в каждой ветке?</li><li><strong><code>pipe1[0], pipe1[1]</code></strong> — где чтение, где запись?</li><li><strong><code>dup2()</code></strong> — почему после него <code>read(0,...)</code> получает pipe?</li><li><strong><code>execve()</code></strong> — почему не возвращается при успехе?</li><li><strong><code>writeAll()</code></strong> — что делать при частичной записи?</li><li><strong><code>readResult()</code></strong> — по чему определяется конец результата?</li><li><strong><code>processLine()</code></strong> — разбор <code>.5</code>, <code>-2</code>, пробелов.</li><li><strong><code>waitpid()</code></strong> — зачем ждать завершения?</li></ol>
 <div class="callout warn"><strong>Не приписывай своей программе отсутствующие возможности:</strong> в актуальной версии нет <code>poll()</code>, <code>fcntl(O_NONBLOCK)</code>, мьютексов и потоков. Есть два процесса, два pipe, блокирующий протокол, <code>dup2</code> и <code>execve</code>.</div>
 <p>Ниже на странице можно перейти к разделу «Устные вопросы» и потренироваться отвечать без подсказок. Для закрепления открой тест на 15 или 30 вопросов, составленный из этой теории.</p>`,

 ['Если преподаватель спросит про poll(), что отвечать?', ['poll() автоматически вызывается через vector','Я использовал poll() для ожидания обоих pipe','В этой версии poll() нет; реализован синхронный запрос–ответ на блокирующем read/write','poll() находится в child.cpp внутри floatToString'],[2],'Нужно объяснять реальный код, а не прежнюю архитектуру.'],
 ['Какой вызов превращает новый процесс parent в программу child?', ['close','dup2','execve','waitpid'],[2],'fork создаёт процесс, execve заменяет его исполняемый образ.'],
 ['Каков корректный порядок последних действий родителя?', ['waitpid → закрыть pipe1[1]','Закрыть свои оставшиеся концы pipe → waitpid → проверить статус','execve повторно → fork → waitpid','Записать финальный EOF как отдельный байт → убить child'],[1],'Закрытие входного канала позволяет ребёнку увидеть EOF и нормально завершиться.']
 ]
}
];

const STORAGE='osy_lab1_progress_v1';
const $=s=>document.querySelector(s), app=$('#app');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let progress={done:{},oral:{},exams:[],last:'mission'};
try{const old=JSON.parse(localStorage.getItem(STORAGE)||'null');if(old&&typeof old==='object')progress={...progress,...old};}catch(e){}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(progress))}catch(e){}}
function getRoute(){const h=decodeURIComponent(location.hash.slice(1)||'home');let [name,id]=h.split('/');return {name,id};}
function go(r){if(location.hash.slice(1)!==r){location.hash=r}else render();}

 <div class="summary-grid" style="margin-top:18px"><div class="card"><div class="eyebrow">Твоя архитектура</div><h2>Родитель ↔ ребёнок</h2><p>Сначала имя выходного файла, потом запросы с числами: parent → pipe1 → child → pipe2 → parent. Ребёнок дополнительно записывает сумму в файл.</p><button class="btn" data-route="lesson/mission">Разобрать схему →</button></div><div class="card"><div class="eyebrow">Репетиция защиты</div><h2>Вопросы без подсказок</h2><p>Ответь вслух на вопрос, потом открой образцовый ответ. Помечай забытое, чтобы вернуться к нему позже.</p><button class="btn" data-route="oral">Начать тренировку →</button></div></div>

function quizChoose(id,i,j){const s=quizStates[id],z=s?.questions[i];if(!z||z.checked)return;const multi=z.answers.length>1;if(multi){z.chosen=z.chosen.includes(j)?z.chosen.filter(x=>x!==j):[...z.chosen,j]}else z.chosen=[j];const l=LABS.find(x=>x.id===id);$('#question-'+i).outerHTML=renderQuizQuestion(l,z,i);}
function quizCheck(id,i){const s=quizStates[id],z=s?.questions[i];if(!z||z.checked||!z.chosen.length)return;const picked=z.chosen.map(j=>z.options[j].index).sort((a,b)=>a-b),correct=[...z.answers].sort((a,b)=>a-b);z.ok=JSON.stringify(picked)===JSON.stringify(correct);z.checked=true;const l=LABS.find(x=>x.id===id);$('#question-'+i).outerHTML=renderQuizQuestion(l,z,i);const total=s.questions.filter(q=>q.checked).length,good=s.questions.filter(q=>q.ok).length;$('#quiz-total').textContent=`${good} / ${s.questions.length} верно`;$('#quiz-meter').style.width=(total/s.questions.length*100)+'%';if(total===s.questions.length){if(good>=4){progress.done[id]={score:good,at:Date.now()};toast('Блок освоен: '+good+'/5');}else toast('Есть пробелы: '+good+'/5. Разбери ошибки и повтори.');save();updateNav();$('#quiz-status').textContent=good>=4?'Блок отмечен как изученный.':'Для зачёта нужно 4 из 5. Прочитай разборы и пройди тест заново.'}}

function renderExam(){if(examTimer){clearInterval(examTimer);examTimer=null;}const last=progress.exams[progress.exams.length-1];if(!exam){app.innerHTML=`<div class="eyebrow">Репетиция коллоквиума</div><h1 class="lesson-title">Пробная защита лабораторной №1</h1><p class="lead">Случайные вопросы по всем разделам. Неверные варианты правдоподобны, порядок меняется. Есть вопросы, где правильных ответов несколько. Результаты и разбор появятся только в конце.</p><div class="card"><h2>Выбери длину тренировки</h2><div class="section-tabs">${[10,15,25,40].map(n=>`<button class="tab ${examCount===n?'active':''}" data-exam-size="${n}">${n} вопросов</button>`).join('')}</div><p class="muted">Время: от 12 до 30 минут, зависит от количества вопросов. Порядок тем и ответов случайный.</p><button class="btn primary" data-exam-start>Начать →</button></div>${last?`<div class="card"><h2>Последний результат</h2><p>${last.good} / ${last.total} (${Math.round(100*last.good/last.total)}%)</p></div>`:''}`;return;}

function renderCheat(){app.innerHTML=`<div class="eyebrow">Перед самой защитой</div><h1 class="lesson-title">Шпаргалка без лишнего</h1><p class="lead">Короткие формулировки, чтобы восстановить всю программу в памяти.</p><div class="sheet">${[
 ['Алгоритм','Имя файла → pipe ×2 → fork → dup2 → execve → чтение строки → подсчёт → запись в файл + pipe2 → печать → close + waitpid.'],
 ['pipe','fd[0] — чтение, fd[1] — запись. Один pipe однонаправленный, два — запрос и ответ. Pipe — поток байтов, не сообщений.'],
 ['fork / execve','fork порождает ребёнка: 0 у него, PID ребёнка у родителя. execve заменяет образ без создания нового PID.'],
 ['dup2','dup2(pipe1[0],0): stdin ребёнка читается из pipe1. dup2(pipe2[1],1): stdout ребёнка попадает в pipe2.'],
 ['read / write','Возврат >0 — фактические байты, 0 у read — EOF, -1 — ошибка. writeAll отправляет остатки и повторяет EINTR.'],
 ['Файл','child делает open(argv[1],O_WRONLY|O_CREAT|O_TRUNC,0644), пишет каждую сумму и закрывает перед выходом.'],
 ['Числа','processLine: пробелы, знак, цифры, точка, цифры дробной части. Без хотя бы одной цифры — ошибка. Сумма во float.'],
 ['Завершение','SIGPIPE игнорируется у родителя; EPIPE проверяется через write. waitpid, WIFEXITED, WEXITSTATUS.'],
 ['Слабые места','Нет poll и O_NONBLOCK. Не весь EINTR обрабатывается. float не даёт строгой десятичной точности.'],

function eventClick(e){const a=e.target.closest('button,[data-route]');if(!a)return;const d=a.dataset;if(d.route){go(d.route);return}if(d.page){if(d.page==='lessons'){go('lessons');toggleMenu()}else go(d.page);return}if(d.choose){const [id,i,j]=d.choose.split('|');quizChoose(id,+i,+j);return}if(d.check){const [id,i]=d.check.split('|');quizCheck(id,+i);return}if(d.retry){retry(d.retry);return}if(d.oralReveal!==undefined){oralRevealed=true;renderOral();return}if(d.oralGrade){gradeOral(d.oralGrade);return}if(d.oralMode){nextOralDeck(d.oralMode);return}if(d.examSize){examCount=+d.examSize;renderExam();return}if(d.examStart!==undefined){startExam();return}if(d.examChoice!==undefined){const j=+d.examChoice,multi=exam.items[exam.idx].answers.length>1;exam.chosen=multi?(exam.chosen.includes(j)?exam.chosen.filter(x=>x!==j):[...exam.chosen,j]):[j];renderExam();return}if(d.examNext!==undefined){examNext();return}if(d.examStop!==undefined){finishExam();return}if(d.examRestart!==undefined){exam=null;renderExam();return}}
document.addEventListener('click',eventClick);

$('#random-card').addEventListener('click',()=>{oralDeck=[Math.floor(Math.random()*ORAL.length)];oralIdx=0;oralRevealed=false;go('oral')});
