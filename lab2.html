<script>
const MODULES=[
["01","Задание и QuickSort","Алгоритм, опора, разбиения, сложность"],
["02","Процессы и POSIX Threads","Память процесса, создание, join, жизненный цикл"],
["03","Синхронизация","Гонка данных, мьютексы, deadlock и средства защиты"],
["04","Производительность","Измерения, ускорение, эффективность, закон Амдала"],
["05","CPU и память","Планировщик, кэш, RAM, виртуальная память"],
["06","Наш код и защита","Функции, терминал, тесты, объяснение преподавателю"]
];
const LESSONS=[];
function add(m,title,source,body,qs){LESSONS.push({m:m,title:title,source:source,body:body,qs:qs});}

const q=(a,b,c,d)=>[a,b,c,d];
add(0,"Что требует лабораторная","PDF ЛР №2, с. 1; объявление преподавателя",
`<p><strong>Вариант 2:</strong> отсортировать целочисленный массив параллельным алгоритмом быстрой сортировки на Си. Реализовать последовательную и параллельную версии. Для macOS и Linux использовать POSIX Threads, ограничение максимального числа потоков задавать ключом запуска.</p>
<h3>Что показать преподавателю</h3><ol><li>Два варианта алгоритма и совпадающий отсортированный результат.</li><li>Время для последовательной версии и каждого лимита потоков.</li><li>Минимум четыре значения меньше числа логических процессоров, одно равное и три существенно больше.</li><li>Графики ускорения и эффективности, исследование разных размеров и распределений входных данных.</li><li>Количество потоков стандартными средствами ОС, например <code>ps -M</code> на macOS.</li></ol><div class="warning"><strong>Не путай:</strong> <code>-t 128</code> — разрешённый максимум, а не обещание создать 128 потоков. Метрика <code>peak_reserved</code> — зарезервированные места, не число потоков на ядрах.</div>
<p>Преподаватель разрешил обычные функции С: <code>malloc</code>, <code>stdio.h</code>, <code>string.h</code>; ограничение касается стандартных средств многопоточности <code>threads.h</code> и <code>std::thread</code>. В нашей программе используются pthread и обычные функции С.</p>`,
[q("Что задаёт -t?",["Точное число физических ядер","Максимальное количество потоков, включая основной","Размер массива","Число повторов"],1,"Это верхняя граница. Маленький массив может не создать дополнительные потоки."),
q("Нужно ли сравнивать два алгоритма на одинаковых входных данных?",["Нет","Только на маленьких массивах","Да, иначе сравнение некорректно","Только при -t 1"],2,"Копируем один исходный массив в два отдельных массива перед каждым прогоном.")]);
add(0,"Как работает QuickSort","Алгоритм варианта 2; инженерное объяснение",
`<p>QuickSort — алгоритм «разделяй и властвуй» (divide and conquer). Выбираем опорное значение <code>pivot</code>, переставляем элементы по отношению к нему, рекурсивно сортируем независимые части.</p>
<div class="diagram">[8, 2, 5, 1, 9, 5, 3]\n        pivot=5\n [2, 1, 3] | [5, 5] | [8, 9]\n  сортируем    готово    сортируем</div>
<p><strong>Это именно быстрая сортировка</strong>: выбор медианы из трёх для опоры и трёхстороннее разбиение — допустимые реализации QuickSort, они не превращают алгоритм в сортировку слиянием.</p>
<h3>Сложность</h3><p>Обычно <strong>O(n log n)</strong>, худший случай <strong>O(n²)</strong>. Это оценки времени на обычной модели вычислений, а не обещание ускорения от потоков. Дополнительная память трёхсторонней сортировки in-place — O(1) на перестановки плюс стек вызовов; в нашей последовательной версии стек ограничен O(log n), поскольку меньшую часть сортируем рекурсивно.</p>`,
[q("Чем QuickSort отличается от MergeSort?",["QuickSort всегда выделяет второй массив","QuickSort разделяет данные по опорному значению","QuickSort требует ровно 2 потока","QuickSort сортирует только положительные числа"],1,"MergeSort объединяет отсортированные половины, QuickSort переставляет элементы вокруг pivot."),
q("Гарантирует ли median-of-three O(n log n) в худшем случае?",["Да","Нет, худший остаётся O(n²)","Только на macOS","Только без повторов"],1,"Медиана из трёх уменьшает частоту неудачных разбиений, но не устраняет худший случай математически.")]);
add(0,"Трёхстороннее разделение и рекурсия","Разбор src/quicksort.c; алгоритмическое дополнение",
`<h3>Инвариант Dutch National Flag</h3><p>Используем полуоткрытый интервал <code>[lo,hi)</code>. После разделения:</p><pre>[lo,lt)  : элементы &lt; pivot\n[lt,gt)  : элементы == pivot\n[gt,hi)  : элементы &gt; pivot</pre>
<p>Переменная <code>i</code> идёт по ещё не разобранным данным. Если <code>a[i]&lt;pivot</code>, переставляем с <code>a[lt]</code> и увеличиваем оба индекса. Если <code>a[i]&gt;pivot</code>, уменьшаем <code>gt</code> и меняем <code>a[i]</code> с <code>a[gt]</code>, при этом <code>i</code> <strong>не увеличиваем</strong>: новый элемент ещё неизвестен. Если равен, увеличиваем только <code>i</code>.</p>
<div class="good">Большая группа равных элементов оказывается сразу на месте. Массив из одинаковых элементов не создаёт глубокую рекурсию.</div>
<h3>Почему нет слияния?</h3><p>Обе внешние части сортируются на своих участках исходного массива. Средняя часть уже занимает правильное положение. Результат получается без дополнительного объединения.</p>`,
[q("Почему в ветке a[i] > pivot не увеличиваем i?",["Нужно повторно проверить пришедший с конца элемент","Чтобы зациклить алгоритм","Чтобы уменьшить стек","Потому что элемент уже равен pivot"],0,"После обмена новый элемент a[i] ещё не классифицирован."),
q("Что происходит с группой элементов == pivot?",["Сортируется слиянием","Пропускается как уже правильно расположенная","Копируется в новый массив","Всегда передаётся другому потоку"],1,"Средняя часть исключается из рекурсивной сортировки.")]);
add(0,"Почему параллельная сортировка корректна","ЛР №2; лекция №3 о разделении данных",
`<p>После одного вызова <code>partition_three()</code> части <code>[lo,lt)</code> и <code>[gt,hi)</code> <strong>не пересекаются</strong>. Поэтому два потока могут изменять элементы своих частей без мьютекса: они не записывают в одну ячейку массива.</p>
<p>В новой версии <strong>большая часть отдаётся новому потоку, меньшая сортируется текущим</strong>. Это поддерживает параллелизм и при неравном разбиении. Каждый поток может создавать новые потоки, но общий счётчик ограничивает их число.</p><div class="diagram">            partition\n           /         \\\n     меньшее        большее\n     текущий         новый\n       |               |\n    рекурсия        рекурсия\n       \\              /\n           pthread_join</div>
<p><strong>Важно:</strong> не обязательно создавать отдельные потоки сразу и слева, и справа. Когда текущий поток сортирует одну часть, а новый другую, две части уже могут выполняться одновременно. Дополнительный поток для каждой стороны дал бы больше расходов.</p>`,
[q("Зачем мьютекс при работе с непересекающимися частями?",["Чтобы блокировать всю сортировку","Для счётчика разрешённых потоков, а не для самих частей","Для работы malloc","Не нужен вообще"],1,"Массив разделён корректно, а общий счётчик является разделяемой изменяемой переменной."),
q("Должен ли поток ждать другие потоки перед возвращением из функции с локальной SortTask?",["Нет","Да, потому что указатель на локальную задачу должен остаться действительным","Только на Linux","Только при миллионе элементов"],1,"pthread_join гарантирует, что новый поток больше не использует локальный объект задачи.")]);
add(1,"Процесс, поток, адресное пространство","Лекции №2–3; Таненбаум/Бос, §2.1–2.2",
`<p><strong>Процесс</strong> — выполняемая программа с адресным пространством, ресурсами ОС и одним или несколькими потоками исполнения. <strong>Поток</strong> — последовательность исполнения команд внутри процесса.</p>
<div class="diagram">             ОДИН ПРОЦЕСС\n  код | глобальные данные | heap | файлы\n               ОБЩИЕ\n          /            \\\n      Поток А          Поток Б\n    регистры, стек    регистры, стек</div>
<p>У потоков общего процесса общие код, глобальные данные, heap и открытые файловые дескрипторы. У каждого свой набор регистров, программный счётчик и стек. Локальные переменные <em>обычно</em> располагаются на стеке конкретного потока, но указатель на них можно передать другому потоку — тогда нужно следить за сроком жизни объекта.</p>
<p><strong>Отличие от fork:</strong> <code>fork()</code> создаёт новый процесс с отдельным виртуальным адресным пространством (часто с copy-on-write), а <code>pthread_create()</code> — новый поток внутри того же процесса.</p>`,
[q("Какая память общая у потоков одного процесса?",["Их стеки","Код, глобальные данные и heap","Содержимое регистров","Указатели инструкции"],1,"Каждый поток имеет свой стек и регистры, но разделяет адресное пространство."),
q("Имеют ли потоки одного процесса отдельные PID как независимые процессы?",["Всегда разные PID","Нет, это потоки одного процесса; потоковые ID могут отличаться","Да, каждый pthread_create вызывает fork","Только при join"],1,"Потоки принадлежат одному процессу и совместно используют его ресурсы.")]);
add(1,"Создание потока: pthread_create","Лекция №3; Таненбаум/Бос, §2.2.3",
`<pre>int pthread_create(pthread_t *thread,\n                   const pthread_attr_t *attr,\n                   void *(*start_routine)(void *),\n                   void *arg);</pre>
<p><strong>1-й параметр:</strong> адрес <code>pthread_t</code> для записи идентификатора нового потока. <strong>2-й:</strong> атрибуты или <code>NULL</code>. <strong>3-й:</strong> адрес стартовой функции, возвращающей <code>void *</code> и принимающей <code>void *</code>. <strong>4-й:</strong> указатель на один объект аргументов.</p>
<pre>SortTask task = {arr, lo, hi, ctx};\npthread_t tid;\nint err = pthread_create(&tid, NULL,\n                         thread_entry, &task);</pre>
<p>Возвращает <code>0</code> при успехе, иначе код ошибки. <strong>Это не идентификатор потока!</strong> Новый поток может начать выполняться раньше или позже возвращения <code>pthread_create()</code>, порядок определяет планировщик ОС.</p>
<p>Стартовая функция принимает только один аргумент, поэтому несколько параметров мы упаковываем в <code>SortTask</code>.</p>`,
[q("Что возвращает pthread_create при успешном вызове?",["PID процесса","0","Адрес стека","1"],1,"0 — успех, ненулевое значение — код ошибки."),
q("Почему thread_entry принимает void *?",["Так требует интерфейс POSIX Threads","Потому что int запрещён","Потому что сортировка всегда пустая","Это системный вызов fork"],0,"pthread_create ожидает функцию с сигнатурой void *(*)(void *).")]);
add(1,"pthread_join, pthread_exit, detach","Лекция №3; Таненбаум/Бос, §2.2.3",
`<p><code>pthread_join(tid,NULL)</code> ожидает завершения указанного присоединяемого потока. Если он уже завершился, ожидание не требуется. Join позволяет безопасно использовать законченный результат и освобождает ресурсы присоединяемого потока.</p>
<pre>pthread_create(&tid,NULL,thread_entry,&task);\nparallel_range(arr,small_lo,small_hi,ctx);\npthread_join(tid,NULL);</pre>
<p>Если поставить join <strong>до</strong> сортировки в текущем потоке, мы потеряем полезное перекрытие работы. <code>pthread_exit()</code> завершает текущий поток; возврат из стартовой функции эквивалентен завершению этого потока с возвращаемым указателем. <code>pthread_detach()</code> делает поток отсоединённым: ждать его через join после этого нельзя.</p><div class="warning">В нашей реализации <code>SortTask</code> — локальная переменная вызывающего потока, поэтому нельзя уходить из функции, пока дочерний поток может пользоваться этим указателем.</div>`,
[q("Что делает pthread_join?",["Создаёт новый поток","Устанавливает mutex","Ожидает завершения выбранного потока","Заканчивает весь процесс"],2,"Join не запускает поток; созданный поток уже выполняется независимо."),
q("Для чего нужен pthread_detach?",["Сделать поток неприсоединяемым, чтобы ресурсы освобождались автоматически при завершении","Принудительно завершить все потоки","Слить две половины массива","Запретить переключения контекста"],0,"Detached-поток нельзя затем присоединить через pthread_join.")]);
add(1,"Планировщик, состояния и параллелизм","Лекции №2–3; Таненбаум/Бос, §2.2, §2.4",
`<p><strong>Concurrency</strong> — несколько задач находятся в процессе выполнения с чередованием работы. <strong>Parallelism</strong> — буквальное одновременное исполнение на разных вычислительных ресурсах. На одном ядре потоки могут чередоваться, на разных — реально выполняться параллельно.</p><p>Планировщик выбирает готовые потоки; при переключении контекста сохраняются и восстанавливаются регистры и состояние выполнения. Поток, ожидающий мьютекс, может блокироваться и не потреблять CPU как активно работающий поток.</p>
<p>Типичные состояния: <strong>ready</strong> (готов к запуску), <strong>running</strong> (исполняется), <strong>blocked</strong> (ожидает событие). Число потоков может превышать 8 логических процессоров, но это не значит, что все они одновременно исполняют инструкции.</p>`,
[q("Может ли ОС создать 128 потоков на 8 логических процессорах?",["Нет","Да, но одновременно на ядрах выполняется ограниченное число потоков","Да, значит появятся дополнительные ядра","Только через fork"],1,"Планировщик распределяет готовые потоки по доступным логическим процессорам."),
q("Что означает blocked?",["Поток исполняет QuickSort","Поток ожидает событие или ресурс","Поток уже удалён","Поток всегда использует 100% CPU"],1,"Ожидающий поток может не выполнять вычисления до готовности события.")]);
add(2,"Гонка данных, критическая секция, mutex","Лекция №3; Таненбаум/Бос, §2.3.1–2.3.2, §2.3.6",
`<p><strong>Гонка данных</strong> — несинхронизированный конфликтный доступ к общей памяти, когда минимум один поток выполняет запись. В C это неопределённое поведение. Операция <code>activeThreads++</code> может состоять из чтения, вычисления и записи, поэтому два потока без синхронизации могут потерять обновление.</p>
<pre>pthread_mutex_lock(&ctx->mutex);\nif (ctx->reserved < ctx->max_threads)\n    ++ctx->reserved;\npthread_mutex_unlock(&ctx->mutex);</pre>
<p><strong>Мьютекс</strong> обеспечивает взаимное исключение. <code>lock</code> захватывает его либо ожидает освобождения, <code>unlock</code> освобождает. Защищённый участок называется критической секцией. Проверка лимита и увеличение счётчика должны быть единым защищённым действием.</p>
<p>Наша сортировка не захватывает мьютекс вокруг всего массива: это уничтожило бы параллелизм. Блокируется лишь короткий доступ к общим счётчикам.</p>`,
[q("Почему нельзя одновременно изменить reserved без синхронизации?",["Потоки не видят heap","Возникает гонка данных/потеря обновлений","Компилятор удалит массив","pthread_create запрещает это"],1,"++ не обязан быть атомарным."),
q("Что именно освобождает pthread_mutex_unlock?",["Поток","Мьютекс","Массив","Процесс"],1,"Unlock не заканчивает выполнение потока и не удаляет мьютекс.")]);
add(2,"Инициализация mutex, trylock, атрибуты","Лекция №3; Таненбаум/Бос, §2.3.6",
`<pre>pthread_mutex_t mutex;\nint err = pthread_mutex_init(&mutex, NULL);\n/* ... lock/unlock ... */\npthread_mutex_destroy(&mutex);</pre>
<p><code>pthread_mutex_init</code> инициализирует объект мьютекса, <code>NULL</code> — стандартные атрибуты. Альтернатива при статической/допустимой инициализации — <code>PTHREAD_MUTEX_INITIALIZER</code>. <code>pthread_mutex_trylock</code> пытается получить блокировку без ожидания; если занято, возвращает ошибку.</p>
<p>Разблокировать мьютекс должен поток-владелец. Не следует повторно захватывать обычный мьютекс тем же потоком без продуманной схемы: можно получить взаимоблокировку. Уничтожать занятый мьютекс или тот, который ещё используется другими потоками, нельзя.</p>`,
[q("Что означает NULL во втором аргументе pthread_mutex_init?",["Нельзя использовать mutex","Стандартные атрибуты","Уничтожить mutex","Создать detached-поток"],1,"Мьютекс инициализируется со стандартными параметрами."),
q("Зачем pthread_mutex_trylock?",["Чтобы ждать завершения потока","Чтобы пробовать захват без блокирующего ожидания","Чтобы удалить mutex","Чтобы определить PID"],1,"При недоступном мьютексе trylock возвращает код ошибки.")]);
add(2,"Deadlock, starvation, livelock","Лекция №3; Таненбаум/Бос, §2.3, §6.1–6.4 (расширение)",
`<p><strong>Deadlock (взаимоблокировка)</strong> — потоки ждут ресурсы друг друга и не могут продолжить выполнение. Например, поток A держит M1 и ждёт M2, поток B держит M2 и ждёт M1.</p><div class="diagram">Поток A: lock(M1) → ждёт M2\nПоток B: lock(M2) → ждёт M1</div>
<p>Четыре условия Коффмана: взаимное исключение, удержание и ожидание, отсутствие принудительного изъятия, циклическое ожидание. Для предупреждения — единый порядок захвата блокировок, короткие критические секции, отказ от лишних блокировок.</p>
<p><strong>Starvation</strong> — поток неопределённо долго не получает ресурс, хотя система в целом работает. <strong>Livelock</strong> — потоки активно меняют состояние, но полезного прогресса нет. Их не следует путать с deadlock.</p>`,
[q("Что может вызвать deadlock?",["Единый порядок всех mutex","Циклическое ожидание удерживаемых ресурсов","Независимые области массива","Чтение локальной переменной"],1,"Классический случай — A ждёт M2, удерживая M1; B ждёт M1, удерживая M2."),
q("Чем starvation отличается от deadlock?",["При starvation кто-то продолжает работать, но отдельный поток может ждать бесконечно","Они идентичны","Starvation означает завершение программы","При deadlock всегда нет mutex"],0,"Starvation — голодание конкретного потока, deadlock — блокирование группы задач, зависящих друг от друга.")]);
add(2,"Атомики, volatile и модель памяти","Лекция №3, блок «Атомики»; расширение для защиты",
`<p><strong>Атомарная операция</strong> обладает неделимым логическим эффектом относительно конкурирующих потоков. Атомики применяют для счётчиков и флагов, когда не требуется сложная критическая секция. Для наших составных операций «проверить лимит + увеличить счётчик» мьютекс проще и понятнее.</p>
<p><code>volatile</code> <strong>не заменяет</strong> мьютекс и атомарные операции в многопоточном C: он не обеспечивает межпоточную синхронизацию и не делает <code>++</code> атомарным. По разрешению преподавателя допускается <code>stdatomic.h</code>, но наша реализация использует pthread mutex.</p>
<p><strong>CAS (compare-and-swap)</strong> сравнивает старое значение с ожидаемым и условно записывает новое атомарно. <strong>Memory ordering</strong> определяет допустимые отношения видимости/порядка операций между потоками. Взаимоисключение через POSIX mutex уже даёт нужные гарантии видимости для защищённой переменной.</p>`,
[q("Является ли volatile int потокобезопасным счётчиком?",["Да","Нет","Только с -O2","Только на ARM"],1,"volatile не гарантирует атомарность и синхронизацию."),
q("Что означает CAS?",["Сравнить и условно обменять значение атомарно","Создать другой процесс","Уничтожить mutex","Копировать массив"],0,"CAS — compare-and-swap, аппаратно поддерживаемый атомарный примитив.")]);
add(2,"Семафор, condition variable, spinlock","Лекция №3; Таненбаум/Бос, §2.3.5–2.3.8",
`<h3>Семафор</h3><p>Счётчик доступных ресурсов: операция wait/down пытается уменьшить, post/up увеличивает и может пробудить ожидающего. Удобен для ограничения одновременного доступа к нескольким экземплярам ресурса.</p>
<h3>Condition variable</h3><p><code>pthread_cond_wait(&cond,&mutex)</code> атомарно освобождает мьютекс и ждёт сигнал; перед возвратом вновь захватывает мьютекс. Условие всегда проверяют <strong>в цикле while</strong>, так как возможны ложные пробуждения или изменение условия до повторного захвата мьютекса. <code>signal</code> будит как минимум одного подходящего ожидающего, <code>broadcast</code> — всех ожидающих.</p>
<h3>Spinlock</h3><p>Активное ожидание в цикле: вместо засыпания поток тратит CPU на повторные проверки. Может быть уместно для очень коротких критических участков при подходящих условиях, но опасно при длительном удержании ресурса.</p>`,
[q("Почему condition wait используют с while?",["Из-за возможных ложных пробуждений и изменения условия","Чтобы увеличить число потоков","Потому что if запрещён в C","Для сортировки массива"],0,"После пробуждения нужно заново проверить условие под мьютексом."),
q("Какова основная особенность spinlock?",["Поток активно крутится в ожидании","Всегда усыпляет поток","Всегда быстрее mutex","Создаёт процесс"],0,"Активное ожидание расходует вычислительные ресурсы.")]);
add(3,"Время, повторы, медиана и честное сравнение","Объявление преподавателя; инженерная методика эксперимента",
`<p>В бенчмарке используются <code>clock_gettime(CLOCK_MONOTONIC,...)</code> и <code>struct timespec</code> со значениями <code>tv_sec</code> и <code>tv_nsec</code>. Время в миллисекундах вычисляется по разности секунд и наносекунд.</p><pre>T_ms=(end.tv_sec-start.tv_sec)*1000\n   +(end.tv_nsec-start.tv_nsec)/1000000</pre>
<p>Генератор псевдослучайных чисел имеет фиксированный seed 42. При каждом повторе исходный массив копируется в <code>seq</code> и <code>par</code>. Измеряется только сортировка: выделение памяти, генерация и копирование вне временных границ.</p>
<p>Проводим 10 повторений, берём медиану, чтобы отдельные задержки фоновых задач меньше влияли на итог. Порядок последовательной и параллельной сортировок чередуется, чтобы уменьшить эффект «первого запуска». Для ещё большей точности полезны отдельные серии и прогрев.</p>`,
[q("Почему после последовательной сортировки нельзя передать тот же массив параллельной?",["Он отсортирован и условия сравнения изменились","pthread запретит вызов","Память освободится","Время будет ноль"],0,"Обе реализации должны получать одинаковые входные данные."),
q("Зачем берут медиану нескольких времён?",["Чтобы устранить все ошибки","Чтобы снизить влияние отдельных выбросов времени","Чтобы изменить O(n²) на O(n log n)","Чтобы создать новые ядра"],1,"Медиана менее чувствительна к единичным аномально долгим запускам.")]);
add(3,"Ускорение, эффективность и графики","Лекция №3; PDF ЛР №2, с.1",
`<p><strong>Ускорение:</strong> <code>S=T_seq/T_par</code>, где <code>T_seq</code> — время последовательной версии, а <code>T_par</code> — время параллельной. <strong>Эффективность:</strong> <code>E=S/p</code>, где <code>p</code> — заранее оговорённая мера вычислительного параллелизма, обычно число используемых исполнителей.</p><p>Если измерено 94 мс и 47 мс, то S=2. При p=8 E=2/8=0.25 (25%). Если параллельная версия медленнее, S&lt;1. Идеальное S=p обычно не достигается.</p>
<div class="warning">В нашем CSV <code>efficiency_relative_to_limit</code> использует <strong>заданный лимит</strong> -t. Если реальных потоков меньше, это не загрузка ядер и не «физическая эффективность». В отчёте явно укажи знаменатель, отдельно показывай пик зарезервированных мест.</div>
<p>Для отчёта: таблица p, время, S, E; графики времени, S(p), E(p) для разных n и разных видов входных данных. Отмечай характеристики CPU: у твоего MacBook 8 логических процессоров.</p>`,
[q("Если T_seq=100 мс и T_par=25 мс, каково S?",["0.25","4","25","100"],1,"100/25=4."),
q("При S=4 и p=8 эффективность?",["200%","50%","8%","12.5%"],1,"4/8=0.5=50%.")]);
add(3,"Закон Амдала и накладные расходы","Лекция №3, закон Амдала; Таненбаум/Бос, §2.2 и планирование",
`<p><strong>Закон Амдала:</strong> если доля последовательной работы равна a, идеальное ускорение на p вычислительных исполнителях ограничено:</p><pre>S(p) = 1 / (a + (1-a)/p)</pre>
<p>Например, при a=0.1 и p=8 ускорение не превысит 1/(0.1+0.9/8)≈4.71 даже без накладных расходов. При p→∞ предел S≤1/a=10.</p>
<p>На практике добавляются <strong>overhead</strong>: создание потоков, синхронизация, планирование, переключение контекста, конкуренция за пропускную способность памяти и кэш, неравномерное разбиение. Поэтому при увеличении p ускорение перестаёт расти или даже падает.</p>
<p>Для QuickSort начальное разбиение исходного массива выполняется последовательно; на маленьких участках создание нового потока часто дороже сортировки, поэтому вводят <strong>grain</strong> (порог распараллеливания).</p>`,
[q("Что ограничивает закон Амдала?",["Максимальную длину массива","Потенциальное ускорение из-за последовательной части","Число возможных PID","Размер int"],1,"Последовательная доля не может быть ускорена добавлением исполнителей."),
q("Почему 1024 потоков могут быть медленнее 8?",["Потому что QuickSort перестаёт сортировать","Из-за планирования, создания потоков и конкуренции за ресурсы","Потому что память разделяется автоматически на 1024 копии","Из-за fprintf всегда"],1,"Больше потоков не означает больше аппаратных ресурсов.")]);
add(3,"Типы входных данных и влияние на алгоритм","PDF ЛР №2; экспериментальный план",
`<p>Тестировать только случайный миллион элементов недостаточно: по заданию изучаем зависимость от входных данных. Запуски <code>-d random</code> (псевдослучайный), <code>sorted</code> (уже отсортированный), <code>reverse</code> (обратный), <code>equal</code> (одинаковые), <code>few</code> (несколько разных значений).</p>
<p>На <code>equal</code> трёхсторонний QuickSort отрабатывает практически линейно, потому что вся область сразу попадает в <code>==pivot</code>, дополнительные потоки не нужны. На <code>sorted</code> медиана трёх часто лучше последнего элемента, но теоретический худший случай O(n²) сохраняется.</p>
<p>Дополнительно сравни размеры, например 100000, 1000000 и 5000000 элементов. Распределения входных значений и порог <code>-g</code> фиксируй при сравнении лимитов потоков.</p>`,
[q("Почему для массива из одинаковых значений может быть peak=1 даже при -t 128?",["Ошибка счётчика","Трёхстороннее разбиение сразу завершает сортировку","Все потоки detached","Ядра отсутствуют"],1,"Нет двух больших независимых частей для распараллеливания."),
q("Нужно ли менять входные данные между seq и par в одном измерении?",["Да, чтобы было честнее","Нет, копируем один и тот же исходный массив","Можно только для n=1","Зависит от PID"],1,"Сравнение должно быть на идентичных данных.")]);
add(4,"MIMD, SIMD, потоки и векторизация","Лекция №3, классификация Флинна",
`<p>Классификация Флинна: <strong>SISD</strong> — одна последовательность команд над одними данными; <strong>SIMD</strong> — одна команда над несколькими данными (векторные инструкции, ARM Neon); <strong>MISD</strong> — несколько команд над одним потоком данных, редкий класс; <strong>MIMD</strong> — разные потоки команд над разными данными (обычная многопроцессорная/многопоточная работа).</p>
<p>Наша параллельная сортировка — пример <strong>MIMD</strong>: разные потоки выполняют одинаковую функцию, но с разными диапазонами и могут находиться на разных инструкциях.</p>
<p>SIMD не эквивалентен pthread: первый — способ обработать несколько значений одной векторной инструкцией, второй — программная организация нескольких потоков выполнения.</p>`,
[q("Какой класс Флинна подходит к параллельному QuickSort на ядрах CPU?",["SIMD","MIMD","MISD","SISD"],1,"Несколько потоков команд работают над различными областями массива."),
q("Что такое SIMD?",["Несколько процессов через pipe","Одна инструкция обрабатывает группу данных","Управление mutex","Ожидание join"],1,"Пример — векторные расширения ARM Neon.")]);
add(4,"Кэш, линии кэша и false sharing","Лекция №4, кэши; пояснение к многопоточности",
`<p>У процессора есть регистры, уровни кэша L1/L2/L3 (организация зависит от архитектуры) и оперативная память. Кэш хранит данные блоками — <strong>линиями кэша</strong> (часто 64 байта). <strong>Cache hit</strong> — нужные данные уже есть в кэше; <strong>cache miss</strong> — требуется обратиться на другой уровень.</p>
<p>Для сортировки важна локальность обращений к памяти. Потоки, работающие с отдельными диапазонами, обычно имеют хорошую пространственную локальность, но могут конкурировать за кэш и пропускную способность памяти.</p>
<p><strong>False sharing</strong> — два потока меняют разные переменные, которые оказываются на одной кэш-линии; из-за когерентности кэшей возникает ненужный обмен линией между ядрами. Это не то же самое, что гонка данных.</p><p>Нельзя говорить, что «атомарная инструкция всегда останавливает все остальные ядра»: это неверное обобщение. Цена синхронизации определяется архитектурой, порядком доступа, состоянием кэша и нагрузкой.</p>`,
[q("Что означает cache miss?",["Данные найдены в L1","Нужной строки нет на рассматриваемом уровне кэша","Процесс завершился","Ошибка malloc"],1,"При промахе данные получают с другого уровня иерархии памяти."),
q("Что такое false sharing?",["Два потока разделяют одну C-переменную без mutex","Потоки меняют разные данные на одной кэш-линии, мешая друг другу","Слияние массивов","Передача mutex в fork"],1,"Даже независимые переменные могут конфликтовать на уровне кэш-линий.")]);
add(4,"Стек, heap и виртуальная память","Лекция №4, виртуальная память; лекции №2–3",
`<p><strong>Стек</strong> каждого потока содержит состояния вызовов, часть локальных переменных и адреса возврата; при рекурсии его глубина важна. <strong>Heap</strong> процесса — область для динамически выделенной памяти, например <code>malloc</code>. Наши массивы выделяются в heap и доступны потокам по указателю.</p>
<p>Виртуальная память даёт процессу адресное пространство, а MMU и таблицы страниц отображают виртуальные адреса на физическую память. TLB кэширует трансляции адресов. <strong>Page fault</strong> возникает при обращении к странице, требующем обработки ОС; это не всегда ошибка программы.</p>
<p><strong>Copy-on-write</strong> экономит память при копировании адресного пространства процесса (например, после fork); для pthread потоки по умолчанию используют одно адресное пространство, копировать массив при создании потока не нужно.</p>`,
[q("У каждого pthread свой стек?",["Да","Нет, стек всегда общий","Только при 8 потоках","Только для detached"],0,"Каждый поток имеет собственный стек и регистровый контекст."),
q("Зачем здесь malloc?",["Для создания потока","Для выделения массивов в динамической памяти","Для записи PID","Для блокировки mutex"],1,"Большой массив на стеке может быть нежелателен; malloc выделяет динамическую память.")]);
add(4,"Системные вызовы и переключение режимов","Лекции №1–2, №4; Таненбаум/Бос, главы 1–2",
`<p>ОС предоставляет приложениям системные вызовы для операций, требующих ядра. В пользовательском режиме код не имеет полного доступа к устройствам и привилегированным регистрам. Ядро управляет ресурсами, планированием, защитой памяти и потоками.</p>
<p>Библиотечная функция <code>pthread_create</code> — пользовательский API POSIX; её реализация использует системные механизмы ОС. Не каждый вызов функции pthread обязательно означает отдельный прямой системный вызов при каждом обращении.</p>
<p><strong>Прерывание</strong> переводит управление обработчику события. <strong>Переключение контекста</strong> сохраняет состояние одного потока и восстанавливает состояние другого; это требует ресурсов и может портить локальность кэша.</p>`,
[q("Что такое системный вызов?",["Обращение программы к услугам ядра ОС","Любая функция C","Сортировка трёх чисел","Любой вызов функции с void *"],0,"Системный вызов пересекает границу между пользовательским кодом и услугами ядра."),
q("Всегда ли pthread_mutex_lock напрямую вызывает ядро?",["Да","Не обязательно, неконкурентный путь может выполняться в пользовательском пространстве","Только при -t 1","Mutex никогда не использует ядро"],1,"Реализации pthread оптимизируют uncontended path; ожидание может требовать поддержки ядра.")]);
add(5,"Разбор нашего quicksort.c","Исходный файл src/quicksort.c",
`<h3>Главные функции</h3><p><code>median_of_three(a,b,c)</code> выбирает медиану трёх значений для опоры. <code>partition_three(a,lo,hi,&lt,&gt)</code> переставляет числа на три группы. <code>sequential_range()</code> сортирует меньшую часть рекурсивно, большую циклом.</p>
<p><code>parallel_range()</code> сначала выполняет разбиение, затем передаёт <strong>большую</strong> часть новому потоку при наличии лимита и достаточного объёма работы, а меньшую сортирует текущим. При отсутствии места или при маленьких задачах выполняет сортировку последовательно. </p>
<pre>if (large_size >= grain &&\n    small_size >= grain / 4 &&\n    reserve_thread(ctx)) {\n    pthread_create(...);\n    parallel_range(...small...);\n    pthread_join(...);\n    release_thread(ctx);\n}</pre>
<p>Важное отличие от старого кода: поток создаётся не «всегда на правую часть», а <strong>на ту, где больше работы</strong>. Дополнительное условие на меньшую часть помогает избежать создания потока, когда одному исполнителю почти нечего сортировать.</p>`,
[q("Как выбирается часть для нового потока?",["Всегда левая","Всегда правая","Большая из двух после partition","Случайная"],2,"Это позволяет эффективнее использовать параллелизм при неравномерном разбиении."),
q("Почему есть условие small_size >= grain/4?",["Чтобы контролировать эффективность разбиения и не создавать поток при почти пустой второй части","Чтобы запретить массивы из int","Для вычисления медианы","Для памяти mmap"],0,"Если вторая часть слишком мала, создание потока может почти не ускорить работу.")]);
add(5,"Счётчики, аргументы, join, обработка ошибок","Исходный файл src/quicksort.c; POSIX Threads",
`<p><code>ThreadContext</code> содержит <code>max_threads</code>, <code>reserved</code>, <code>peak_reserved</code>, <code>created_total</code>, <code>failures</code>, порог <code>grain</code> и <code>pthread_mutex_t</code>.</p>
<p><code>reserve_thread()</code> под мьютексом проверяет лимит и увеличивает зарезервированные места. <code>release_thread()</code> уменьшает счётчик только после успешного join. Если создание нового потока не удалось, резерв освобождается, работа выполняется текущим потоком и ошибка регистрируется.</p>
<p><code>thread_entry(void *argument)</code> — обёртка, удовлетворяющая сигнатуре pthread: преобразует <code>void *</code> в <code>SortTask *</code> и вызывает рекурсивную сортировку. <code>pthread_create</code> возвращает код ошибки, <code>pthread_join</code> ожидает завершения.</p>
<div class="warning">Пик зарезервированных мест может быть больше текущего числа работающих потоков ОС: завершившийся, но ещё не присоединённый поток занимает место до join. В окончательных измерениях нельзя выдавать <code>peak_reserved</code> за число одновременно исполнявшихся ядер.</div>`,
[q("Почему счётчик изменяется под mutex?",["Так быстрее","Проверка лимита и изменение должны быть согласованы между потоками","Потому что pivot отрицательный","Потому что pthread_join запрещает массивы"],1,"Иначе несколько потоков могут одновременно увидеть свободное место и превысить лимит."),
q("Что делает release_thread?",["Убивает поток в ОС","Уменьшает учёт занятых мест после join","Создаёт mutex","Выбирает pivot"],1,"Это обычная функция учёта, а не системное уничтожение потока.")]);
add(5,"Тесты, Makefile, терминал и отчёт","src/bench.c; tests/test_sort.c; требования PDF",
`<pre>make\nmake test\n./lab2 -t 8 -n 1000000 -r 10 -d random\n./lab2 -t 128 -n 5000000 -d reverse\n./lab2 -t 8 -n 1000000 --csv</pre>
<p><code>-t</code> — лимит потоков; <code>-n</code> — количество элементов; <code>-r</code> — число повторов; <code>-d</code> — вид входных данных; <code>-g</code> — порог распараллеливания; <code>--csv</code> — табличная строка.</p>
<p><strong>test_sort.c</strong> отдельно от производственного кода проверяет 360 комбинаций длины, распределения и лимита потоков, плюс отдельную проверку двух потоков. Только в <em>тестах</em> используется библиотечный <code>qsort</code> для сравнения результата — алгоритм сортировки лабораторной написан самостоятельно.</p>
<p>Для проверки потоков стандартными средствами macOS: <code>ps -M -p PID</code> во время выполнения. На короткой сортировке потоков можно не успеть увидеть. В отчёте отдельно указывай, что было реально наблюдено, а что является счётчиком программы.</p>`,
[q("Зачем в тестах qsort, если вариант — QuickSort?",["Тесты используют qsort только как эталон; производственная реализация собственная","Чтобы заменить лабораторную библиотечной сортировкой","Для создания потоков","Для вывода массива"],0,"Сравнение с независимым эталоном помогает обнаружить ошибки."),
q("Почему нужен отдельный bench.c?",["Чтобы держать измерения и аргументы командной строки отдельно от алгоритма","Чтобы заменить pthread","Чтобы приложение занимало больше памяти","Потому что в C может быть несколько main в одном исполняемом файле"],0,"Модули разделяют обязанности и упрощают тестирование.")]);
add(5,"Устная защита: частые дополнительные вопросы","Лекции №1–4; Таненбаум/Бос, глава 2; подготовка к коллоквиуму",
`<h3>Что отвечать кратко</h3><p><strong>Что такое PID?</strong> Идентификатор процесса. <strong>А TID?</strong> Идентификатор потока в соответствующей модели ОС; <code>pthread_t</code> — переносимый дескриптор pthread, не обязан быть числом.</p>
<p><strong>Почему threads быстрее процессов?</strong> Создание/обмен данными часто дешевле, потому что используется одно адресное пространство; но не всегда и не на всех нагрузках.</p>
<p><strong>Чем mutex отличается от semaphore?</strong> Mutex даёт исключительное владение, семафор может учитывать доступные ресурсы счётчиком. <strong>Что такое deadlock?</strong> Цикл ожиданий удерживаемых ресурсов.</p>
<p><strong>Зачем join?</strong> Дождаться завершения работы и не уничтожить локальные аргументы раньше времени. <strong>Почему не нужен mutex на массив?</strong> Разделённые диапазоны не пересекаются.</p>
<p><strong>Что такое зомби-процесс?</strong> Завершившийся дочерний процесс, чей статус ещё не получен родителем через wait; pthread и zombie process не одно и то же.</p>
<p><strong>Чем время wall-clock отличается от CPU-time?</strong> Первое — реальная длительность интервала; второе — CPU-время работы. Для оценки скорости сортировки использовано monotonic wall-clock.</p>
<p><strong>Что такое heap/stack, cache line, context switch, syscall?</strong> Эти темы разбираются в предыдущих модулях; преподаватель может спросить их как связанную теорию.</p>`,
[q("pthread_t и PID — одно и то же?",["Да","Нет, pthread_t идентифицирует поток в pthread API, PID — процесс","Да, кроме macOS","Оба означают размер стека"],1,"Не отождествляй разные модели идентификаторов."),
q("Почему на одном потоке parallel QuickSort может быть медленнее sequential?",["Из-за мьютекса и дополнительных проверок даже без реального параллелизма","Потому что массив другой","Потому что CPU выключает кэш","Это невозможно"],0,"Параллельная обёртка имеет дополнительные проверки и учёт.")]);

function lesson(i){
 chosen=i;const l=LESSONS[i];if(!l)return;setMode("theory");$("bread").textContent=MODULES[l.m][1]+" / "+l.title;drawNav();window.scrollTo(0,0);
 $("view").innerHTML='<div class="lessonhead"><div class="eyebrow">Модуль '+MODULES[l.m][0]+' · урок '+(i+1)+' / '+LESSONS.length+'</div><h1 class="h2">'+safe(l.title)+'</h1><div class="source">Источник: '+safe(l.source)+'</div></div><article class="panel theory">'+l.body+'</article><section><h2 class="h2">Проверь понимание</h2><p class="muted">Выбери ответ. После выбора появится объяснение.</p><div id="qs"></div></section><div class="lessonfoot"><button class="control" onclick="lesson('+Math.max(0,i-1)+')">← Предыдущий</button><button class="control primary" id="doneBtn" onclick="markDone('+i+')">'+(done[i]?"✓ Пройдено":"Отметить пройденным")+'</button><button class="control" onclick="lesson('+Math.min(LESSONS.length-1,i+1)+')">Следующий →</button></div>';
 l.qs.forEach((q,k)=>showQuestion($("qs"),q,i+"-"+k,true));
}
function markDone(i){done[i]=true;save();drawNav();$("doneBtn").textContent="✓ Пройдено"}
function showQuestion(container,q,key,immediate){
 const box=document.createElement("div");box.className="qcard";box.innerHTML='<h3>'+safe(q[0])+'</h3><div class="options"></div><div class="explain hidden"></div>';const opts=box.querySelector(".options"),ex=box.querySelector(".explain");
 q[1].forEach((choice,j)=>{const b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+j)+". "+choice;b.onclick=()=>{
 if(box.dataset.answered)return;box.dataset.answered="1";Array.from(opts.children).forEach((o,k)=>{o.disabled=true;if(k===q[2])o.classList.add("correct");else if(k===j)o.classList.add("wrong")});
 ex.textContent=(j===q[2]?"Верно. ":"Неверно. ")+q[3];ex.classList.remove("hidden");
 };opts.appendChild(b)});
 container.appendChild(box);return box;
}
function allQuestions(){let all=[];LESSONS.forEach((l,i)=>l.qs.forEach(q=>all.push({q:q,lesson:i})));return all}
function shuffle(a){let out=a.slice();for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function startExam(){
 clearInterval(clockId);chosen=-1;setMode("exam");drawNav();$("bread").textContent="Тренировочный экзамен";
 exam=shuffle(allQuestions()).slice(0,15);examAnswers=Array(15).fill(-1);timer=12*60;
 $("view").innerHTML='<div class="eyebrow">ТРЕНИРОВКА К ЗАЩИТЕ</div><h1 class="h2">Экзамен · 15 вопросов</h1><p class="lead">Случайные вопросы по всей теории. 12 минут, один ответ на вопрос. Для тренировки на 4–5 стремись к 12–15 правильным ответам; это не официальная система оценивания преподавателя.</p><div class="panel" style="display:flex;align-items:center;justify-content:space-between"><strong id="examClock">12:00</strong><span id="examCounter">0 / 15 ответов</span></div><div id="examQuestions"></div><div class="toolbar"><button class="control primary" onclick="finishExam()">Проверить ответы</button><button class="control" onclick="startExam()">Другой вариант</button></div><div id="examResult"></div>';
 const host=$("examQuestions");exam.forEach((item,i)=>{
 let div=document.createElement("div");div.className="qcard";div.innerHTML='<h3>'+(i+1)+'. '+safe(item.q[0])+'</h3><div class="options"></div>';item.q[1].forEach((choice,j)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+j)+". "+choice;b.onclick=()=>{examAnswers[i]=j;Array.from(div.querySelector(".options").children).forEach((el,k)=>el.classList.toggle("selected",k===j));$("examCounter").textContent=examAnswers.filter(x=>x!==-1).length+" / 15 ответов"};div.querySelector(".options").appendChild(b)});host.appendChild(div)
 });clockId=setInterval(()=>{timer--;if($("examClock"))$("examClock").textContent=Math.floor(timer/60)+":"+String(timer%60).padStart(2,"0");if(timer<=0)finishExam()},1000);window.scrollTo(0,0);
}
function finishExam(){
 clearInterval(clockId);if(!exam.length || $("examResult")?.dataset.finished)return;let score=0;
 const cards=$("examQuestions").children;exam.forEach((item,i)=>{const q=item.q,box=cards[i];if(examAnswers[i]===q[2])score++;Array.from(box.querySelector(".options").children).forEach((el,j)=>{el.disabled=true;if(j===q[2])el.classList.add("correct");else if(j===examAnswers[i])el.classList.add("wrong")});const d=document.createElement("div");d.className="explain";d.textContent="Правильный ответ: "+q[1][q[2]]+". "+q[3];box.appendChild(d)});
 let result=$("examResult");result.dataset.finished="1";result.innerHTML='<div class="panel"><h2>Результат: '+score+' / '+exam.length+'</h2><p>'+(score>=13?"Очень хорошее знание материала.":score>=10?"Основы освоены; повтори ошибки.":"Стоит пройти теорию и повторить карточки.")+'</p><button class="control primary" onclick="startExam()">Пройти ещё раз</button></div>';result.scrollIntoView({behavior:"smooth"});
}
function flashcards(){
 chosen=-1;setMode("flash");drawNav();$("bread").textContent="Карточки для повторения";flashIndex=0;flashShow=false;renderFlash();
}
function renderFlash(){
 const all=allQuestions();if(!all.length)return;flashIndex=(flashIndex+all.length)%all.length;const item=all[flashIndex],q=item.q;
 $("view").innerHTML='<div class="eyebrow">ПОВТОРЕНИЕ</div><h1 class="h2">Карточки · '+(flashIndex+1)+' / '+all.length+'</h1><div class="flash"><div class="eyebrow">'+safe(MODULES[LESSONS[item.lesson].m][1])+'</div><h2>'+safe(q[0])+'</h2><div class="answer '+(flashShow?"":"hidden")+'"><strong>'+safe(q[1][q[2]])+'</strong><p>'+safe(q[3])+'</p></div></div><div class="toolbar"><button class="control" onclick="flashIndex--;flashShow=false;renderFlash()">← Назад</button><button class="control primary" onclick="flashShow=!flashShow;renderFlash()">'+(flashShow?"Скрыть ответ":"Показать ответ")+'</button><button class="control" onclick="flashIndex++;flashShow=false;renderFlash()">Дальше →</button><button class="control" onclick="flashIndex=Math.floor(Math.random()*all.length);flashShow=false;renderFlash()">Случайная</button></div><p class="muted">Формулируй ответ вслух до открытия карточки.</p>';window.scrollTo(0,0)
}
$("theoryBtn").onclick=()=>home();$("flashBtn").onclick=()=>flashcards();$("examBtn").onclick=()=>startExam();
$("menuBtn").onclick=()=>{$("sidebar").classList.toggle("open");$("overlay").classList.toggle("open")};$("overlay").onclick=closeMenu;
$("resetProgress").onclick=()=>{if(confirm("Сбросить отметки пройденных уроков?")){done={};save();drawNav();if(chosen>=0)lesson(chosen)}};
home();
</script>
</body></html>
